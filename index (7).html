    if(!raz.dataset.sur){
      raz.dataset.sur='1';
      raz.classList.add('danger');
      raz.textContent='Effacer ce navigateur uniquement ?';
      return;
    }
    const n=await toutEffacer();
    sessionPseudo=null;modeAuth='inscription';ecranAuth();
    alerteCourte(`${n} entrée(s) effacée(s) sur cet appareil.<br>Les serveurs et les autres joueurs ne sont pas touchés.`);
  };
  h.appendChild(raz);
  const etat=el('div','etatNuage','Vérification du serveur…');
  h.appendChild(etat);
  Nuage.tester().then(ok=>{
    etat.className='etatNuage '+(ok?'ok':'hors');
    etat.textContent=ok
      ? 'Serveur en ligne : ton compte te suivra d\'un appareil à l\'autre.'
      : 'Serveur injoignable : le jeu fonctionne en local sur cet appareil.';
  });
  h.appendChild(el('div','hint','Les comptes sont enregistrés dans ce navigateur uniquement. Rien n\'est envoyé sur un serveur : c\'est fait pour séparer plusieurs managers sur un même appareil, pas pour protéger un compte en ligne.'));
  w.appendChild(h);

async function validerClub(nomClub,contexte){
  $('#app').innerHTML='<div class="chargement">Préparation de la saison…</div>';
  await new Promise(r=>setTimeout(r,30));
  if(contexte.mode==='creer'){
    let srv;
    if(Nuage.connecte()){
      // le serveur naît dans la base : tout le monde le verra
      if(!(await peutCreerServeur(sessionPseudo))){
        ecranServeurs();
        alerteCourte(`Ouvrir un serveur demande ${SERIE_REQUISE} jours de jeu consécutifs.`);
        return;
      }
      let code=genererCode();
      const graine='g'+Math.floor(Math.random()*1e9).toString(36);
      srv=await Nuage.creerServeurNuage(code,graine,false,null);
      if(!srv){ecranServeurs();alerteCourte('Le serveur n\'a pas pu être créé en ligne.');return;}
      const entree=await entrerServeurPartage(srv,nomClub);
      if(entree.err){ecranServeurs();alerteCourte(entree.err);return;}
    }else{
      srv=await creerServeur(nomClub,sessionPseudo);
      if(srv&&srv.err){ecranServeurs();alerteCourte(srv.err);return;}
    }
    rendre();
    alerteCourte(`Serveur créé. Ton code d'accès : <b class="codeGros">${srv.code}</b><br>Ouvert à tous pendant 3 jours. Ensuite, ce code — visible dans le profil des managers du serveur — devient obligatoire.`);
  }else{
    const res=Nuage.connecte()&&contexte.srv.distant
      ? await entrerServeurPartage(contexte.srv,nomClub)
      : await entrerDansServeur(contexte.srv,sessionPseudo,nomClub);
    if(res.err){ecranServeurs();alerteCourte(res.err);return;}
    rendre();
  }
}

    const jr=S.journees[d];
    // 12h00 : la coupe du jour, s'il y en a une
    if(jr.coupe){
      if(jr.coupe.t==='N'){
        const c=S.coupesNat[CL(S.monClub).ligue];
        const nm={P:'Tour préliminaire',H:'8es de finale',Q:'Quarts de finale',S:'Demi-finales',F:'Finale'}[jr.coupe.ronde];
        (c.tour[jr.coupe.ronde]||[]).forEach(p=>{
          if(p[0]===S.monClub||p[1]===S.monClub)
            mesMatchs.push({d,dom:p[0],ext:p[1],comp:c.nom,label:nm,cls:'coupe',heure:HEURE_COUPE});
        });
      }else{
        const lt=jr.coupe.ronde[0],leg=jr.coupe.ronde[1];
        const nm=(TOURS_EURO.find(x=>x[0]===lt)||['','Tour'])[1];
        ['LDC','EL'].forEach(k=>{
          (S.coupes[k].tour[lt]||[]).forEach(p=>{
            const inv=(leg==='2');
            const dom=inv?p[1]:p[0],ext=inv?p[0]:p[1];
            if(dom===S.monClub||ext===S.monClub)
              mesMatchs.push({d,dom,ext,comp:S.coupes[k].nom,
                label:nm+(lt!=='F'&&leg?' · match '+leg:''),cls:'coupe',heure:HEURE_COUPE,
                agg:(leg==='2'&&p.score)?[p.score[1],p.score[0]]:null});
          });
        });
      }
    }
    // 18h00 : le championnat
    LEAGUES.forEach(lg=>{
      (S.calendriers[lg.id][jr.idx-1]||[]).forEach(([a2,b2])=>{
        if(a2===S.monClub||b2===S.monClub)
          mesMatchs.push({d,dom:a2,ext:b2,comp:lg.nom,label:'Journée #'+jr.idx,heure:HEURE_LIGUE});
      });
    });
  }
  const bloc=el('div','liste');
  const fait=r=>S.resultats.find(x=>x.jour===r.d&&(x.dom===r.dom&&x.ext===r.ext));
  const passes=mesMatchs.filter(m=>m.d<S.jour).slice(-3);
  const futurs=mesMatchs.filter(m=>m.d>=S.jour).slice(0,6);
  const rendreLigne=(m,etat)=>{
    const r=S.resultats.find(x=>x.jour===m.d&&x.dom===m.dom&&x.ext===m.ext);
    const score=r?`${r.ga} – ${r.gb}`:'–';
    const c=el('div','match '+(m.cls||'')+(etat==='today'?' focus':''));
    c.innerHTML=`<div class="mdate">${dateJournee(m.d)}${m.d===S.jour?" · Aujourd'hui":''} · ${m.heure||HEURE_LIGUE}</div>

        <div class="mcentre"><div class="mscore">${score}</div>${m.agg?`<div class="magg">${m.agg[0]}–${m.agg[1]}</div>`:''}</div>
        <div class="mteam">${maillotSVG(CL(m.ext),124)}<b>${m.ext}</b></div>
      </div>`;
    if(r){c.classList&&c.classList.add('cliquable');c.onclick=()=>modaleScore(r);}
    return c;
  };
  if(passes.length){bloc.appendChild(el('div','sep','Déjà joué'));passes.forEach(m=>bloc.appendChild(rendreLigne(m)));}
  if(futurs.length){
    bloc.appendChild(el('div','sep','Prochain match'));

    if(futurs.length>1){bloc.appendChild(el('div','sep','À venir'));futurs.slice(1).forEach(m=>bloc.appendChild(rendreLigne(m)));}

  v.appendChild(bloc);
  if(S.jour<S.journees.length){

    const attente=attenteAvantJournee();

    const ecrire=()=>{
      const reste=attenteAvantJournee();
      const h=Math.floor(reste/3600000), mn=Math.floor(reste%3600000/60000), s=Math.floor(reste%60000/1000);
      const j=Math.floor(reste/86400000);
      const duree=j?`${j} j ${h} h ${mn} min`:(h?`${h} h ${mn} min ${String(s).padStart(2,'0')}`:`${mn} min ${String(s).padStart(2,'0')}`);
      compte.innerHTML=`<span>Journée ${S.jour+1} sur ${S.journees.length} · ${dateJournee(S.jour)}</span>`+
        `<b>${reste<=0?'en cours…':duree}</b>`+
        `<span>Coup d'envoi à ${HEURE_COUP_ENVOI}h00, heure de Paris. Le calendrier suit le temps réel.</span>`;
    };
    ecrire();
    clearInterval(minuteur);
    minuteur=setInterval(()=>{
      if(!S||S.observation||ongletActif!=='cal'){clearInterval(minuteur);return;}
      if(attenteAvantJournee()<=0){clearInterval(minuteur);avancerEtAfficher();return;}
      ecrire();
    },1000);
    v.appendChild(compte);
  }else{
    const t=trierClassement(S.classements[CL(S.monClub).ligue]);
    const rang=t.findIndex(x=>x.club===S.monClub)+1;
    v.appendChild(el('div','fin',`Saison ${S.saison} terminée — ${rang}<sup>${rang===1?'er':'e'}</sup> de ${LEAGUES.find(l=>l.id===CL(S.monClub).ligue).nom}.`));

    const b=el('button','cta','Lancer la saison '+(S.saison+1));
    b.onclick=()=>{modaleBilan(true);};
    v.appendChild(b);
  }
}

/* ---------- panneau d'une coupe : une phase à la fois ---------- */
function toursDe(cur,coupe){
  return (cur.type==='N'
    ? [['P','Tour préliminaire'],['H','8es de finale'],['Q','Quarts de finale'],['S','Demi-finales'],['F','Finale']]
    : TOURS_EURO).filter(([lt])=>coupe.tour[lt]&&coupe.tour[lt].length);
}
function panneauCoupe(v,coupe,cur,etat){
  const compRes=cur.id;
  const tours=toursDe(cur,coupe);
  if(!tours.length){v.appendChild(el('div','fin','Le tirage arrive après quelques journées.'));return;}
  const manches=manchesDe(coupe,tours,cur.type==='C');

  const jouee=m=>S.resultats.some(r=>r.comp===compRes&&String(r.jn).indexOf(m.nm)===0&&
    (!m.leg||String(r.jn).endsWith('match '+m.leg)));
  if(etat.tour==null){
    const derniere=manches.map(jouee).lastIndexOf(true);
    etat.tour=derniere>=0?derniere:0;
  }
  etat.tour=Math.max(0,Math.min(manches.length-1,etat.tour));
  const m=manches[etat.tour];

  const volet=x=>x?{
    jour:jourDeManche(cur.type,x.lt,x.leg,null),
    titre:x.nm,
    bas:x.leg?(x.leg==='1'?'Match aller':'Match retour'):'Match unique'
  }:null;
  v.appendChild(navTours(volet(manches[etat.tour-1]),volet(m),volet(manches[etat.tour+1]),
    ()=>{etat.tour--;rendre();},()=>{etat.tour++;rendre();}));

  if(coupe.vainqueur)v.appendChild(el('div','laureat',
    `${maillotSVG(CL(coupe.vainqueur),44)}<div><span>Vainqueur</span><b>${coupe.vainqueur}</b></div>`));

  coupe.tour[m.lt].forEach(p=>{
    const inv=(m.leg==='2');
    const dom=inv?p[1]:p[0], ext=inv?p[0]:p[1];
    const r=S.resultats.find(x=>x.comp===compRes&&x.dom===dom&&x.ext===ext&&
      String(x.jn).indexOf(m.nm)===0&&(!m.leg||String(x.jn).endsWith('match '+m.leg)));
    const derniere=cur.type!=='C'||m.leg!=='1';
    let gagnant=null;
    if(derniere&&r&&tourTermine(coupe,m.lt,p)){
      if(cur.type==='C'&&p.score)gagnant=p.score[0]>p.score[1]?p[0]:p.score[1]>p.score[0]?p[1]:null;
      else if(r.tab)gagnant=r.tab[0]>r.tab[1]?dom:ext;
      else if(r.ga!==r.gb)gagnant=r.ga>r.gb?dom:ext;
    }
    const cumul=(derniere&&cur.type==='C'&&p.score)?`cumul ${p.score[0]} – ${p.score[1]}`:
                (r&&r.tab?`tirs au but ${r.tab[0]} – ${r.tab[1]}`:'');
    v.appendChild(ligneAffiche(dom,ext,r,{gagnant,cumul,heure:HEURE_COUPE}));
  });
}

    .concat([{id:'LDC',nom:'Ligue des Champions',type:'C'},
             {id:'EL', nom:'Europa League',      type:'C'}]);

function calendrierCoupes(v){

/* Repère temporel d'une manche : à quelle journée elle se joue. */
function jourDeManche(type,lt,leg,idxLigue){
  for(let d=0;d<S.journees.length;d++){
    const jr=S.journees[d];
    if(type==='L'&&jr.idx===idxLigue)return d;
    if(!jr.coupe)continue;
    if(type==='C'&&jr.coupe.t==='C'&&jr.coupe.ronde[0]===lt&&(!leg||jr.coupe.ronde[1]===leg))return d;
    if(type==='N'&&jr.coupe.t==='N'&&jr.coupe.ronde===lt)return d;
  }
  return -1;
}
function repereJour(d){
  if(d<0)return '';
  if(d===S.jour)return "Aujourd'hui";
  return dateJournee(d);
}

function navTours(avant,courant,apres,onPrec,onSuiv){

    return b;
  };
  const prec=cote(avant,'g'), suiv=cote(apres,'d');
  if(avant)prec.onclick=onPrec;

    `<span class="nth">${repereJour(courant.jour)}</span><b>${courant.titre}</b><span class="ntb">${courant.bas||''}</span>`);
  bloc.append(prec,centre,suiv);
  return bloc;
}

    notes=`<div class="pseudos"><span>${nomManager(r.dom)}</span><span>${nomManager(r.ext)}</span></div>

/* ---------- équipe ---------- */
let sel=null; // {type:'onze',slot} | {type:'reserve',id}

/* ---------- glisser-déposer ----------
   Sur mobile, faire glisser un joueur est plus naturel que deux touchers.
   Le tap reste possible : on ne bascule en glissement qu'au-delà de
   quelques pixels, pour ne pas voler les touchers courts. */
let glisse=null;

function rendreDeplacable(element,origine){
  const demarrer=e=>{
    const t=e.touches?e.touches[0]:e;
    glisse={origine,x0:t.clientX,y0:t.clientY,actif:false,element,fantome:null};
  };
  const bouger=e=>{
    if(!glisse||glisse.element!==element)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-glisse.x0, dy=t.clientY-glisse.y0;
    if(!glisse.actif){
      if(Math.hypot(dx,dy)<10)return;          // encore un simple toucher
      glisse.actif=true;
      element.classList.add('enleve');
      const f=element.cloneNode(true);
      f.className='fantome';
      f.style.width=element.offsetWidth+'px';
      f.style.height=element.offsetHeight+'px';
      document.body.appendChild(f);
      glisse.fantome=f;
      sel=glisse.origine;                       // la cible s'éclaire comme au tap
      surlignerCibles(true);
    }
    if(e.cancelable)e.preventDefault();
    const f=glisse.fantome;
    f.style.left=(t.clientX-f.offsetWidth/2)+'px';
    f.style.top=(t.clientY-f.offsetHeight/2)+'px';
    marquerSurvol(t.clientX,t.clientY);
  };
  const lacher=e=>{
    if(!glisse||glisse.element!==element)return;
    const enCours=glisse.actif;
    const t=(e.changedTouches&&e.changedTouches[0])||e;
    if(glisse.fantome)glisse.fantome.remove();
    element.classList.remove('enleve');
    const arrivee=enCours?cibleSous(t.clientX,t.clientY):null;
    const depart=glisse.origine;
    glisse=null;
    surlignerCibles(false);
    if(!enCours)return;                         // simple toucher : le clic suit
    if(arrivee){ sel=depart; toucher(arrivee); }
    else { sel=null; rendre(); }
  };
  element.addEventListener('touchstart',demarrer,{passive:true});
  element.addEventListener('touchmove',bouger,{passive:false});
  element.addEventListener('touchend',lacher);
  element.addEventListener('touchcancel',lacher);
  element.addEventListener('mousedown',demarrer);
  element.addEventListener('mousemove',bouger);
  element.addEventListener('mouseup',lacher);
}

/* Retrouve l'emplacement situé sous le doigt. */
function cibleSous(x,y){
  const sous=document.elementFromPoint(x,y);
  if(!sous)return null;
  const hote=sous.closest?sous.closest('[data-cible]'):null;
  if(!hote)return null;
  try{ return JSON.parse(hote.dataset.cible); }catch(e){ return null; }
}
function marquerSurvol(x,y){
  const sous=document.elementFromPoint(x,y);
  const hote=sous&&sous.closest?sous.closest('[data-cible]'):null;
  document.querySelectorAll('[data-cible]').forEach(n=>{
    n.classList.toggle('survol',n===hote);
  });
}
function surlignerCibles(actif){
  document.querySelectorAll('[data-cible]').forEach(n=>{
    n.classList.toggle('cible',actif);
    if(!actif)n.classList.remove('survol');
  });
}

function selectionne(j,slot){
  if(!sel)return false;
  return sel.type==='onze'?sel.slot===slot:(j&&sel.id===j.id);
}
function toucher(cible){
  // cible : {type:'onze',slot} ou {type:'reserve',id}
  if(!sel){sel=cible;rendre();return;}
  const meme=(sel.type===cible.type)&&(sel.type==='onze'?sel.slot===cible.slot:sel.id===cible.id);
  if(meme){sel=null;rendre();return;}
  echanger(sel,cible);
  sel=null;rendre();
}

    p.style.left=pl[i][0]+'%';p.style.top=pl[i][1]+'%';
    p.innerHTML=j?`<span class="poste${fitPoste(j,poste)<0.9?' hs':''}">${poste}</span>${badgesBonus(j,true)}${vignette(j,48)}<span class="nomj">${j.nom}</span>${htmlEtoiles(j.note)}`
      :`<span class="poste">${poste}</span><span class="vide">+</span><span class="nomj">Libre</span>`;
    p.dataset.cible=JSON.stringify({type:'onze',slot:i});
    p.onclick=()=>toucher({type:'onze',slot:i});
    rendreDeplacable(p,{type:'onze',slot:i});
    terrain.appendChild(p);
  });
  v.appendChild(terrain);

  const res=reserve();
  const titre=el('div','sep',sel?'Touche un joueur pour l\'échange':'Remplaçants · glisse pour permuter');
  v.appendChild(titre);
  const row=el('div','bancrow');
  res.forEach(j=>{
    const actif=sel&&sel.type==='reserve'&&sel.id===j.id;
    const c=el('button','bj'+(j.blesse||j.suspendu?' ko':'')+(actif?' actif':'')+(sel&&!actif?' cible':''));
    c.innerHTML=`<span class="poste alt">${j.poste}</span>${badgesBonus(j,true)}${vignette(j,44)}
      <span class="nomj">${j.nom}</span>${htmlEtoiles(j.note)}
      ${j.blesse?'<span class="etat">blessé</span>':j.suspendu?'<span class="etat">susp.</span>':''}`;
    c.dataset.cible=JSON.stringify({type:'reserve',id:j.id});
    c.onclick=()=>toucher({type:'reserve',id:j.id});
    rendreDeplacable(c,{type:'reserve',id:j.id});
    row.appendChild(c);
  });
  v.appendChild(row);

  if(sel){
    const idSel=sel.type==='onze'?S.onze[sel.slot]:sel.id;
    const js=idSel?J(idSel):null;
    const barreSel=el('div','barresel');
    barreSel.innerHTML=`<div class="bsinfo">${js?`<b>${js.nom}</b><span>${js.poste} · ${js.age} ans · forme ${js.forme}</span>`:'<b>Emplacement libre</b><span>Choisis un joueur</span>'}</div>`;
    if(js){
      const fiche=el('button','bsb','Fiche');
      fiche.onclick=()=>ficheJoueur(js);
      barreSel.appendChild(fiche);
    }
    const annuler=el('button','bsb annul','Annuler');
    annuler.onclick=()=>{sel=null;rendre();};
    barreSel.appendChild(annuler);
    v.appendChild(barreSel);
  }else{
    v.appendChild(el('div','hint','Touche un joueur puis un autre pour les permuter. Le poste passe en orange si le joueur y est hors de position.'));
  }

  $('#selForm').onchange=e=>{S.formation=e.target.value;completerOnze();sel=null;rendre();};
  $('#selStyle').onchange=e=>{S.style=e.target.value;rendre();};
  $('#selMent').onchange=e=>{S.consignes.mentalite=e.target.value;sauver();rendre();};
  $('#selPres').onchange=e=>{S.consignes.pression=e.target.value;sauver();rendre();};
  $('#selLarg').onchange=e=>{S.consignes.largeur=e.target.value;sauver();rendre();};
}

/* ---------- guide tactique ----------
   Ce que chaque style apporte, ce qu'il domine et ce qui le contrarie. */
const DESCRIPTIONS_STYLES={
  'Équilibré':'Aucun parti pris. Solide partout, tranchant nulle part : le repli quand on ne sait pas à quoi s\'attendre.',
  'Jeu de passes':'Construction patiente par courtes passes. Bon contrôle du ballon, mais vulnérable à un adversaire qui vient presser haut.',
  'Possession':'Garder le ballon pour priver l\'adversaire. Très sûr contre les équipes directes, mais offre des boulevards en contre.',
  'Tiki-taka':'Possession poussée à l\'extrême. Maîtrise maximale du milieu, exposition maximale si le ballon est perdu haut.',
  'Jeu direct':'Chercher l\'attaquant sans transition inutile. Contourne le pressing, mais laisse le ballon.',
  'Jeu long':'Longs ballons par-dessus le milieu. L\'arme classique contre le pressing, inefficace face à un bloc bas.',
  'Contre-attaque':'Bloc compact et transitions rapides. Punit les équipes qui montent, souffre contre celles qui reculent.',
  'Bloc bas':'Se refermer et attendre. Étouffe les équipes de possession, impuissant face au jeu long.',
  'Pressing haut':'Récupérer près du but adverse. Étouffe la construction courte, se fait transpercer par un ballon long.',
  'Gegenpressing':'Presser immédiatement à la perte. Le plus étouffant, et le plus risqué : la moindre passe par-dessus fait mal.',
  'Jeu sur les ailes':'Étirer le jeu et centrer. Efficace contre une défense resserrée dans l\'axe.',
  'Jeu intérieur':'Combiner dans le couloir central. Prend le dessus sur les équipes qui jouent large.'
};
function vueGuideTactique(){
  const v=$('#vue');v.innerHTML='';
  const retour=el('button','lien','Retour à l\'équipe');
  retour.onclick=()=>{ongletActif='eq';rendre();};
  v.appendChild(retour);

  v.appendChild(el('div','hint','Un style prend l\'ascendant sur certains autres et se fait contrarier par d\'autres. Ces avantages s\'ajoutent à la qualité des joueurs : ils ne la remplacent pas.'));

  v.appendChild(el('div','sep','Styles de jeu'));
  Object.keys(STYLES).forEach(nom=>{
    const st=STYLES[nom];
    const contre=CONTRES[nom]||{};
    const forts=Object.keys(contre).filter(k=>contre[k]>0).sort((a,b)=>contre[b]-contre[a]);
    const faibles=Object.keys(contre).filter(k=>contre[k]<0).sort((a,b)=>contre[a]-contre[b]);
    const c=el('div','carteTac'+(nom===S.style?' actif':''));
    c.innerHTML=`<div class="tacTitre">${nom}${nom===S.style?'<i class="tagH">en cours</i>':''}</div>
      <div class="tacTexte">${DESCRIPTIONS_STYLES[nom]||''}</div>
      <div class="tacJauges">
        ${jaugeTac('Attaque',st.att,-3,6)}${jaugeTac('Défense',st.def,-3,6)}
        ${jaugeTac('Possession',st.poss,-8,9)}${jaugeTac('Risque',st.risque,-4,5)}
      </div>
      ${forts.length?`<div class="tacRel bon"><b>Prend le dessus sur</b> ${forts.join(', ')}</div>`:''}
      ${faibles.length?`<div class="tacRel mauvais"><b>Est contrarié par</b> ${faibles.join(', ')}</div>`:''}`;
    v.appendChild(c);
  });

  v.appendChild(el('div','sep','Consignes'));
  const bloc=(titre,table,legende)=>{
    const c=el('div','carteTac');
    c.innerHTML=`<div class="tacTitre">${titre}</div><div class="tacTexte">${legende}</div>`+
      Object.keys(table).map(k=>{
        const x=table[k];
        const parts=[];
        if(x.att)parts.push((x.att>0?'+':'')+x.att+' attaque');
        if(x.def)parts.push((x.def>0?'+':'')+x.def+' défense');
        if(x.poss)parts.push((x.poss>0?'+':'')+x.poss+' possession');
        if(x.risque)parts.push((x.risque>0?'+':'')+x.risque+' risque');
        if(x.ailes)parts.push((x.ailes>0?'+':'')+x.ailes+' sur les ailes');
        if(x.axe)parts.push((x.axe>0?'+':'')+x.axe+' dans l\'axe');
        return `<div class="tacLigne"><b>${k}</b><span>${parts.join(' · ')||'neutre'}</span></div>`;
      }).join('');
    v.appendChild(c);
  };
  bloc('Mentalité',MENTALITES,'Déplace le curseur entre prudence et ambition. Une mentalité très offensive fait marquer davantage, et encaisser davantage.');
  bloc('Hauteur de bloc',PRESSIONS,'Où l\'équipe attend l\'adversaire. Un bloc haut prend le ballon mais s\'expose aux transitions.');
  bloc('Largeur',LARGEURS,'Étirer le jeu ou le resserrer. La largeur profite aux formations pourvues sur les couloirs.');

  v.appendChild(el('div','sep','Formations'));
  v.appendChild(el('div','hint','Le profil d\'une formation se déduit de sa composition : nombre de défenseurs, de milieux et d\'attaquants, et présence de milieux défensifs ou offensifs.'));
  const tab=el('div','tabj');
  tab.innerHTML=`<div class="tjh"><span>Formation</span><span>Déf.</span><span>Mil.</span><span>Att.</span></div>`;
  Object.keys(FORMATIONS).sort((a,b)=>PROFIL_FORMATION[b].att-PROFIL_FORMATION[a].att).forEach(f=>{
    const p=PROFIL_FORMATION[f];
    const l=el('button','tjr formTac'+(f===S.formation?' moi':''));
    l.innerHTML=`<span class="tjnom">${f}</span>
      ${cellFor(p.def)}${cellFor(p.mil)}${cellFor(p.att)}`;
    l.onclick=()=>{S.formation=f;completerOnze();sel=null;ongletActif='eq';rendre();};
    tab.appendChild(l);
  });
  v.appendChild(tab);
}
function jaugeTac(lib,val,mini,maxi){
  const pct=Math.max(3,Math.min(100,Math.round((val-mini)/(maxi-mini)*100)));
  return `<div class="jg"><span>${lib} ${val>0?'+':''}${val}</span>
    <div class="jgb"><i style="width:${pct}%"></i></div></div>`;
}
function cellFor(v){
  const pct=Math.max(6,Math.min(100,Math.round((v-0.84)/0.34*100)));
  const teinte=v>1.04?'var(--vert)':v<0.96?'var(--rouge)':'var(--bleu)';
  return `<span class="cellFor"><i style="width:${pct}%;background:${teinte}"></i></span>`;
}

/* ---------- marché aux enchères ---------- */
function blocMarche(v){
  const listes=(S.marche||[]).slice().sort((a,b)=>a.fin-b.fin||b.prix-a.prix);
  const miennes=listes.filter(l=>l.vendeur===S.monClub);
  const autres=listes.filter(l=>l.vendeur!==S.monClub);
  if(miennes.length){
    v.appendChild(el('div','sep','Mes joueurs en vente'));
    miennes.forEach(l=>v.appendChild(carteAnnonce(l,true)));
  }
  v.appendChild(el('div','sep',autres.length?'Enchères en cours':'Aucune enchère pour le moment'));
  autres.forEach(l=>v.appendChild(carteAnnonce(l,false)));
  if(!autres.length)v.appendChild(el('div','hint','Les clubs mettent régulièrement des joueurs aux enchères. Reviens après la prochaine journée.'));
}
function carteAnnonce(l,mienne){
  const j=J(l.joueur);

    <div class="anTete">

/* ---------- outils de manches ---------- */
function manchesDe(coupe,tours,allerRetour){
  const out=[];
  tours.forEach(([lt,nm])=>{
    if(!coupe.tour[lt]||!coupe.tour[lt].length)return;
    if(allerRetour&&lt!=='F'){
      out.push({lt,nm,leg:'1',titre:nm,sous:'Aller'});
      out.push({lt,nm,leg:'2',titre:nm,sous:'Retour'});
    }else{
      out.push({lt,nm,leg:null,titre:nm,sous:allerRetour?'Match unique':null});
    }
  });
  return out;
}

function tourTermine(c,lt,p){
  if(lt==='F')return !!c.vainqueur;
  const suivant={T:'H',H:'Q',Q:'S',S:'F',P:'H'}[lt];
  const s=c.tour[suivant];
  if(!s)return false;
  return s.some(x=>x[0]===p[0]||x[1]===p[0]||x[0]===p[1]||x[1]===p[1]);
}

  }

    `Tournoi à élimination directe, ${it.taille} équipes, matchs secs. Ni blessure ni carton, et jamais le même jour qu'une autre coupe. Chaque victoire rapporte ${POINTS_INTER.victoire} points au classement mondial, le titre ${POINTS_INTER.titre}.`));

  if(it.vainqueur){

    it.paires.forEach(p=>v.appendChild(ligneInter(p[0],p[1],null)));
  }

  // tours déjà disputés, du plus récent au plus ancien
  const parTour={};
  it.resultats.forEach(r=>{(parTour[r.jn]=parTour[r.jn]||[]).push(r);});
  Object.keys(parTour).reverse().forEach(nom=>{
    v.appendChild(el('div','sep',nom));

      const a={club:r.dom,num:r.domNum,etiquette:etiquetteInter(it,r.dom,r.domNum)};

    });
  });

function etiquetteInter(it,club,num){
  const e=(it.equipes||[]).find(x=>x.club===club&&x.num===num);

function ligneInter(a,b,r){
  const gagnant=r?(r.tab?(r.tab[0]>r.tab[1]?a.club:b.club):(r.ga>r.gb?a.club:b.club)):null;

      r&&r.tab?` — tirs au but ${r.tab[0]} – ${r.tab[1]}`:''}</div>`;

function blocMondial(v){
  v.appendChild(el('div','hint','Les soixante meilleurs clubs de tous les serveurs réunis, ordinateur compris. Cumul de toutes les saisons, sans remise à zéro. Le numéro qui suit le nom est celui du serveur.'));
  const zone=el('div','zoneMondial');
  v.appendChild(zone);

  const local=()=>{
    const cl=classementMondial().slice(0,60);
    if(!cl.reduce((a,r)=>a+r.pts,0)){
      zone.appendChild(el('div','fin','Le classement se remplira à la fin de la première saison.'));
      return;
    }
    zone.appendChild(el('div','hint','Classement de ce serveur : le serveur distant n\'a pas répondu.'));
    tableauManagers(zone,cl,true);
  };

  if(!Nuage.connecte()){ local(); return; }

  zone.appendChild(el('div','hint','Chargement du classement mondial…'));
  Nuage.classementMondialComplet(60).then(liste=>{
    zone.innerHTML='';
    if(!liste||!liste.length){ local(); return; }
    const moi=Nuage.pseudo();
    tableauManagers(zone,liste.map(r=>Object.assign({},r,{
      pts:r.points, humain:r.manager===moi&&r.num===(S.numServeur||1)
    })),true);
    zone.appendChild(el('div','hint',
      `${liste.length} clubs classés, issus de tous les serveurs.`));
  });

  // on publie au passage le sommet de notre serveur
  if(Nuage.connecte()&&S.serveur)
    Nuage.publierClassement(S.serveur,S.numServeur||1,sommetDuServeur(20));
}

    const msgs=(S.chat||[]).slice(-60);
    if(!msgs.length)fil.appendChild(el('div','hint','Personne n\'a encore écrit. Lance la discussion.'));
    msgs.forEach(msg=>{
      const b=el('div','msg'+(msg.moi?' moi':'')+(!msg.moi&&msg.qui===msg.qui.toUpperCase()&&msg.qui.length>5?' sys':''));
      b.innerHTML=`<span class="qui">${msg.qui}</span><div class="bulle-msg">${echapper(msg.txt)}</div>`;
      fil.appendChild(b);
    });
    fil.scrollTop=fil.scrollHeight;
  };
  peupler();
  const envoyer=()=>{
    const i=m.querySelector('#msg');
    const txt=(i.value||'').trim();
    if(!txt)return;
    posterChat(S.pseudo,txt,true);
    i.value='';
    marquerChatLu();
    peupler();
    const p=$('#btnChat');if(p)p.innerHTML='💬';
  };
  m.querySelector('.envoi').onclick=()=>{Audio2.jouer('clic');envoyer();};
  m.querySelector('#msg').onkeydown=e=>{if(e.key==='Enter')envoyer();};
  m.querySelector('.ferme').onclick=()=>{m.remove();rendre();};
  m.onclick=e=>{if(e.target===m){m.remove();rendre();}};
  document.body.appendChild(m);
}
function echapper(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function badgesBonus(j,compact){
  const b=bonusDe(j.id);

  return `<span class="bonus${compact?' mini':''}">`+b.map(x=>{
    const d=TYPES_BONUS[x.type];
    return compact?`<i title="${d.lib}">${d.icone}</i>`
      :`<i class="bg ${x.type}">${d.icone} ${d.lib} · ${x.reste}j</i>`;
  }).join('')+'</span>';
}

  const membres=(srv&&srv.membres)||S.membres||{};

  m.innerHTML=`<div class="mcard commons">

    <div class="hint">Uniquement des images en licence libre (Creative Commons ou domaine public) : ce sont les seules que Commons héberge. Choisis de préférence un portrait plutôt qu'une photo d'action — l'auteur sera crédité automatiquement dans la fiche du joueur.</div>

  </div>`;
  const zone=m.querySelector('#resC');

function parcoursCoupe(){
  const lid=CL(S.monClub).ligue;
  const c=S.coupesNat&&S.coupesNat[lid];
  if(!c)return '—';

  const noms={P:'T. prélim.',H:'8es',Q:'Quarts',S:'Demies',F:'Finale'};
  let dernier='—';

/* ---------- mode observation ----------
   Consultation d'un autre serveur : tout est en lecture seule. */
let etatAvantObservation=null, ongletObs='lig';

async function observerServeur(id,nom,srv){
  const etat=await chargerObservation(id,srv);
  if(!etat){alerteCourte('Ce serveur n\'a encore aucune partie enregistrée sur cet appareil.');return;}
  etatAvantObservation=S;
  S=etat;
  ongletObs='lig';
  vueLigue='classement';
  calMode='ligues';
  rendreObservation();
}
function quitterObservation(){
  S=etatAvantObservation;
  etatAvantObservation=null;
  if(S)rendre(); else ecranServeurs();
}
function rendreObservation(){
  const w=$('#app');
  w.innerHTML=`
    <header class="barre obs">
      <button class="ico" id="btnSortir">✕</button>
      <div class="centre">
        <div class="titre">${echapper(S.nomServeur||'Serveur')}<small>observation · saison ${S.saison} · journée ${S.jour}</small></div>
      </div>
      <div class="ico vide"></div>
    </header>
    <main id="vue"></main>
    <nav class="tabs">
      ${[['lig','Ligues','🏆'],['cou','Coupes','🥇'],['cal','Calendrier','📅'],['eff','Effectifs','👥']]
        .map(([k,l,i])=>`<button data-t="${k}" class="${ongletObs===k?'on':''}"><span>${i}</span>${l}</button>`).join('')}
    </nav>`;
  w.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ongletObs=b.dataset.t;rendreObservation();});
  $('#btnSortir').onclick=()=>quitterObservation();
  const v=$('#vue');
  v.appendChild(el('div','bandeauObs',
    `Lecture seule · ${S.nomServeur||'serveur'}`));
  try{
    if(ongletObs==='lig')vueLigues();
    else if(ongletObs==='cou')vueCoupes();
    else if(ongletObs==='cal')calendrierObservation(v);
    else effectifsObservation(v);
  }catch(err){
    console.error(err);
    v.appendChild(el('div','fin','Cet écran n\'a pas pu s\'afficher : '+err.message));
  }
}
function calendrierObservation(v){
  const nav=el('div','sousnav');
  [['ligues','Ligues'],['coupes','Coupes']].forEach(([k,l])=>{
    const b=el('button',calMode===k?'on':'',l);
    b.onclick=()=>{calMode=k;rendreObservation();};
    nav.appendChild(b);
  });
  v.appendChild(nav);
  if(calMode==='coupes')calendrierCoupes(v); else calendrierLigues(v);
}
function effectifsObservation(v){
  const humains=S.membres||{};
  const noms=Object.keys(humains);
  v.appendChild(el('div','sep',noms.length?'Managers du serveur':'Aucun manager humain'));
  noms.forEach(p=>{
    const club=humains[p];
    const c=el('button','ligneJ');
    const eff=S.joueurs.filter(j=>j.club===club);
    const moy=eff.length?(eff.reduce((a,j)=>a+j.note,0)/eff.length).toFixed(1):'—';
    const t=trierClassement(S.classements[CL(club).ligue]);
    const rang=t.findIndex(x=>x.club===club)+1;
    c.innerHTML=`${maillotSVG(CL(club),44)}
      <div class="pinfo"><b>${echapper(p)}#${S.numServeur||1}</b>
        <span>${club} · ${rang}<sup>${rang===1?'er':'e'}</sup> · niveau ${moy}</span></div>
      <div class="prix">${pointsManager(club)}<small>points</small></div>`;
    c.onclick=()=>ficheClub(club);
    v.appendChild(c);
  });
  v.appendChild(el('div','sep','Les clubs les plus forts'));
  const clubs=Object.keys(S.clubs).map(n=>{
    const eff=S.joueurs.filter(j=>j.club===n);
    return {n,moy:eff.length?eff.reduce((a,j)=>a+j.note,0)/eff.length:0};
  }).sort((a,b)=>b.moy-a.moy).slice(0,15);
  clubs.forEach((x,i)=>{
    const c=el('button','ligneJ');
    c.innerHTML=`<span class="rang">${i+1}</span>${maillotSVG(CL(x.n),40)}
      <div class="pinfo"><b>${x.n}</b><span>${echapper(nomManager(x.n))}</span></div>
      <div class="prix">${x.moy.toFixed(1)}</div>`;
    c.onclick=()=>ficheClub(x.n);
    v.appendChild(c);
  });
}

/* ---------- serveurs : le nuage fait autorité quand il répond ---------- */
let serveursDistants=false;

async function chargerServeurs(){
  if(Nuage.connecte()){
    const distants=await Nuage.listerServeursNuage();
    if(distants){
      serveursDistants=true;
      return distants;
    }
  }
  serveursDistants=false;
  return await listerServeurs();
}

/* Prend possession d'un club sur un serveur partagé. */
async function entrerServeurPartage(srv,club){
  const r=await Nuage.rejoindreNuage(srv.id,club);
  if(r.err)return r;
  srv.membres=srv.membres||{};
  srv.membres[Nuage.pseudo()]=club;
  await Store.set(CLE_ACTIF,srv.id);
  nouvellePartie(club,srv.graine,{...srv,pseudo:Nuage.pseudo()});
  avancerEtAfficher(true);                       // le serveur a pu démarrer avant nous
  await Store.set(CLE_SAVE(srv.id+'_'+Nuage.pseudo()),signerSauvegarde(sansIndex()));
  await Nuage.televerser(srv.id,sansIndex());
  return {srv};
}

/* Reprend une partie déjà commencée : on préfère la version la plus avancée. */
async function ouvrirServeurPartage(srv){
  const local=await Store.get(CLE_SAVE(srv.id+'_'+Nuage.pseudo()));
  const distant=await Nuage.telecharger(srv.id);
  let etat=local;
  if(distant&&distant.etat){
    const avanceDistante=(distant.etat.saison||1)*1000+(distant.etat.jour||0);
    const avanceLocale=local?((local.saison||1)*1000+(local.jour||0)):-1;
    if(avanceDistante>avanceLocale)etat=distant.etat;
  }
  if(!etat||!etat.monClub)return false;
  await Store.set(CLE_ACTIF,srv.id);
  const intacte=signatureValide(etat);
  S=migrer(etat);S.index={};S.joueurs.forEach(j=>S.index[j.id]=j);
  S.pseudo=Nuage.pseudo();
  S.alteree=!intacte||verifierCoherence(S).length>0;
  S.derniereActivite=Date.now();
  avancerEtAfficher(true);
  Nuage.signalerPresence(srv.id);
  Nuage.televerser(srv.id,sansIndex());
  return true;
}

/* ---------- écran des serveurs ---------- */
async function ecranServeurs(){
  if(!Nuage.connecte())await Nuage.restaurer();
  let tous=await chargerServeurs();
  if(serveursDistants){
    // on s'assure qu'un serveur reste ouvert à tous
    if(await Nuage.assurerServeurOuvert(tous))tous=await chargerServeurs();
  }else{
    await verifierServeursAuto();
    await verifierInactifs();
    tous=await listerServeurs();
  }
  const moi=Nuage.connecte()?Nuage.pseudo():sessionPseudo;
  const miens=tous.filter(s=>s.membres&&s.membres[moi]);
  const aMoi=s=>s.membres&&s.membres[moi];
  const vide=s=>Object.keys(s.membres||{}).length===0;
  // un serveur désert reste accessible librement : le code ne protège que
  // les parties déjà commencées
  const ouverts=tous.filter(s=>(serveurOuvert(s)||vide(s))&&!aMoi(s));
  const w=$('#app');w.innerHTML='';
  const h=el('div','accueil');
  h.innerHTML=`<img class="logoAccueil petit" src="${LOGO_ACCUEIL}" alt="">
    <div class="marque"><span>THE</span> NEXT <span>ONE</span></div>
    <div class="version">Connecté en ${sessionPseudo}</div>
    <p class="chapo">Mêmes clubs et mêmes joueurs sur chaque serveur. Seuls les tirages des coupes et le calendrier changent.</p>`;

  // retour immédiat vers la partie en cours, sans rien perdre
  if(S&&S.monClub){
    const retour=el('button','cta retourClub');
    retour.innerHTML=`${maillotSVG(CL(S.monClub),30)}<span>Revenir à ${S.monClub}</span>`;
    retour.onclick=()=>{avancerEtAfficher(true);rendre();};
    h.appendChild(retour);
  }

  if(miens.length){
    h.appendChild(el('div','sep','Mes serveurs'));
    const box=el('div','serveurs');
    miens.forEach(srv=>{
      const nomClub=srv.membres[moi];
      const club=Object.values(LEAGUES).flatMap(l=>l.clubs).find(c=>c[0]===nomClub);
      const cl=club?{nom:club[0],c1:club[1],c2:club[2],c3:club[3],motif:club[4]}:null;
      const c=el('div','srv');
      const ouvert=serveurOuvert(srv);
      c.innerHTML=`${cl?maillotSVG(cl,44):iconeServeur(srv.num,44)}
        <div class="srvinfo"><b>${srv.nom}</b>
          <span>${nomClub}</span>
          <span class="codeSrv">${ouvert
            ? (serveurVide(srv)&&joursRestants(srv)<=0?'libre : aucun manager':'ouvert encore '+joursRestants(srv)+' j')
            : 'fermé — code requis'}</span></div>`;
      const go=el('button','ok','Entrer');
      go.onclick=async()=>{
        const ouvert=serveursDistants
          ? await ouvrirServeurPartage(srv)
          : await rejoindreServeur(srv.id,sessionPseudo);
        if(ouvert){ if(!serveursDistants)avancerEtAfficher(true); rendre(); }
        else ecranServeurs();
      };
      const obs=el('button','obs','👁');
      obs.title='Observer ce serveur';
      obs.onclick=()=>observerServeur(srv.id,srv.nom,srv);
      const sup=el('button','sup','✕');
      sup.onclick=async()=>{
        if(!sup.dataset.sur){sup.dataset.sur='1';sup.textContent='Quitter ?';return;}
        if(serveursDistants)await Nuage.quitterNuage(srv.id);
        else{ delete srv.membres[moi]; await enregistrerListe(tous); }
        await Store.del(CLE_SAVE(srv.id+'_'+moi));
        ecranServeurs();
      };
      c.append(go,obs,sup);
      box.appendChild(c);
    });
    h.appendChild(box);
  }

  if(ouverts.length){
    h.appendChild(el('div','sep','Serveurs ouverts'));

    // on n'affiche que les trois derniers nés : la recherche donne accès au reste
    const recents=ouverts.slice().sort((a,b)=>(b.cree||0)-(a.cree||0));
    const rechercheZone=el('div','rechercheSrv');
    rechercheZone.innerHTML=`<input id="chercheSrv" placeholder="Chercher un serveur par numéro ou par code">`;
    h.appendChild(rechercheZone);
    const box=el('div','serveurs');
    const dessiner=filtre=>{
      box.innerHTML='';
      const q=String(filtre||'').trim().toUpperCase();
      const vus=q
        ? ouverts.filter(s=>String(s.num)===q.replace('#','')
            ||String(s.nom).toUpperCase().indexOf(q)>=0
            ||String(s.code||'').toUpperCase()===q)
        : recents.slice(0,3);
      if(!vus.length){
        box.appendChild(el('div','hint','Aucun serveur ouvert ne correspond. Le code d\'accès reste le moyen sûr d\'en rejoindre un.'));
        return;
      }
      vus.forEach(srv=>construireCarteOuverte(srv,box));
      if(!q&&ouverts.length>3)
        box.appendChild(el('div','hint',`${ouverts.length-3} autre(s) serveur(s) ouvert(s) — utilise la recherche.`));
    };
    rechercheZone.querySelector('#chercheSrv').oninput=e=>dessiner(e.target.value);
    dessiner('');
    h.appendChild(box);
  }

  /* Carte d'un serveur ouvert. */
  function construireCarteOuverte(srv,box){
    [srv].forEach(srv=>{
      const c=el('div','srv');
      c.innerHTML=`${iconeServeur(srv.num,44)}
        <div class="srvinfo"><b>${srv.nom}</b>
          <span>${Object.keys(CLUB_LIGUE).length-clubsPris(srv).length} clubs libres</span>
          <span class="codeSrv">${serveurVide(srv)&&joursRestants(srv)<=0
            ? 'Libre : aucun manager'
            : 'Ouvert encore '+joursRestants(srv)+' jour(s)'}${srv.auto?' · ouverture automatique':''}</span></div>`;
      const go=el('button','ok','Rejoindre');
      go.onclick=()=>ecranChoixPays({mode:'rejoindre',srv});
      const obs=el('button','obs','👁');
      obs.title='Observer ce serveur';
      obs.onclick=()=>observerServeur(srv.id,srv.nom,srv);
      c.append(go,obs);
      box.appendChild(c);
    });
  }

  const autres=tous.filter(s=>!(s.membres&&s.membres[moi])&&!serveurOuvert(s)
    &&Object.keys(s.membres||{}).length>0);
  if(autres.length){
    h.appendChild(el('div','sep','Autres serveurs'));
    const box=el('div','serveurs');
    autres.forEach(srv=>{
      const c=el('div','srv');
      c.innerHTML=`${iconeServeur(srv.num,44)}
        <div class="srvinfo"><b>${srv.nom}</b>
          <span class="codeSrv">fermé — code requis pour jouer</span></div>`;
      const obs=el('button','obs seul','Observer');
      obs.onclick=()=>observerServeur(srv.id,srv.nom,srv);
      c.appendChild(obs);
      box.appendChild(c);
    });
    h.appendChild(box);
  }

  const serie=await serieDe(sessionPseudo);
  const nbClubs=await nbClubsDe(sessionPseudo);
  const creer=el('button','cta'+(serie>=SERIE_REQUISE?'':' inactif'),
    serie>=SERIE_REQUISE?'Créer un serveur':`Créer un serveur — ${serie}/${SERIE_REQUISE} jours`);
  creer.onclick=()=>{
    if(serie<SERIE_REQUISE){
      alerteCourte(`Ouvrir un serveur demande ${SERIE_REQUISE} jours de jeu consécutifs.<br>Tu en es à <b>${serie}</b>. Reviens demain pour prolonger ta série.`);
      return;
    }
    if(nbClubs>=MAX_CLUBS_PAR_COMPTE){
      alerteCourte('Un compte ne peut diriger que '+MAX_CLUBS_PAR_COMPTE+' clubs.');
      return;
    }
    ecranChoixPays({mode:'creer'});
  };
  h.appendChild(creer);
  h.appendChild(el('div','hint',
    `${nbClubs}/${MAX_CLUBS_PAR_COMPTE} clubs dirigés · série de jeu : ${serie} jour(s)`+
    (serie<SERIE_REQUISE?` · ${SERIE_REQUISE} jours consécutifs requis pour ouvrir un serveur`:'')));

  const rejoindre=el('button','cta petit','Rejoindre avec un code');
  rejoindre.onclick=()=>modaleCode();
  h.appendChild(rejoindre);

  const deco=el('button','lien','Se déconnecter du compte');
  deco.onclick=async()=>{await seDeconnecterDuCompte();sessionPseudo=null;ecranAuth();};
  h.appendChild(deco);
  w.appendChild(h);
}

/* ---------- diagnostic de la liaison ----------
   Affiche sans détour ce qui fonctionne et ce qui ne fonctionne pas. */
async function modaleDiagnostic(){
  const m=el('div','modale');
  m.innerHTML=`<div class="mcard">
    <div class="mtag">Diagnostic</div>
    <div id="diag"><div class="hint">Vérification en cours…</div></div>
    <button class="lien ferme">Fermer</button>
  </div>`;
  m.querySelector('.ferme').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);

  const d=await Nuage.diagnostic();
  const ligne=(lib,valeur,bon)=>
    `<div class="diagL"><span>${lib}</span><b class="${bon===null?'':(bon?'bon':'mauvais')}">${echapper(String(valeur))}</b></div>`;
  const zone=m.querySelector('#diag');
  zone.innerHTML=
    ligne('Version du jeu',d.version,null)+
    ligne('Serveur joignable',d.joignable?'oui':'non',d.joignable)+
    ligne('Tables en place',d.tables===null?'—':(d.tables?'oui':'non'),d.tables)+
    ligne('Compte en ligne',d.session?'connecté':'hors ligne',d.session)+
    ligne('Pseudo',d.pseudo||'—',d.pseudo?true:null)+
    ligne('Profil enregistré',d.profil||'absent',d.profil?true:false)+
    ligne('Serveurs visibles',d.serveurs===null?'—':d.serveurs,
          d.serveurs===null?null:d.serveurs>0)+
    ligne('Mode',d.mode,d.mode==='partagé')+
    (d.erreur?`<div class="diagErr">${echapper(d.erreur)}</div>`:'')+
    `<div class="hint">${
      d.mode==='partagé'
      ? 'Tout est en ordre : tes serveurs sont partagés avec les autres joueurs.'
      : (!d.joignable
        ? 'Le serveur ne répond pas. Le jeu tourne en local, chacun de son côté.'
        : (!d.session
          ? 'Tu joues avec un compte local. Déconnecte-toi et recrée un compte pour passer en ligne.'
          : 'Le compte est en ligne mais la liste des serveurs n\'a pas pu être lue.'))
    }</div>`;
}

function modaleCode(){
  const m=el('div','modale');
  m.innerHTML=`<div class="mcard">
    <div class="mtag">Rejoindre avec un code</div>
    <div class="hint">Le code fait 4 caractères. Il figure sur le profil de chaque manager déjà présent sur le serveur.</div>
    <label class="lbl">Code d'accès<input id="code" maxlength="4" class="champCode" placeholder="A7K2"></label>
    <div class="err" id="err"></div>
    <button class="cta petit" id="go">Chercher le serveur</button>
    <button class="lien ferme">Annuler</button>
  </div>`;
  const champ=m.querySelector('#code');
  champ.oninput=()=>{champ.value=champ.value.toUpperCase().replace(/[^A-Z0-9]/g,'');};
  m.querySelector('#go').onclick=async()=>{
    const code=champ.value.trim().toUpperCase();
    const zone=m.querySelector('#err');
    zone.textContent='Recherche…';
    let srv=null;
    if(Nuage.connecte())srv=await Nuage.serveurParCode(code);
    if(!srv){
      const liste=await listerServeurs();
      srv=liste.find(s=>s.code===code)||null;
    }
    if(!srv){zone.textContent='Aucun serveur ne correspond à ce code.';return;}
    const moi=Nuage.connecte()?Nuage.pseudo():sessionPseudo;
    if(srv.membres&&srv.membres[moi]){zone.textContent='Tu es déjà sur ce serveur.';return;}
    m.remove();
    ecranChoixPays({mode:'rejoindre',srv});
  };
  m.querySelector('.ferme').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
}

/* ---------- démarrage ---------- */
(async function(){
  // les textures du maillot sont exposées au CSS
  document.documentElement.style.setProperty('--ombrage-maillot','url('+RELIEF_OMBRAGE+')');
  document.documentElement.style.setProperty('--masque-maillot','url('+RELIEF_MASQUE+')');
  const son=await Store.get('tno_son');
  if(son)Audio2.appliquer(son);
  const eveil=()=>{Audio2.lancerMusique();document.removeEventListener('pointerdown',eveil);};
  document.addEventListener('pointerdown',eveil);

  const enLigne=await Nuage.restaurer();
  sessionPseudo=(enLigne&&enLigne.pseudo)||await compteConnecte();
  if(!sessionPseudo){ecranAuth();return;}
  await marquerActivite(sessionPseudo);
  await verifierServeursAuto();
  await verifierInactifs();
  const act=await serveurActif();
  if(act&&await rejoindreServeur(act,sessionPseudo)){
    avancerEtAfficher(true);      // on rattrape sans interrompre l'arrivée
    if(Nuage.connecte()){Nuage.signalerPresence(act);Nuage.televerser(act,sansIndex());}
    rendre();
  }else ecranServeurs();
})();
