<style>
:root{
  --fond:#04122B; --fond2:#0A2A5E; --carte:rgba(255,255,255,.07); --carte2:rgba(255,255,255,.11);
  --trait:rgba(255,255,255,.14); --txt:#EAF2FF; --mut:#8CA6CC;
  --or:#FFB020; --bleu:#2FA8FF; --rouge:#FF3B5C; --vert:#39D98A;
  --dsp:'Barlow Condensed',system-ui,sans-serif; --bdy:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--bdy);color:var(--txt);
  background:
    linear-gradient(180deg,#0B3068 0%,#061A3C 45%,#04122B 100%) fixed;
  overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
select,input{font-family:inherit;color:var(--txt);background:rgba(0,0,0,.32);border:1px solid var(--trait);border-radius:10px;padding:9px 10px;font-size:14px;width:100%}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.kit{display:block;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.face{display:block;flex:none}

/* étoiles */
.stars{display:inline-flex;gap:1px;font-size:11px;line-height:1}
.st.f{color:var(--or)}.st.h{color:var(--or);opacity:.55}.st.e{color:rgba(255,255,255,.28)}

/* barre */
.barre{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;
  align-items:center;gap:10px;padding:9px 12px;
  background:linear-gradient(180deg,#0A2C63,#082450);border-bottom:1px solid var(--trait)}
.barre .centre{display:grid;justify-items:center;gap:1px;min-width:0}
.barre .ico{width:40px;height:40px;border-radius:50%;background:var(--carte);display:grid;place-items:center;
  border:1px solid var(--trait);position:relative}
.barre .ico.chat{font-size:19px;background:linear-gradient(180deg,#3BB4FF,#1683D8);border-color:transparent}
.titre{text-align:center;font-family:var(--dsp);font-weight:700;font-size:21px;letter-spacing:.13em;line-height:1}
.budget{font-family:var(--dsp);font-size:16px;font-weight:600;color:var(--or);letter-spacing:.04em;line-height:1.1}

main{flex:1;padding:14px 14px 96px}

/* onglets bas */
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:#061C42;border-top:1px solid var(--trait);padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:20}
.tabs button{display:grid;gap:2px;justify-items:center;font-size:11px;color:var(--mut);padding:6px 0;font-family:var(--dsp);letter-spacing:.06em;text-transform:uppercase}
.tabs button span{font-size:19px;filter:grayscale(1) opacity(.6)}
.tabs button.on{color:var(--txt)}
.tabs button.on span{filter:none}

/* accueil */
.accueil{padding:26px 16px 40px}
.marque{font-family:var(--dsp);font-size:40px;font-weight:700;letter-spacing:.1em;text-align:center;line-height:1}
.marque span{color:var(--bleu)}
.chapo{color:var(--mut);text-align:center;font-size:14px;max-width:330px;margin:12px auto 26px;line-height:1.5}
.ligue-bloc h3{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.12em;font-size:15px;color:var(--or);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--trait)}
.grille-clubs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.carte-club{display:grid;justify-items:center;gap:6px;padding:10px 6px;border-radius:12px;background:var(--carte);border:1px solid var(--trait);font-size:11px;text-align:center;line-height:1.2}
.carte-club:active{background:var(--carte2)}
.chargement{padding:60px 20px;text-align:center;color:var(--mut)}

/* séparateurs */
.sep{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#fff;
  background:var(--rouge);display:inline-block;padding:4px 14px;border-radius:4px;margin:18px auto 10px;position:relative;left:50%;transform:translateX(-50%)}
.sept{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--mut);margin:14px 0 6px}

/* matchs */
.match{background:var(--carte);border:1px solid var(--trait);border-radius:20px;padding:18px 10px 20px;margin-bottom:16px;overflow:hidden}
.match.focus{border-color:var(--vert);box-shadow:0 0 0 1px var(--vert) inset}
.mcomp{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;font-size:17px;color:var(--or);
  display:grid;justify-items:center;gap:1px;line-height:1.15}
.mcomp span{color:var(--txt);font-size:15px;letter-spacing:.04em}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;margin-top:10px}
/* le maillot s'adapte à la largeur disponible : plus de débordement sur petit écran */
.mrow .kit{width:clamp(64px,26vw,112px)!important;height:clamp(64px,26vw,112px)!important}
.mteam{display:grid;justify-items:center;gap:10px;font-size:15px;text-align:center;min-width:0}
.mteam b{font-family:var(--dsp);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:16px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mscore{font-family:var(--dsp);font-size:30px;font-weight:700;background:var(--bleu);color:#04122B;
  border-radius:26px;padding:4px 16px;min-width:88px;text-align:center;line-height:1.15}
.magg{font-size:16px}

.cta{display:block;width:100%;margin:18px 0 0;padding:15px;border-radius:14px;background:linear-gradient(180deg,#FFC24D,#F09000);
  color:#2A1600;font-family:var(--dsp);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.cta:active{filter:brightness(.94)}
.cta.petit{padding:12px;font-size:16px;margin-top:14px}
.lien{display:block;width:100%;text-align:center;color:var(--mut);font-size:13px;padding:10px}
.lien.danger{color:var(--rouge)}
.fin{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}

/* modale */
.modale{position:fixed;inset:0;background:rgba(2,8,20,.78);display:grid;place-items:center;padding:16px;z-index:50}
.mcard{background:linear-gradient(180deg,#0D2E63,#08234C);border:1px solid var(--trait);border-radius:18px;padding:16px;width:100%;max-width:420px;max-height:86vh;overflow:auto}
.mcard.haut{padding-top:12px}
.mtag{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--or);text-align:center;margin-bottom:10px}
.mbig{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mres{font-family:var(--dsp);font-size:38px;font-weight:700;color:var(--bleu)}
.mposs{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin:14px 0}
.mposs .bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden}
.mposs .bar i{display:block;height:100%;background:var(--bleu)}
.mevts{display:grid;gap:4px}
.evt{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--carte)}
.evt.d{text-align:right}
.evt span{color:var(--mut);font-size:11px;margin-right:6px}
.evt.vide{text-align:center;color:var(--mut)}

/* terrain */
.tactique{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tactique label{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--mut);display:grid;gap:4px}
.terrain{position:relative;width:100%;aspect-ratio:3/4.1;border-radius:16px;overflow:hidden;border:1px solid var(--trait);
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 7%,transparent 7% 14%),
    linear-gradient(180deg,#1E6B3E,#124E2C);}
.terrain::before{content:'';position:absolute;inset:8px;border:2px solid rgba(255,255,255,.28);border-radius:6px}
.terrain::after{content:'';position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.28);border-radius:50%}
.joueur{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;width:74px}
.joueur .nomj{font-size:10px;background:#fff;color:#0A1D3A;border-radius:3px;padding:1px 5px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.joueur .poste{position:absolute;top:-4px;right:2px;z-index:2;font-family:var(--dsp);font-size:10px;font-weight:700;background:var(--vert);color:#04231A;border-radius:4px;padding:0 4px;letter-spacing:.04em}
.joueur .vide{width:52px;height:52px;border-radius:50%;border:2px dashed rgba(255,255,255,.5);display:grid;place-items:center;font-size:20px;color:rgba(255,255,255,.6)}
.banc{margin-top:14px}
.bancrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;background:rgba(0,0,0,.35);border-radius:12px;padding:10px}
.bj{display:grid;justify-items:center;gap:2px;width:66px;flex:none;position:relative}
.bj.ko{opacity:.45}
.bj .nomj{font-size:9px;background:#fff;color:#0A1D3A;border-radius:3px;padding:1px 4px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.poste.alt{position:absolute;top:-3px;right:0;z-index:2;font-family:var(--dsp);font-size:9px;font-weight:700;background:var(--or);color:#2A1600;border-radius:4px;padding:0 4px}

/* listes joueurs */
.picks{display:grid;gap:6px;max-height:64vh;overflow:auto}
.pick,.ligneJ{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.pick.ko{opacity:.5}
.ligneJ.statique{cursor:default}
.ligneJ.moi{border-color:var(--or)}
.pinfo{flex:1;display:grid;gap:2px;min-width:0}
.pinfo b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo span{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prix{font-family:var(--dsp);font-size:17px;color:var(--or);text-align:right;display:grid}
.prix small{font-family:var(--bdy);font-size:10px;color:var(--mut)}
.rang{font-family:var(--dsp);font-size:16px;color:var(--mut);width:22px;text-align:center}

/* transferts */
.trhead{margin-bottom:6px}
.trtitre{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.12em;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.trtitre span{color:var(--vert);font-size:16px}
.rech{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.offre{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:10px;margin-bottom:8px}
.oflet{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.oflet.in{border:2px solid var(--rouge);color:var(--rouge)}
.oflet.out{border:2px solid var(--bleu);color:var(--bleu)}
.ofinfo{display:grid;gap:2px;min-width:0}
.ofinfo b{font-size:14px}
.ofclub{font-size:11px;color:var(--or)}
.ofdroite{text-align:right}
.ofmontant{font-family:var(--dsp);font-size:19px;color:var(--vert)}
.ofattente{font-size:10px;color:var(--mut)}
.ofactions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ofactions .ok,.ofactions .no{padding:9px;border-radius:10px;font-family:var(--dsp);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.ofactions .ok{background:var(--vert);color:#04231A}
.ofactions .no{background:rgba(255,255,255,.1);border:1px solid var(--trait)}
.ficheJ{display:flex;gap:12px;align-items:center}
.ficheJ div{display:grid;gap:3px}
.ficheJ b{font-size:17px}
.ficheJ span{font-size:12px;color:var(--mut)}
.statsJ{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.statsJ div{background:var(--carte);border-radius:10px;padding:8px 4px;text-align:center;display:grid;gap:2px}
.statsJ b{font-family:var(--dsp);font-size:18px;color:var(--or)}
.statsJ span{font-size:10px;color:var(--mut)}
.lbl{display:grid;gap:5px;font-size:12px;color:var(--mut);margin-top:6px}
.hint{font-size:11px;color:var(--mut);margin-top:6px}
.err{color:var(--rouge);font-size:12px;min-height:16px;margin-top:4px}

/* classements */
.sousnav,.pays{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.sousnav button,.pays button{flex:none;padding:7px 14px;border-radius:20px;background:var(--carte);border:1px solid var(--trait);
  font-family:var(--dsp);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--mut)}
.sousnav button.on,.pays button.on{background:var(--rouge);color:#fff;border-color:transparent}
.table{border-radius:12px;overflow:hidden;border:1px solid var(--trait)}
.thead,.trow{display:grid;grid-template-columns:34px 1fr 40px 32px 40px;align-items:center;gap:4px;padding:7px 8px;font-size:13px}
.thead{background:rgba(0,0,0,.35);font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--or)}
.trow{border-top:1px solid rgba(255,255,255,.07)}
.trow .c{display:flex;align-items:center;gap:8px;min-width:0}
.trow .c b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow span:not(.c):not(.pos){text-align:center;color:var(--mut)}
.trow .pos{font-family:var(--dsp);font-size:15px;text-align:center}
.trow.moi{background:rgba(255,176,32,.14)}
.trow.ldc .pos{box-shadow:inset 3px 0 0 var(--bleu)}
.trow.el .pos{box-shadow:inset 3px 0 0 var(--vert)}
.trow.rel .pos{box-shadow:inset 3px 0 0 var(--rouge)}
.legende{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:11px;color:var(--mut);margin-top:10px}
.legende .d{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
.legende .d.ldc{background:var(--bleu)}.legende .d.el{background:var(--vert)}.legende .d.rel{background:var(--rouge)}
.groupe{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.gtitre{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--or);margin-bottom:4px}
.grow{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;border-top:1px solid rgba(255,255,255,.07)}
.grow b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow span{color:var(--mut)}

.nt .nth,.nt .ntb{font-size:9.5px;color:var(--mut);opacity:.75;letter-spacing:.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt.off{opacity:0;pointer-events:none}
.ntc{background:var(--rouge);text-align:center;min-width:158px;padding:7px 16px 20px;display:grid;gap:1px;
  clip-path:polygon(0 0,100% 0,100% 74%,57% 74%,50% 100%,43% 74%,0 74%);
  border-radius:12px 12px 0 0;box-shadow:0 6px 16px rgba(255,59,92,.3)}
.ntc .nth{font-size:10px;color:rgba(255,255,255,.9);letter-spacing:.08em}
.ntc b{font-family:var(--dsp);font-size:19px;letter-spacing:.03em;line-height:1.1}
.ntc .ntb{font-size:10px;color:rgba(255,255,255,.9);letter-spacing:.06em}
.affiche{display:block;width:100%;padding:10px;border-bottom:1px solid rgba(255,255,255,.09);
  font-size:13px;text-align:left}
.afl{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:8px}
.afcumul{text-align:center;font-size:10px;color:var(--mut);letter-spacing:.04em;margin-top:5px}
.affiche .gagne{color:var(--vert);font-weight:600}
.affiche .perd{opacity:.5}
.affiche.moi b{color:var(--or)}
.affiche .ag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.affiche .ad{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.affiche i{font-family:var(--dsp);font-style:normal;font-size:17px;min-width:52px;text-align:center}
.affiche i.vide{color:var(--mut)}

.prog{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:8px}
.prog .gain{font-family:var(--dsp);font-size:15px;color:var(--vert)}
.prog .gain.nul{color:var(--mut)}
.pbar{height:7px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--vert),var(--or))}
.pval{font-size:10px;color:var(--mut);white-space:nowrap}
.cartes{position:absolute;right:12%;bottom:6px;display:flex;align-items:center;gap:3px}
.cartes b{font-family:var(--dsp);font-size:13px}
.mdate{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;
  color:var(--mut);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.mdate::before{content:'🕐';font-size:13px;filter:grayscale(1) opacity(.7)}
.titre small{display:block;font-family:var(--bdy);font-size:8.5px;letter-spacing:.05em;color:var(--bleu);
  text-transform:none;font-weight:500;margin-top:1px}

/* ===== v14 : onglets Ligues/Coupes, tchat flottant, tableau des joueurs ===== */
.tabs{grid-template-columns:repeat(6,1fr)}
.tabs button{font-size:9px;letter-spacing:.03em}
.tabs button span{font-size:17px}


.pastille{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--rouge);
  border:2px solid #0A2C63;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.modale.bas{align-items:end;padding-bottom:0}
.mcard.tchat{max-height:78vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;max-width:520px}
.mcard.tchat .chat{flex:1;max-height:none}
.bulle-msg{background:var(--carte2);border-radius:12px 12px 12px 4px;padding:7px 11px;font-size:13px;
  line-height:1.4;word-break:break-word}
.msg.moi .bulle-msg{background:rgba(255,176,32,.2);border-radius:12px 12px 4px 12px}
.msg.sys .bulle-msg{background:rgba(57,217,138,.14);font-size:12px}

.tabj{border-radius:12px;overflow:hidden;border:1px solid var(--trait)}
.tjh,.tjr{display:grid;grid-template-columns:44px 1fr 108px 52px;align-items:center;gap:6px;padding:8px 10px;
  font-size:13px;width:100%;text-align:left}
.tjh{background:rgba(0,0,0,.35);font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;
  font-size:11px;color:var(--or)}
.tjh span:first-child,.tjh span:last-child{text-align:center}
.tjr{border-top:1px solid rgba(255,255,255,.07)}
.tjrang{font-family:var(--dsp);font-size:16px;text-align:center;color:var(--mut)}
.tjnom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tjclub{display:flex;align-items:center;gap:6px;min-width:0}
.tjclub b{font-size:11px;font-weight:500;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tjval{font-family:var(--dsp);font-size:18px;text-align:center}
.tjr.podium .tjnom,.tjr.podium .tjval,.tjr.podium .tjrang{color:var(--vert)}
.tjr.moi{background:rgba(255,176,32,.12)}
.tjr.moi .tjnom{color:var(--or)}

/* ===== v16 : marché des transferts ===== */
.annonce{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:10px;margin-bottom:10px}
.annonce.mienne{border-color:var(--or)}
.anTete{display:flex;align-items:center;gap:10px}
.anTemps{font-family:var(--dsp);font-size:15px;color:var(--rouge);background:rgba(255,59,92,.16);
  border-radius:8px;padding:4px 9px;white-space:nowrap}
.anPrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.anPrix>div{background:rgba(0,0,0,.25);border-radius:10px;padding:7px 10px;display:grid;gap:2px}
.anPrix span{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;font-size:9.5px;color:var(--mut)}
.anPrix b{font-family:var(--dsp);font-size:17px;color:var(--or)}
.anPrix b.vt{color:var(--vert)}
.anMeneur{font-size:11px;color:var(--mut);margin-bottom:8px}
.anMeneur b{color:var(--bleu)}
.anActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.anActions .ok,.anActions .no,.ofactions .ok,.ofactions .no{padding:9px;border-radius:10px;
  font-family:var(--dsp);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.anActions .ok{background:var(--vert);color:#04231A}
.anActions .no{background:rgba(255,255,255,.1);border:1px solid var(--trait)}

.rechzone{margin-bottom:8px}
.postes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid rgba(255,176,32,.5);color:var(--or);border-radius:20px;padding:6px 12px;
  font-family:var(--dsp);letter-spacing:.06em;font-size:13px;min-width:44px}
.chip.on{background:var(--or);color:#2A1600;border-color:transparent}
.tagv{font-style:normal;font-size:9px;background:var(--rouge);color:#fff;border-radius:4px;padding:1px 5px;
  letter-spacing:.06em;vertical-align:middle}
.ligneJ.envente{border-color:rgba(255,59,92,.5)}

.budgetl{display:grid;gap:2px;margin:8px 0}
.bl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 4px;
  border-bottom:1px solid rgba(255,255,255,.09)}
.bl span{font-size:14px;font-weight:500}
.bl b{font-family:var(--dsp);font-size:20px}
.bl b.vt{color:var(--vert)}
.bl b.rg{color:var(--rouge)}
.bl.total{border-bottom:0;border-top:2px solid var(--trait);margin-top:6px}
.bl.total b{color:var(--or);font-size:24px}
.afheure{text-align:center;font-size:10px;color:var(--mut);letter-spacing:.08em;margin-top:4px}
.cr{width:7px;height:11px;background:var(--rouge);border-radius:1px;display:inline-block;flex:none}
.faits{display:grid;gap:4px;margin:10px 0}
.fait{font-size:12px;padding:6px 10px;border-radius:8px;background:var(--carte);display:flex;align-items:center;gap:7px}
.fait.rouge{border-left:3px solid var(--rouge)}
.fait.bless{border-left:3px solid var(--or)}

/* ===== v19 : fond stade, photos ===== */
body{
  background:
    radial-gradient(120% 45% at 50% 100%, rgba(30,110,70,.55) 0%, rgba(16,64,50,0) 60%),
    radial-gradient(70% 30% at 18% 62%, rgba(120,180,220,.10) 0%, transparent 70%),
    radial-gradient(70% 30% at 82% 58%, rgba(120,180,220,.10) 0%, transparent 70%),
    linear-gradient(180deg,#0A2E6B 0%,#0B3574 18%,#0A2A5E 42%,#0E3A55 72%,#14543F 100%) fixed;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(closest-side, rgba(255,255,255,.10), transparent 70%) 18% 58%/150px 90px no-repeat,
    radial-gradient(closest-side, rgba(255,255,255,.08), transparent 70%) 44% 54%/170px 100px no-repeat,
    radial-gradient(closest-side, rgba(255,255,255,.10), transparent 70%) 72% 60%/150px 90px no-repeat,
    linear-gradient(180deg, transparent 55%, rgba(6,20,14,.35) 100%);
}
#app{position:relative;z-index:1}
.vig.photo{background:#fff;border-color:rgba(255,255,255,.65)}
.vig.photo img{width:100%;height:100%;object-fit:cover;display:block}
.carteTop .vig.photo{box-shadow:0 6px 16px rgba(0,0,0,.45)}
textarea{font-family:ui-monospace,monospace;font-size:12px;color:var(--txt);background:rgba(0,0,0,.32);
  border:1px solid var(--trait);border-radius:10px;padding:9px 10px;width:100%;resize:vertical}

/* ===== v21 : import de photos Wikimedia Commons ===== */
.rechC{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0}
.gridC{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.candC{display:grid;gap:4px;padding:0;border-radius:10px;overflow:hidden;background:var(--carte);
  border:1px solid var(--trait);text-align:left}
.candC img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top center;display:block;background:#111}
.candC .ccred{font-size:9px;line-height:1.25;color:var(--mut);padding:4px 6px 6px}
.candC:active{border-color:var(--or)}
.credit{font-size:10.5px;color:var(--mut);text-align:center;margin-top:8px}
.creditL{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid rgba(255,255,255,.08)}
.creditL .pinfo b{font-size:13px}
.creditL .pinfo span{font-size:10.5px;color:var(--mut)}
.progAuto{margin:10px 0}
.progAuto .pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:6px}
.progAuto .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--vert),var(--bleu));transition:width .2s}
.ptxt{font-size:11px;color:var(--mut);text-align:center}

/* ===== v23 : comptes, codes serveur, choix pays/club ===== */
.formAuth{display:grid;gap:10px;margin:16px 0 6px}
.grilleDrapeaux{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.drapeau{display:grid;justify-items:center;gap:3px;background:var(--carte);border:1px solid var(--trait);
  border-radius:14px;padding:14px 8px}
.drapeau .dr{font-size:34px;line-height:1}
.drapeau b{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.drapeau .dispo{font-size:10px;color:var(--mut)}
.drapeau:active{border-color:var(--or)}
.carte-club{position:relative}
.carte-club.pris{opacity:.32;filter:grayscale(1)}
.tagPris{position:absolute;top:4px;right:4px;font-size:8px;background:var(--rouge);color:#fff;
  border-radius:4px;padding:1px 4px;letter-spacing:.06em}
.codeSrv{font-family:var(--dsp);letter-spacing:.14em;font-size:11px;color:var(--or)}
.champCode{text-align:center;font-family:var(--dsp);font-size:28px;letter-spacing:.5em;text-transform:uppercase}
.codeGros{font-family:var(--dsp);font-size:26px;letter-spacing:.3em;color:var(--or);display:inline-block;margin:6px 0}
.srv .dr{font-size:32px;width:44px;text-align:center}
.blocCode{background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.45);border-radius:12px;
  padding:12px;text-align:center;margin:8px 0}
.blocCode span{display:block;font-family:var(--dsp);text-transform:uppercase;letter-spacing:.12em;
  font-size:10px;color:var(--mut)}
.blocCode b{font-family:var(--dsp);font-size:30px;letter-spacing:.35em;color:var(--or)}
.listeEchecs{margin-top:10px}
.echecL{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center;
  background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.echecL .pinfo b{font-size:13px}
.echecL .pinfo span{font-size:10px;color:var(--mut)}
.qidIn{text-align:center;font-family:var(--dsp);letter-spacing:.1em;padding:7px 6px}
.echecL .ok{background:var(--vert);color:#04231A;border-radius:8px;padding:8px 12px;
  font-family:var(--dsp);letter-spacing:.06em}
.bareme{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bareme span{background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:5px 9px;
  font-size:10.5px;color:var(--mut)}
.bareme b{color:var(--or);font-family:var(--dsp);font-size:13px}
.membreL{display:flex;align-items:center;gap:10px;background:var(--carte);border:1px solid var(--trait);
  border-radius:10px;padding:8px 10px;margin-bottom:6px}
.membreL.moi{border-color:var(--or)}
.membreL .pinfo b{font-size:13px}
.membreL .pinfo span{font-size:11px;color:var(--mut)}
.tagMoi{font-size:9px;background:var(--or);color:#2A1600;border-radius:4px;padding:2px 6px;letter-spacing:.06em}
.cta.inactif{background:rgba(255,255,255,.14);color:var(--mut);box-shadow:none}
.cta.retourClub{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 16px}
.cta.retourClub span{font-family:var(--dsp);font-size:19px;letter-spacing:.08em}

/* ===== v34 : maillots en relief ===== */
.kit{position:relative;display:inline-block;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.kitCouleur{position:absolute;inset:0;
  -webkit-mask-image:var(--masque-maillot);mask-image:var(--masque-maillot);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.kitCouleur svg{width:100%;height:100%;display:block}
.kitRelief{position:absolute;inset:0;background-image:var(--ombrage-maillot);
  background-size:100% 100%;background-repeat:no-repeat;mix-blend-mode:overlay;pointer-events:none}
@supports not (mix-blend-mode:overlay){
  .kitRelief{opacity:.35}
}

/* ===== v36 : consignes tactiques ===== */
.tactique.triple{grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:-4px}
.tactique.triple label{font-size:10px}
.tactique.triple select{padding:8px 6px;font-size:12px}
.jauges{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:8px 0 12px;
  background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:10px 12px}
.jg{display:grid;gap:3px}
.jg span{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--mut)}
.jgb{height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.jgb i{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),var(--vert))}
.jgb i.rq{background:linear-gradient(90deg,var(--vert),var(--or),var(--rouge))}
.tagH{font-style:normal;font-size:8.5px;background:var(--bleu);color:#04122B;border-radius:4px;
  padding:1px 5px;margin-left:6px;letter-spacing:.06em;vertical-align:middle}

/* ===== v38 : réglages sonores ===== */
.bascOpt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 2px;
  border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.bascOpt input{width:44px;height:24px;appearance:none;background:rgba(255,255,255,.16);border-radius:14px;
  position:relative;border:0;transition:background .15s}
.bascOpt input::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .15s}
.bascOpt input:checked{background:var(--vert)}
.bascOpt input:checked::after{transform:translateX(20px)}
input[type=range]{appearance:none;height:6px;border-radius:6px;background:rgba(255,255,255,.16);padding:0}
input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--or);border:0}

/* ===== v40 : observation d'un serveur ===== */
.srv{grid-template-columns:auto 1fr auto auto auto}
.srv .obs{background:rgba(47,168,255,.18);border:1px solid rgba(47,168,255,.5);color:var(--bleu);
  border-radius:10px;padding:8px 11px;font-size:16px;line-height:1}
.srv .obs.seul{font-family:var(--dsp);font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px}
.barre.obs{background:linear-gradient(180deg,#123A2E,#0C2A22);border-bottom-color:rgba(57,217,138,.4)}
.barre.obs .titre{font-size:18px}
.barre .ico.vide{background:none;border:0}
.bandeauObs{background:rgba(57,217,138,.14);border:1px solid rgba(57,217,138,.45);border-radius:10px;
  padding:8px 12px;font-size:11.5px;color:var(--vert);text-align:center;margin-bottom:12px}

/* ===== v44 : ballon des serveurs, inactivité ===== */
.ballonSrv{display:inline-block;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}

/* ===== v45 : logo du jeu ===== */
.logoAccueil{display:block;width:150px;height:150px;margin:0 auto 4px;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.logoAccueil.petit{width:96px;height:96px}

/* ===== v47 : guide tactique, coupe inter-serveur ===== */
.outil.guide{background:rgba(47,168,255,.2);border:1px solid rgba(47,168,255,.55);color:var(--bleu)}
.carteTac{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.carteTac.actif{border-color:var(--or)}
.tacTitre{font-family:var(--dsp);text-transform:uppercase;letter-spacing:.1em;font-size:16px;color:var(--or);
  display:flex;align-items:center;gap:8px}
.tacTexte{font-size:12.5px;line-height:1.5;color:var(--txt);opacity:.9;margin:6px 0 10px}
.tacJauges{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:8px}
.tacRel{font-size:11.5px;line-height:1.45;padding:5px 0;border-top:1px solid rgba(255,255,255,.08)}
.tacRel b{font-family:var(--dsp);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;display:block}
.tacRel.bon b{color:var(--vert)}
.tacRel.mauvais b{color:var(--rouge)}
.tacLigne{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:12px;padding:5px 0;
  border-top:1px solid rgba(255,255,255,.08)}
.tacLigne b{font-weight:600}
.tacLigne span{color:var(--mut)}
.tjr.formTac{grid-template-columns:1fr 52px 52px 52px}
.cellFor{display:block;height:7px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.cellFor i{display:block;height:100%}
.interL .afl{grid-template-columns:auto 1fr auto 1fr auto}

/* ===== v49 : calendrier automatique ===== */
.compteur{display:grid;justify-items:center;gap:3px;background:var(--carte);
  border:1px solid var(--trait);border-radius:16px;padding:14px 12px;margin-top:4px}
.compteur span{font-size:11px;color:var(--mut);text-align:center}
.compteur b{font-family:var(--dsp);font-size:30px;letter-spacing:.06em;color:var(--or);line-height:1.1}

/* ===== v51 : état du serveur ===== */
.etatNuage{font-size:11px;text-align:center;padding:7px 10px;border-radius:9px;margin:8px 0;
  background:rgba(255,255,255,.07);color:var(--mut)}
.etatNuage.ok{background:rgba(57,217,138,.14);color:var(--vert)}
.etatNuage.hors{background:rgba(255,176,32,.14);color:var(--or)}
.lien.discret{opacity:.5;font-size:11px}
.lien.discret.danger{opacity:1}

/* ===== v53 : intégrité ===== */
.alerteIntegrite{background:rgba(224,49,49,.16);border:1px solid rgba(224,49,49,.5);
  border-radius:12px;padding:10px 12px;font-size:11.5px;line-height:1.5;color:#FFB3B3;margin-bottom:12px}

/* ===== v56 : diagnostic ===== */
.diagL{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12.5px}
.diagL span{color:var(--mut)}
.diagL b{font-family:var(--dsp);letter-spacing:.04em}
.diagL b.bon{color:var(--vert)}
.diagL b.mauvais{color:var(--rouge)}
.diagErr{background:rgba(224,49,49,.14);border:1px solid rgba(224,49,49,.4);border-radius:8px;
  padding:8px 10px;font-size:11px;color:#FFB3B3;margin-top:8px;word-break:break-word}

/* ===== v57 : glisser-déposer ===== */
.fantome{position:fixed;z-index:200;pointer-events:none;opacity:.9;

/* ============================================================
   AUDIO
   Musique et effets entièrement synthétisés dans le navigateur
   (Web Audio). Aucun fichier n'est embarqué : les sons sont
   fabriqués à la volée, donc libres de tout droit.
   Une piste personnelle peut être ajoutée par son adresse.
   ============================================================ */
const Audio2 = (function(){
  let ctx=null, masterMus=null, masterSfx=null, boucle=null, timer=null;
  let reglages={musique:true,effets:true,volume:0.5,piste:null};
  let pisteExterne=null;

  function demarrerContexte(){
    if(ctx)return ctx;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    ctx=new AC();
    masterMus=ctx.createGain(); masterMus.gain.value=reglages.volume*0.22; masterMus.connect(ctx.destination);
    masterSfx=ctx.createGain(); masterSfx.gain.value=reglages.volume*0.7;  masterSfx.connect(ctx.destination);
    return ctx;
  }

  /* ---------- effets ---------- */
  function enveloppe(g,t,attaque,duree,niveau){
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(niveau,t+attaque);
    g.gain.exponentialRampToValueAtTime(0.0001,t+duree);
  }
  function note(freq,t,duree,type,niveau,dest){
    if(!ctx)return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    enveloppe(g,t,0.012,duree,niveau||0.3);
    o.connect(g); g.connect(dest||masterSfx);
    o.start(t); o.stop(t+duree+0.05);
  }
  function bruit(t,duree,niveau,filtre){
    if(!ctx)return;
    const n=Math.floor(ctx.sampleRate*duree);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const g=ctx.createGain(); g.gain.value=niveau||0.2;
    if(filtre){
      const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=filtre; f.Q.value=1.2;
      src.connect(f); f.connect(g);
    }else src.connect(g);
    g.connect(masterSfx);
    src.start(t);
  }

  const EFFETS={
    clic(){ const t=ctx.currentTime; note(880,t,0.06,'triangle',0.16); },
    but(){                                   // fanfare courte
      const t=ctx.currentTime;
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>note(f,t+i*0.09,0.28,'square',0.22));
      bruit(t,0.5,0.10,2200);
    },
    encaisse(){ const t=ctx.currentTime;
      [392,329.63,261.63].forEach((f,i)=>note(f,t+i*0.11,0.3,'sawtooth',0.16)); },
    sifflet(){ const t=ctx.currentTime;
      bruit(t,0.28,0.16,2600); note(2100,t,0.26,'sine',0.10); },
    notification(){ const t=ctx.currentTime;
      note(987.77,t,0.12,'sine',0.18); note(1318.5,t+0.11,0.18,'sine',0.16); },
    transfert(){ const t=ctx.currentTime;
      [440,554.37,659.25].forEach((f,i)=>note(f,t+i*0.07,0.22,'triangle',0.18)); },
    erreur(){ const t=ctx.currentTime; note(180,t,0.22,'sawtooth',0.16); }
  };

  function jouer(nom){
    if(!reglages.effets)return;
    if(!demarrerContexte())return;
    if(ctx.state==='suspended')ctx.resume();
    const f=EFFETS[nom];
    if(f)try{f();}catch(e){}
  }

  /* ---------- hymne des soirs de coupe ----------
     Composition originale de style baroque : marche solennelle, cuivres et
     nappe chorale. Aucune œuvre existante n'est reprise. */
  const HYMNE=[
    {accord:[130.81,164.81,196.00,261.63],duree:1.6},   // do majeur
    {accord:[146.83,185.00,220.00,293.66],duree:1.6},   // ré mineur
    {accord:[196.00,246.94,293.66,392.00],duree:1.6},   // sol majeur
    {accord:[130.81,164.81,196.00,261.63],duree:2.2},   // retour au do
    {accord:[174.61,220.00,261.63,349.23],duree:1.6},   // fa majeur
    {accord:[196.00,246.94,293.66,392.00],duree:1.6},   // sol majeur
    {accord:[130.81,164.81,196.00,392.00],duree:3.0}    // accord final tenu
  ];
  function choeur(freq,t,duree,niveau){
    // deux voix légèrement désaccordées, filtrées : effet de nappe vocale
    [0,0.6].forEach((detune,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=freq+detune;
      f.type='lowpass'; f.frequency.value=1400; f.Q.value=0.6;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(niveau*(i?0.6:1),t+0.28);
      g.gain.setValueAtTime(niveau*(i?0.6:1),t+duree-0.35);
      g.gain.linearRampToValueAtTime(0.0001,t+duree);
      o.connect(f); f.connect(g); g.connect(masterMus);
      o.start(t); o.stop(t+duree+0.1);
    });
  }
  function cuivre(freq,t,duree,niveau){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type='square'; o.frequency.value=freq;
    f.type='lowpass'; f.frequency.setValueAtTime(700,t);
    f.frequency.linearRampToValueAtTime(2600,t+0.14);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(niveau,t+0.07);
    g.gain.linearRampToValueAtTime(niveau*0.7,t+duree*0.7);
    g.gain.linearRampToValueAtTime(0.0001,t+duree);
    o.connect(f); f.connect(g); g.connect(masterMus);
    o.start(t); o.stop(t+duree+0.1);
  }
  let hymneEnCours=false;
  function jouerHymne(){
    if(!reglages.musique)return 0;
    if(!demarrerContexte())return 0;
    if(ctx.state==='suspended')ctx.resume();
    if(hymneEnCours)return 0;
    hymneEnCours=true;
    const reprise=!!timer;
    arreterMusique();
    let t=ctx.currentTime+0.1;
    HYMNE.forEach((mes,i)=>{
      mes.accord.forEach((f,k)=>choeur(f,t,mes.duree,k===0?0.16:0.11));
      // la ligne de cuivres double la voix supérieure
      cuivre(mes.accord[mes.accord.length-1],t,mes.duree*0.55,0.13);
      if(i<HYMNE.length-1)cuivre(mes.accord[2],t+mes.duree*0.55,mes.duree*0.4,0.09);
      // frappe de timbale au changement d'accord
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(90,t);
      o.frequency.exponentialRampToValueAtTime(40,t+0.3);
      enveloppe(g,t,0.01,0.4,0.34);
      o.connect(g); g.connect(masterMus);
      o.start(t); o.stop(t+0.45);
      t+=mes.duree;
    });
    const duree=(t-ctx.currentTime)*1000;
    setTimeout(()=>{hymneEnCours=false;if(reprise)lancerMusique();},duree+400);
    return duree;
  }

  /* ---------- musique ----------
     Une progression d'accords en la mineur, une ligne de basse et un
     arpège, posés sur une pulsation régulière. Rien n'est enregistré :
     chaque mesure est reconstruite au moment de la jouer. */
  const ACCORDS=[
    [220.00,261.63,329.63],   // la mineur
    [174.61,220.00,261.63],   // fa majeur
    [196.00,246.94,293.66],   // sol majeur
    [164.81,207.65,246.94]    // mi mineur
  ];
  let mesure=0;

  function jouerMesure(){
    if(!ctx||!reglages.musique)return;
    const t=ctx.currentTime+0.05;
    const acc=ACCORDS[mesure%ACCORDS.length];
    const duree=2.0;

    // nappe d'accord
    acc.forEach(f=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), fl=ctx.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=f;
      fl.type='lowpass'; fl.frequency.value=900;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.10,t+0.35);
      g.gain.linearRampToValueAtTime(0.0001,t+duree);
      o.connect(fl); fl.connect(g); g.connect(masterMus);
      o.start(t); o.stop(t+duree+0.1);
    });

    // basse
    note(acc[0]/2,t,0.5,'sine',0.22,masterMus);
    note(acc[0]/2,t+1.0,0.5,'sine',0.18,masterMus);

    // arpège
    for(let i=0;i<8;i++){
      const f=acc[i%3]*(i>=4?2:1);
      note(f,t+i*0.25,0.18,'triangle',0.055,masterMus);
    }

    // pulsation
    for(let i=0;i<4;i++){
      const tk=t+i*0.5;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(110,tk);
      o.frequency.exponentialRampToValueAtTime(45,tk+0.12);
      enveloppe(g,tk,0.005,0.16,0.30);
      o.connect(g); g.connect(masterMus);
      o.start(tk); o.stop(tk+0.2);
      if(i%2===1)bruitMusical(tk+0.25);
    }
    mesure++;
  }
  function bruitMusical(t){
    const n=Math.floor(ctx.sampleRate*0.05);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
    const g=ctx.createGain(); g.gain.value=0.06;
    src.connect(f); f.connect(g); g.connect(masterMus);
    src.start(t);
  }

  function lancerMusique(){
    if(!reglages.musique)return;
    if(!demarrerContexte())return;
    if(ctx.state==='suspended')ctx.resume();
    if(pisteExterne){pisteExterne.play().catch(()=>{});return;}
    if(timer)return;
    jouerMesure();
    timer=setInterval(jouerMesure,2000);
  }
  function arreterMusique(){
    if(timer){clearInterval(timer);timer=null;}
    if(pisteExterne)pisteExterne.pause();
  }

  /* Piste personnelle : le joueur fournit lui-même l'adresse d'un fichier
     dont il a le droit d'usage. Rien n'est téléchargé par le jeu. */
  function definirPiste(url){
    if(pisteExterne){pisteExterne.pause();pisteExterne=null;}
    reglages.piste=url||null;
    if(url){
      pisteExterne=new window.Audio(url);
      pisteExterne.loop=true;
      pisteExterne.volume=reglages.volume*0.6;
      if(reglages.musique){arreterMusique();lancerMusique();}
    }else if(reglages.musique){lancerMusique();}
  }

  function appliquer(r){
    Object.assign(reglages,r||{});
    if(ctx){
      masterMus.gain.value=reglages.volume*0.22;
      masterSfx.gain.value=reglages.volume*0.7;
    }

/* ---------- aléatoire déterministe ---------- */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)];}
function ri(rng,a,b){return a+Math.floor(rng()*(b-a+1));}

/* ---------- étoiles ---------- */
function etoiles(note){
  // 55 -> 0.5 étoile, 93 -> 5 étoiles
  const v=Math.max(0,Math.min(10,Math.round(((note-52)/41)*10)));
  return Math.max(1,v)/2;
}
/* Opération inverse : une notation en étoiles donne une note interne. */
function noteDepuisEtoiles(e){
  const v=Math.max(0.5,Math.min(5,Number(e)||3));
  return Math.round(52+(v*2/10)*41);
}
function htmlEtoiles(note){  const e=etoiles(note);let out='';
  for(let i=1;i<=5;i++){
    if(e>=i)out+='<span class="st f">★</span>';
    else if(e>=i-0.5)out+='<span class="st h">★</span>';
    else out+='<span class="st e">☆</span>';
  }
  return '<span class="stars">'+out+'</span>';
}

/* ---------- maillots (servent de logos) ----------
   Deux couches superposées : les couleurs du club, découpées par le masque
   du maillot, puis une carte d'ombrage en relief calculée hors ligne
   (volume du vêtement, plis du tissu, éclairage) appliquée en fusion. */
const MANCHE_G='M22.5 17.5 L17 21 L11.5 25 L7.8 28.5 L7.4 30.4 L12 37 L16.4 43 '+
                'L19.5 44.8 L23 42.6 L26.4 40 L25.2 28 Z';
const MANCHE_D='M77.5 17.5 L83 21 L88.5 25 L92.2 28.5 L92.6 30.4 L88 37 L83.6 43 '+
                'L80.5 44.8 L77 42.6 L73.6 40 L74.8 28 Z';
function motifSVG(club){
  const c1=club.c1,c2=club.c2,c3=club.c3,motif=club.motif;
  let dessin='';
  if(motif==='stripes'){
    dessin=[9,21,33,45,57,69,81].map(x=>`<rect x="${x}" y="0" width="7.5" height="100" fill="${c2}"/>`).join('');
  }else if(motif==='fines'){
    dessin=[15,24,33,42,51,60,69,78].map(x=>`<rect x="${x}" y="0" width="3.6" height="100" fill="${c2}"/>`).join('');
  }else if(motif==='hoops'){
    dessin=[23,39,55,71].map(y=>`<rect x="0" y="${y}" width="100" height="10" fill="${c2}"/>`).join('');
  }else if(motif==='halves'){
    dessin=`<rect x="50" width="50" height="100" fill="${c2}"/>`;
  }else if(motif==='sash'){
    dessin=`<path d="M2 82 L82 4 L96 14 L16 92 Z" fill="${c2}"/>`;
  }else if(motif==='band'){
    dessin=`<rect x="0" y="46" width="100" height="17" fill="${c2}"/>`;
  }else if(motif==='shoulders'){
    dessin=`<path d="M0 8 H100 V42 H0 Z" fill="${c2}"/>`;
  }else if(motif==='vstripe'){
    dessin=`<rect x="44" y="0" width="12" height="100" fill="${c2}"/>
            <rect x="40.5" y="0" width="3.5" height="100" fill="${c3}"/>
            <rect x="56" y="0" width="3.5" height="100" fill="${c3}"/>`;
  }else if(motif==='chevron'){
    dessin=`<path d="M0 42 L50 64 L100 42 L100 55 L50 77 L0 55 Z" fill="${c2}"/>`;
  }else if(motif==='manches'){
    dessin=`<path d="${MANCHE_G}" fill="${c2}"/><path d="${MANCHE_D}" fill="${c2}"/>`;
  }else if(motif==='manches-rayures'){
    dessin=[9,21,33,45,57,69,81].map(x=>`<rect x="${x}" y="0" width="7.5" height="100" fill="${c2}"/>`).join('')
      +`<path d="${MANCHE_G}" fill="${c3}"/><path d="${MANCHE_D}" fill="${c3}"/>`;
  }
  // col et poignets dans la couleur d'accent, calés sur le masque du relief
  const finitions=
    `<path d="M38.5 12.6 Q42 17.6 50 19.5 Q58 17.6 61.5 12.6" fill="none" stroke="${c3}" stroke-width="3.4" stroke-linecap="round"/>`+
    `<path d="M7.6 30 Q12 37 19 44.6" fill="none" stroke="${c3}" stroke-width="4.2" stroke-linecap="round"/>`+
    `<path d="M92.4 30 Q88 37 81 44.6" fill="none" stroke="${c3}" stroke-width="4.2" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">`+
    `<rect width="100" height="100" fill="${c1}"/>${dessin}${finitions}</svg>`;
}

function maillotSVG(club,taille){
  const t=taille||44;
  if(!club)return `<span class="kit" style="width:${t}px;height:${t}px"></span>`;
  return `<span class="kit" style="width:${t}px;height:${t}px">`+
    `<span class="kitCouleur">${motifSVG(club)}</span>`+
    `<span class="kitRelief"></span></span>`;
}

/* ---------- icône d'un serveur ----------
   Un ballon en dégradé dont la teinte dépend du numéro : la palette est
   donc pratiquement infinie, chaque serveur a la sienne. Le numéro
   s'affiche au centre, avec une taille de texte qui s'adapte à sa longueur. */
function iconeServeur(num,taille){
  const t=taille||40;
  const n=String(num==null?'?':num);
  // trois graines indépendantes : teinte, saturation et clarté varient
  // ensemble, ce qui donne une palette pratiquement sans répétition
  const g1=hashStr('teinte'+n), g2=hashStr('sat'+n), g3=hashStr('clarte'+n);
  const h=g1%360, h2=(h+22+g2%40)%360;
  const sat=62+g2%30;                       // 62 à 91
  const clarte=42+g3%16;                    // 42 à 57
  const uid='bs'+hashStr('b'+n).toString(36);
  const police=n.length<=2?34:n.length===3?26:n.length===4?20:16;

  // facettes du ballon : un pentagone central et cinq hexagones autour
  const pt=(a,r)=>[50+r*Math.cos((a-90)*Math.PI/180),50+r*Math.sin((a-90)*Math.PI/180)];
  const polygone=(pts)=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

function noterJoueurs(onze,pour,contre,gagne,rng){
  return onze.map(j=>{
    if(!j)return null;
    let n=6.0;
    const ligne=(POSTES.find(p=>p[0]===j.poste)||['','',2])[2];
    n+=(j.note-72)*0.018;
    if(typeof perfBonus==='function')n+=perfBonus(j)*0.05;
    n+=gagne===1?0.5:gagne===-1?-0.5:0;
    if(ligne===0){ n+=contre===0?1.1:-0.28*contre; }
    else if(ligne===1){ n+=contre===0?0.6:-0.20*contre; }
    n+=(rng()*1.7-0.85);
    return Math.max(3.5,Math.min(10,Math.round(n*2)/2));
  });
}

const GABARIT=['G','G','G','DD','DD','DC','DC','DC','DC','DG','DG','MDC','MDC','MC','MC','MC','MOC','MOC','MD','MG','AD','AD','AG','AG','BU','BU','BU'];

function nomLibre(rng,pool,pris){
  for(let essai=0;essai<24;essai++){
    const n=pick(rng,pool.p).charAt(0)+'. '+pick(rng,pool.n);
    if(!pris.has(n)){pris.add(n);return n;}
  }
  // les réservoirs de noms sont limités : on distingue alors par une
  // seconde initiale, en parcourant l'alphabet jusqu'à trouver libre
  const famille=pick(rng,pool.n);
  const initiale=pick(rng,pool.p).charAt(0);
  const lettres='abcdefghijklmnopqrstuvwxyz';
  for(let i=0;i<lettres.length;i++){
    const n=initiale+lettres[i]+'. '+famille;
    if(!pris.has(n)){pris.add(n);return n;}
  }
  // cas extrême : on numérote, plutôt que de laisser deux joueurs identiques
  let k=2;
  while(pris.has(initiale+'. '+famille+' '+k))k++;
  const n=initiale+'. '+famille+' '+k;
  pris.add(n);
  return n;
}

function creerMonde(graine){
  const rng=mulberry(hashStr('TNO'+graine));
  const clubs={},joueurs=[];
  const parClub={};
  VEDETTES.forEach(v=>{(parClub[v[0]]=parClub[v[0]]||[]).push(v);});

  // les noms réels sont réservés : aucun joueur généré ne les portera
  const nomsPris=new Set();
  VEDETTES.forEach(v=>nomsPris.add(v[1]));
  if(typeof EFFECTIFS_FOURNIS!=='undefined')
    Object.keys(EFFECTIFS_FOURNIS).forEach(c=>EFFECTIFS_FOURNIS[c].forEach(j=>nomsPris.add(j[0])));

  LEAGUES.forEach(lg=>{
    lg.clubs.forEach((c,idx)=>{
      const club={nom:c[0],c1:c[1],c2:c[2],c3:c[3],motif:c[4],force:c[5],ligue:lg.id,nat:lg.nat,budget:0,ia:true};
      club.budget=Math.round((club.force-58)*4.2+6)*1e6;
      clubs[club.nom]=club;
      const fourni=(typeof EFFECTIFS_FOURNIS!=='undefined')?EFFECTIFS_FOURNIS[club.nom]:null;
      const pris=[];
      if(fourni&&fourni.length>=14){
        // effectif réel fourni : la note se déduit du nombre d'étoiles
        fourni.forEach(f=>{
          pris.push({nom:f[0],poste:f[1],note:noteDepuisEtoiles(f[2]),pays:f[3],vedette:true});
        });
        // on complète jusqu'à 20 si l'effectif fourni est court
        const manque=GABARIT.slice(0,Math.max(0,20-pris.length));
        manque.forEach(poste=>{
          const nat=pick(rng,MIX_NAT[lg.nat]);
          const pool=NOMS[nat];
          const nom=nomLibre(rng,pool,nomsPris);
          const note=Math.max(55,Math.min(89,club.force+ri(rng,-15,-4)));
          pris.push({nom,poste,note,pays:nat,vedette:false});
        });
      }else{
      const vd=(parClub[club.nom]||[]).slice();
      const besoins=GABARIT.slice(0,25);
      // vedettes d'abord
      vd.forEach(v=>{
        const i=besoins.indexOf(v[2]);
        if(i>=0)besoins.splice(i,1);else besoins.pop();
        pris.push({nom:v[1],poste:v[2],note:v[3],pays:v[4],vedette:true});
      });
      besoins.forEach(poste=>{
        const nat=pick(rng,MIX_NAT[lg.nat]);
        const pool=NOMS[nat];
        const nom=nomLibre(rng,pool,nomsPris);
        const ecart=ri(rng,-13,6);
        const note=Math.max(55,Math.min(89,club.force+ecart));
        pris.push({nom,poste,note,pays:nat,vedette:false});
      });
      }
      pris.forEach((p,i)=>{
        // un joueur réel porte son âge véritable quand on le connaît
        const naissance=(typeof NAISSANCES!=='undefined')&&NAISSANCES[p.nom];
        const age=naissance?(2026-naissance):(p.vedette?ri(rng,20,34):ri(rng,17,35));
        joueurs.push({
          id:club.nom+'#'+i, nom:p.nom, club:club.nom, poste:p.poste, note:p.note, pays:p.pays,
          poste2:postesSecondaires(p.poste), attr:calculerAttributs(p.nom,p.poste,p.note),
          age, forme:ri(rng,70,100), moral:ri(rng,60,95),
          buts:0, passes:0, matchs:0, blesse:0, suspendu:0, cartons:0,
          sommeNotes:0, nbNotes:0, motm:0, rouges:0, prog:0, dernierGain:0,
          reel:!!p.vedette, valeur:valeurMarchande(p.note,age)
        });
      });
    });
  });
  return {clubs,joueurs};
}

function valeurMarchande(note,age){
  let v=Math.pow(Math.max(0,note-48),2.55)*900;
  if(age>29)v*=Math.max(.22,1-(age-29)*.17);
  if(age<22)v*=1.22;
  return Math.max(3e5,Math.round(v/1e5)*1e5);
}

/* ---------- calendrier championnat (round-robin aller/retour) ---------- */
function calendrierLigue(noms,rng){
  const n=noms.length,t=noms.slice();
  if(rng){for(let i=t.length-1;i>0;i--){const k=Math.floor(rng()*(i+1));[t[i],t[k]]=[t[k],t[i]];}}
  const jours=[];
  for(let j=0;j<n-1;j++){
    const m=[];
    for(let i=0;i<n/2;i++){
      const a=t[i],b=t[n-1-i];
      m.push(j%2===0?[a,b]:[b,a]);
    }
    jours.push(m);
    t.splice(1,0,t.pop());
  }
  const retour=jours.map(j=>j.map(m=>[m[1],m[0]]));
  return jours.concat(retour);
}

/* Profondeur et couloir de chaque rôle, pour le placement automatique. */
const ANCRAGE={
  G:  {y:90,x:50, cote:0},
  DG: {y:74,x:11, cote:-1}, DD:{y:74,x:89, cote:1}, DC:{y:77,x:50, cote:0},
  MDC:{y:60,x:50, cote:0},  MC:{y:50,x:50, cote:0},
  MG: {y:48,x:11, cote:-1}, MD:{y:48,x:89, cote:1},
  MOC:{y:33,x:50, cote:0},
  AG: {y:22,x:15, cote:-1}, AD:{y:22,x:85, cote:1}, BU:{y:15,x:50, cote:0}
};
function placementAuto(postes){
  // on regroupe les postes identiques pour les répartir sur la largeur
  const groupes={};
  postes.forEach((p,i)=>{(groupes[p]=groupes[p]||[]).push(i);});
  const pos=new Array(postes.length);
  Object.keys(groupes).forEach(p=>{
    const idx=groupes[p], a=ANCRAGE[p]||ANCRAGE.MC, n=idx.length;
    idx.forEach((i,k)=>{
      let x=a.x, y=a.y;
      if(n>1){
        if(a.cote===0){
          const etendue=Math.min(62,20+n*13);
          x=50-etendue/2+etendue*(k/(n-1));
        }else{
          // plusieurs joueurs sur le même couloir : on les décale en profondeur
          x=a.x+(a.cote>0?-1:1)*k*9;
          y=a.y-k*10;
        }
      }
      pos[i]=[Math.round(x),Math.round(y)];
    });
  });
  // léger décalage vertical pour éviter les superpositions strictes
  const vus={};
  pos.forEach((p,i)=>{
    const cle=p[0]+'|'+p[1];
    if(vus[cle]!==undefined){pos[i]=[p[0],p[1]-6];}
    vus[cle]=i;
  });
  return pos;
}

/* ---------- simulation de match ----------
   Le profil d'une formation se déduit de sa composition : le nombre de
   joueurs par ligne et leur rôle donnent son équilibre défensif, sa
   maîtrise du milieu, son poids offensif et sa largeur. */
const PROFIL_FORMATION=(function(){
  const out={};
  Object.keys(FORMATIONS).forEach(nom=>{
    const p=FORMATIONS[nom].postes;
    const compte=c=>p.filter(x=>x===c).length;
    const def=compte('DC')+compte('DD')+compte('DG');
    const mil=compte('MDC')+compte('MC')+compte('MD')+compte('MG')+compte('MOC');
    const att=compte('AD')+compte('AG')+compte('BU');
    // un milieu défensif protège, un milieu offensif projette
    const bascule=(compte('MDC')-compte('MOC'))*0.018;
    const largeur=(compte('MG')+compte('MD')+compte('AG')+compte('AD')+compte('DG')+compte('DD'))/6;
    out[nom]={
      def:1+(def-4)*0.062+bascule,
      mil:1+(mil-4)*0.045,
      att:1+(att-2)*0.075-bascule*0.6,
      larg:0.90+largeur*0.11
    };
  });
  return out;
})();

/* Force réelle de chaque ligne : moyenne des joueurs qui l'occupent,
   pondérée par leur aptitude au poste, leur forme et leurs bonus. */
function forceEquipe(onze,formation,style,consignes){
  const f=FORMATIONS[formation]||FORMATIONS['4-4-2'];
  const pf=PROFIL_FORMATION[formation]||PROFIL_FORMATION['4-4-2'];
  const st=STYLES[style]||STYLES['Équilibré'];
  const c=consignes||{};
  const me=MENTALITES[c.mentalite]||MENTALITES['Neutre'];
  const pr=PRESSIONS[c.pression]||PRESSIONS['Bloc médian'];
  const la=LARGEURS[c.largeur]||LARGEURS['Normale'];
  const lignes={0:[],1:[],2:[],3:[]};
  onze.forEach((j,i)=>{
    const poste=f.postes[i];
    const l=(POSTES.find(p=>p[0]===poste)||['','',2])[2];
    if(!j){lignes[l].push(48);return;}   // poste laissé vide : gros trou
    const bonus=(typeof perfBonus==='function')?perfBonus(j):0;
    const forme=0.90+(j.forme-70)/300;   // 70 de forme = neutre
    lignes[l].push((j.note+bonus)*fitPoste(j,poste)*forme);
  });
  const moy=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:58;
  const nb=l=>lignes[l].length;
  // le profil de formation et la densité s'ajoutent en points : ils ne doivent pas
  // amplifier proportionnellement le niveau d'un effectif déjà très fort
  const ecartF=v=>(v-1)*45;
  // la largeur de jeu récompense les formations pourvues sur les couloirs
  const bonusLargeur=la.ailes*(pf.larg-1)*6+la.axe*(1.06-pf.larg)*6;
  return {
    gk:moy(lignes[0]),
    def:moy(lignes[1])+ecartF(pf.def)+(nb(1)-4)*1.0+st.def+me.def+pr.def,
    mil:moy(lignes[2])+ecartF(pf.mil)+(nb(2)-4)*1.0+(st.poss+me.poss+pr.poss)*0.25,
    att:moy(lignes[3])+ecartF(pf.att)+(nb(3)-3)*1.2+st.att+me.att+bonusLargeur,
    poss:st.poss+me.poss+pr.poss,
    risque:(st.risque||0)+(pr.risque||0),
    larg:pf.larg, style:style||'Équilibré'
  };
}

function poisson(rng,lambda){
  const L=Math.exp(-Math.min(lambda,12));
  let k=0,p=1;
  do{k++;p*=rng();}while(p>L);
  return k-1;
}

function simulerMatch(A,B,rng,domicile){
  const dom=domicile===false?0:1.7;                 // avantage du terrain, en points

  // maîtrise du milieu -> possession
  const mA=A.mil+dom+A.poss*1.6, mB=B.mil+B.poss*1.6;
  let pA=mA/(mA+mB);
  pA=Math.max(0.28,Math.min(0.72,pA));

  // ascendant tactique
  const cA=(CONTRES[A.style]||{})[B.style]||0;
  const cB=(CONTRES[B.style]||{})[A.style]||0;
  // une équipe qui prend des risques s'expose aux transitions adverses
  const expoA=(A.risque||0)*0.55, expoB=(B.risque||0)*0.55;

  // solidité défensive : la ligne compte plus que le gardien
  const soliditeA=A.def*0.66+A.gk*0.34;
  const soliditeB=B.def*0.66+B.gk*0.34;

  const attendus=(att,contre,solidite,poss)=>{
    const ecart=((att+contre)-solidite)/9;          // écart exprimé en niveaux
    return Math.max(0.12,Math.min(4.4,1.25*Math.exp(ecart*0.40)*(0.58+poss*0.84)));
  };
  const xgA=attendus(A.att+dom,cA+expoB,soliditeB,pA);
  const xgB=attendus(B.att,cB+expoA,soliditeA,1-pA);

  const ga=Math.min(9,poisson(rng,xgA));
  const gb=Math.min(9,poisson(rng,xgB));

  const evts=[];
  const minutes=n=>{const m=[];for(let i=0;i<n;i++)m.push(ri(rng,1,90));return m.sort((x,y)=>x-y);};
  minutes(ga).forEach(m=>evts.push({m,eq:'A',t:'but'}));
  minutes(gb).forEach(m=>evts.push({m,eq:'B',t:'but'}));
  evts.sort((x,y)=>x.m-y.m);

  return {ga,gb,evts,possA:Math.round(pA*100),xgA:+xgA.toFixed(2),xgB:+xgB.toFixed(2)};
}

/* ---------- classement ---------- */
function nouvelleLigne(){return {j:0,g:0,n:0,p:0,bp:0,bc:0,pts:0};}
function appliquer(tab,dom,ext,ga,gb){
  const a=tab[dom]||(tab[dom]=nouvelleLigne());
  const b=tab[ext]||(tab[ext]=nouvelleLigne());
  a.j++;b.j++;a.bp+=ga;a.bc+=gb;b.bp+=gb;b.bc+=ga;
  if(ga>gb){a.g++;b.p++;a.pts+=3;}
  else if(ga<gb){b.g++;a.p++;b.pts+=3;}
  else{a.n++;b.n++;a.pts++;b.pts++;}
}
function trierClassement(tab){
  return Object.keys(tab).map(k=>({club:k,...tab[k]}))
    .sort((a,b)=>b.pts-a.pts||(b.bp-b.bc)-(a.bp-a.bc)||b.bp-a.bp||a.club.localeCompare(b.club));
}

function hachage(txt,sel){
  let h1=0x811c9dc5,h2=0x1000193;
  const s=String(sel||'')+'|'+String(txt);
  for(let tour=0;tour<600;tour++){
    for(let i=0;i<s.length;i++){
      h1^=s.charCodeAt(i);h1=Math.imul(h1,16777619)>>>0;
      h2=(Math.imul(h2^h1,2246822519)+i)>>>0;
    }
    h1=(h1^h2)>>>0;
  }
  return (h1>>>0).toString(36)+'-'+(h2>>>0).toString(36);
}
function selAleatoire(){
  return Math.floor(Math.random()*1e12).toString(36)+Date.now().toString(36);
}

async function inscrire(pseudo,mdp){
  pseudo=(pseudo||'').trim();
  if(pseudo.length<3)return {err:'Le pseudo doit faire au moins 3 caractères.'};
  if(pseudo.length>14)return {err:'Le pseudo ne doit pas dépasser 14 caractères.'};
  if(!/^[\w\-À-ÿ ]+$/.test(pseudo))return {err:'Le pseudo contient un caractère interdit.'};
  if((mdp||'').length<4)return {err:'Le mot de passe doit faire au moins 4 caractères.'};
  const comptes=await listerComptes();
  if(comptes.some(c=>c.pseudo.toLowerCase()===pseudo.toLowerCase()))
    return {err:'Ce pseudo est déjà pris sur cet appareil.'};
  const sel=selAleatoire();
  comptes.push({pseudo,sel,hash:hachage(mdp,sel),cree:Date.now(),
                dernierJour:aujourdhuiISO(),serie:1});
  await Store.set(CLE_COMPTES,comptes);
  await Store.set(CLE_SESSION,pseudo);
  return {pseudo};
}
async function connecter(pseudo,mdp){
  const comptes=await listerComptes();
  const c=comptes.find(x=>x.pseudo.toLowerCase()===(pseudo||'').trim().toLowerCase());
  if(!c)return {err:'Aucun compte à ce pseudo sur cet appareil.'};
  if(c.hash!==hachage(mdp,c.sel))return {err:'Mot de passe incorrect.'};
  await Store.set(CLE_SESSION,c.pseudo);

}

const ALPHABET_CODE='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // sans I, O, 0, 1
const DUREE_OUVERTURE=3*24*60*60*1000;                    // trois jours
const DUREE_INACTIVITE=7*24*60*60*1000;                   // sept jours sans jouer libère le club

function genererCode(){
  let c='';
  for(let i=0;i<4;i++)c+=ALPHABET_CODE[Math.floor(Math.random()*ALPHABET_CODE.length)];
  return c;
}
async function codeLibre(code){
  const liste=await listerServeurs();
  return !liste.some(s=>s.code===code);
}
/* Un serveur reste accessible librement pendant trois jours. Passé ce
   délai le code est exigé — sauf s'il est resté vide : personne n'y a de
   partie en cours, il n'y a donc rien à protéger. */
function serveurVide(srv){
  return Object.keys((srv&&srv.membres)||{}).length===0;
}
function serveurOuvert(srv){
  if(serveurVide(srv))return true;
  return (Date.now()-(srv.cree||0))<DUREE_OUVERTURE;
}
function joursRestants(srv){
  const reste=DUREE_OUVERTURE-(Date.now()-(srv.cree||0));
  if(reste<=0)return 0;
  return Math.ceil(reste/(24*60*60*1000));
}
function clubsPris(srv){

}
function clubLibre(srv,club){
  return !clubsPris(srv).includes(club);
}

/* ---------- assiduité : série de jours consécutifs ---------- */
function aujourdhuiISO(){ return new Date().toISOString().slice(0,10); }
function veilleDe(iso){
  const d=new Date(iso+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}
const SERIE_REQUISE=10;                       // jours consécutifs pour ouvrir un serveur
const MAX_CLUBS_PAR_COMPTE=2;

async function marquerActivite(pseudo){
  const comptes=await listerComptes();
  const c=comptes.find(x=>x.pseudo===pseudo);
  if(!c)return null;
  const jour=aujourdhuiISO();
  if(c.dernierJour===jour)return c;            // déjà compté aujourd'hui
  if(c.dernierJour===veilleDe(jour))c.serie=(c.serie||0)+1;
  else c.serie=1;
  c.dernierJour=jour;
  await Store.set(CLE_COMPTES,comptes);
  return c;
}
async function serieDe(pseudo){
  const comptes=await listerComptes();
  const c=comptes.find(x=>x.pseudo===pseudo);
  if(!c)return 0;
  const jour=aujourdhuiISO();
  // la série est rompue si le dernier passage n'est ni aujourd'hui ni hier
  if(c.dernierJour!==jour&&c.dernierJour!==veilleDe(jour))return 0;
  return c.serie||0;
}
async function peutCreerServeur(pseudo){
  return (await serieDe(pseudo))>=SERIE_REQUISE;
}
async function nbClubsDe(pseudo){
  const liste=await listerServeurs();
  return liste.filter(s=>s.membres&&s.membres[pseudo]).length;
}

/* ---------- ouverture automatique de serveurs ----------
   Un serveur s'ouvre toutes les deux heures, et dès que cinq comptes
   sont créés dans la même heure. */
const CLE_AUTO='tno_auto';
const INTERVALLE_AUTO=2*60*60*1000;
const SEUIL_INSCRIPTIONS=5;

async function etatAuto(){ return (await Store.get(CLE_AUTO))||{dernier:0,dernierPic:0}; }

async function verifierServeursAuto(){
  const now=Date.now();
  const etat=await etatAuto();
  const comptes=await listerComptes();
  const recents=comptes.filter(c=>now-(c.cree||0)<60*60*1000).length;
  let crees=0;

  if(now-(etat.dernier||0)>=INTERVALLE_AUTO){
    await creerServeurAuto('ouverture périodique');
    etat.dernier=now;crees++;
  }
  if(recents>=SEUIL_INSCRIPTIONS&&now-(etat.dernierPic||0)>=60*60*1000){
    await creerServeurAuto(recents+' inscriptions dans l\'heure');
    etat.dernierPic=now;crees++;
  }
  await Store.set(CLE_AUTO,etat);
  return crees;
}

async function creerServeurAuto(motif){
  const liste=await listerServeurs();
  const dejaVu=(await Store.get(CLE_COMPTEUR))||0;
  const num=Math.max(dejaVu,liste.reduce((a,s)=>Math.max(a,s.num||0),0))+1;
  await Store.set(CLE_COMPTEUR,num);
  let code=genererCode(),essais=0;
  while(!(await codeLibre(code))&&essais<50){code=genererCode();essais++;}
  const srv={id:'a'+Date.now().toString(36)+num,num,nom:'Serveur #'+num,
             code,graine:'g'+Math.floor(Math.random()*1e9).toString(36),
             cree:Date.now(),membres:{},auto:true,motif:motif||'automatique'};
  liste.push(srv);
  await enregistrerListe(liste);
  return srv;
}

async function creerServeur(club,pseudo){
  if(!(await peutCreerServeur(pseudo)))
    return {err:'Il faut '+SERIE_REQUISE+' jours de jeu consécutifs pour ouvrir un serveur.'};
  if(await nbClubsDe(pseudo)>=MAX_CLUBS_PAR_COMPTE)
    return {err:'Un compte ne peut diriger que '+MAX_CLUBS_PAR_COMPTE+' clubs.'};
  const liste=await listerServeurs();
  const dejaVu=(await Store.get(CLE_COMPTEUR))||0;
  const num=Math.max(dejaVu,liste.reduce((a,s)=>Math.max(a,s.num||0),0))+1;
  await Store.set(CLE_COMPTEUR,num);
  let code=genererCode();
  let essais=0;
  while(!(await codeLibre(code))&&essais<50){code=genererCode();essais++;}
  const srv={id:'s'+Date.now().toString(36),num,nom:'Serveur #'+num,club,pseudo:pseudo||'MANAGER',
             code,graine:'g'+Math.floor(Math.random()*1e9).toString(36),cree:Date.now(),
             membres:{[pseudo||'MANAGER']:club}};
  liste.push(srv);
  await enregistrerListe(liste);
  await Store.set(CLE_ACTIF,srv.id);
  nouvellePartie(club,srv.graine,srv);
  await Store.set(CLE_SAVE(srv.id+'_'+(pseudo||'MANAGER')),sansIndex());
  return srv;
}

  liste=liste||await listerServeurs();

  const cible=liste.find(s=>s.id===srv.id)||srv;

  cible.membres[pseudo]=club;

/* ---------- sauvegarde ---------- */
const Store={
  async set(k,v){
    try{ if(window.storage&&window.storage.set){await window.storage.set(k,JSON.stringify(v));return true;} }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(v));return true; }catch(e){ return false; }
  },
  async get(k){
    try{ if(window.storage&&window.storage.get){const r=await window.storage.get(k);return r?JSON.parse(r.value):null;} }catch(e){}
    try{ const r=localStorage.getItem(k);return r?JSON.parse(r):null; }catch(e){ return null; }
  },
  async del(k){
    try{ if(window.storage&&window.storage.delete){await window.storage.delete(k);} }catch(e){}
    try{ localStorage.removeItem(k); }catch(e){}
  },
  /* Liste toutes les clés du jeu, quel que soit le support de stockage. */
  async cles(){
    const vues=new Set();
    try{
      if(window.storage&&window.storage.list){
        const r=await window.storage.list('tno_');
        (r&&r.keys||[]).forEach(k=>vues.add(k));
      }
    }catch(e){}
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&k.indexOf('tno_')===0)vues.add(k);
      }
    }catch(e){}
    return [...vues];
  }
};

/* ---------- sauvegarde de l'état (sans l'index, reconstruit au chargement) ---------- */

  if(S)S.derniereActivite=Date.now();

  _tSave=setTimeout(()=>{
