/* ---------- déroulement automatique ----------
   Le calendrier est calqué sur le temps réel : une journée par jour, coup
   d'envoi à 18h00 heure de Paris. Le rattrapage se fait à l'ouverture, si
   bien que rien ne dépend d'une action du joueur.
   ============================================================ */
const HEURE_COUP_ENVOI=18;
const INTERVALLE_JOURNEE=24*60*60*1000;

/* Décalage entre Paris et le temps universel à un instant donné : il change
   avec l'heure d'été, on le mesure donc plutôt que de le supposer. */
function decalageParis(ts){
  try{
    const p={};
    new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit'})
      .formatToParts(new Date(ts)).forEach(x=>{p[x.type]=x.value;});
    const local=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second);
    return local-Math.floor(ts/1000)*1000;
  }catch(e){ return 2*60*60*1000; }        // repli : heure d'été
}
/* Horodatage universel d'une heure donnée, un jour donné, à Paris. */
function instantParis(iso,heure){
  const [a,m,j]=String(iso).split('-').map(Number);
  let ts=Date.UTC(a,m-1,j,heure||0);
  ts-=decalageParis(ts);
  ts=Date.UTC(a,m-1,j,heure||0)-decalageParis(ts);   // second passage : bascule d'heure
  return ts;
}
/* Date du jour à Paris, et lendemain. */
function jourParis(ts){
  const d=new Date((ts||Date.now())+decalageParis(ts||Date.now()));
  return d.toISOString().slice(0,10);
}
function lendemainParis(ts){
  const d=new Date(instantParis(jourParis(ts),12)+24*60*60*1000);
  return jourParis(d.getTime());
}

/* Coup d'envoi de la journée en cours, d'après le calendrier réel. */
function prochaineEcheance(){
  if(!S||!S.dates||S.jour>=S.dates.length)return 0;
  return instantParis(S.dates[S.jour],HEURE_COUP_ENVOI);
}
function attenteAvantJournee(){
  return Math.max(0,prochaineEcheance()-Date.now());
}
/* Joue toutes les journées dues depuis la dernière visite. */
function rattraperJournees(limite){
  if(!S||S.observation)return [];
  const max=limite||400;
  const mesMatchs=[];
  let n=0;
  while(n<max){
    if(S.jour>=S.journees.length){
      // la saison est finie : on attend le coup d'envoi de la suivante
      const reprise=S.datesSuivantes&&S.datesSuivantes[0];
      if(!reprise||Date.now()<instantParis(reprise,HEURE_COUP_ENVOI))break;
      nouvelleSaison();
      n++;
      continue;
    }
    const echeance=instantParis(S.dates[S.jour],HEURE_COUP_ENVOI);
    if(Date.now()<echeance)break;
    const r=jouerJournee();
    if(r&&r.joue)mesMatchs.push(r);
    n++;
  }
  if(n)sauver();
  return mesMatchs;
}

/* ============================================================
   CONTRÔLE D'INTÉGRITÉ
   Le jeu se déroule chez le joueur : une sauvegarde modifiée à la main
   pourrait donc gonfler un classement. On ne peut pas l'empêcher tant que
   la simulation reste locale, mais on peut refuser de publier ce qui ne
   tient pas debout, et rendre la falsification visible.
   ============================================================ */

/* Empreinte d'une sauvegarde : elle change dès qu'un chiffre clé bouge. */
function empreinteSauvegarde(e){
  const parts=[e.graine,e.monClub,e.saison,e.jour,e.budget,
    (e.joueurs||[]).length,
    (e.joueurs||[]).reduce((a,j)=>a+j.note,0),
    (e.resultats||[]).length,
    JSON.stringify(e.managers||{}),
    JSON.stringify(e.mondial||{})].join('|');
  return hashStr(parts).toString(36)+'-'+hashStr(parts.split('').reverse().join('')).toString(36);
}
function signerSauvegarde(e){
  const copie={};for(const k in e){if(k!=='signature')copie[k]=e[k];}
  e.signature=empreinteSauvegarde(copie);
  return e;
}
function signatureValide(e){
  if(!e||!e.signature)return false;
  const copie={};for(const k in e){if(k!=='signature')copie[k]=e[k];}
  return e.signature===empreinteSauvegarde(copie);
}

/* Une partie doit rester cohérente avec elle-même et avec le calendrier réel. */
function verifierCoherence(e){
  const pb=[];
  if(!e)return ['sauvegarde absente'];

  // le calendrier ne peut pas avoir pris de l'avance sur le temps réel
  if(e.dates&&e.dates.length){
    const joueesPossibles=e.dates.filter(d=>Date.now()>=instantParis(d,HEURE_COUP_ENVOI)).length;
    if(e.jour>joueesPossibles)pb.push('journées en avance sur le calendrier');
  }
  if(e.saison<1||e.saison>200)pb.push('numéro de saison invalide');
  if(e.jour<0||(e.journees&&e.jour>e.journees.length))pb.push('journée hors saison');

  // effectifs et joueurs
  const j=e.joueurs||[];
  if(j.some(x=>!isFinite(x.note)||x.note<40||x.note>99))pb.push('note de joueur hors bornes');
  if(j.some(x=>!isFinite(x.age)||x.age<15||x.age>45))pb.push('âge de joueur invalide');
  if(new Set(j.map(x=>x.id)).size!==j.length)pb.push('joueurs en double');
  if(e.clubs){
    const tailles=Object.keys(e.clubs).map(n=>j.filter(x=>x.club===n).length);
    if(tailles.some(t=>t<MIN_EFFECTIF-2||t>MAX_EFFECTIF+2))pb.push('effectif hors bornes');
  }

  // finances : le solde doit se déduire des mouvements
  if(e.finances&&isFinite(e.budget)){
    const f=e.finances;
    const attendu=f.initial-f.achats+f.ventes+f.primes;
    if(Math.abs(attendu-e.budget)>1)pb.push('budget incohérent avec les mouvements');
  }
  if(!isFinite(e.budget)||e.budget<0)pb.push('budget invalide');

  // points de manager : bornés par le nombre de matchs réellement disputés
  if(e.managers&&e.resultats){
    const plafondParMatch=Math.max(POINTS_MANAGER.LDC.victoire,POINTS_MANAGER.EL.victoire);
    const titres=POINTS_MANAGER.titres.ldc+POINTS_MANAGER.titres.championnat+
                 POINTS_MANAGER.titres.coupe+POINTS_MANAGER.titres.el;
    const matchsMax=(e.journees?e.journees.length:38)*3;
    const plafond=matchsMax*plafondParMatch+titres+POINTS_INTER.titre+
                  (POINTS_INTER.victoire*6);
    if(Object.values(e.managers).some(v=>!isFinite(v)||v<0||v>plafond))
      pb.push('points de manager hors plafond');
  }
  return pb;
}

/* Ce que l'on accepte d'envoyer au serveur. */
function partiePubliable(e){
  return verifierCoherence(e).length===0&&signatureValide(e);
}

/* ---------- remise à zéro complète ----------
   Efface comptes, serveurs, sauvegardes et classements. Rien n'est conservé. */
async function toutEffacer(){
  const cles=await Store.cles();
  for(const k of cles)await Store.del(k);
  S=null;
  return cles.length;
}

/* ---------- inactivité : un club inoccupé sept jours redevient libre ----------
   On regarde la date d'activité de chaque manager sur chaque serveur. Passé
   le délai, sa place est retirée et son club rendu disponible ; sa sauvegarde
   est effacée pour qu'il ne puisse pas la reprendre en douce. */
async function verifierInactifs(){
  const liste=await listerServeurs();
  const liberes=[];
  let modifie=false;
  for(const srv of liste){
    const membres=srv.membres||{};
    for(const pseudo of Object.keys(membres)){
      // la session actuellement ouverte n'est pas encore forcément reflétée
      // sur le disque : on ne l'évalue jamais elle-même
      if(S&&S.serveur===srv.id&&S.pseudo===pseudo)continue;
      const sv=await Store.get(CLE_SAVE(srv.id+'_'+pseudo));
      const derniere=(sv&&sv.derniereActivite)||0;
      if(Date.now()-derniere>DUREE_INACTIVITE){
        liberes.push({serveur:srv.id,pseudo,club:membres[pseudo]});
        delete membres[pseudo];
        await Store.del(CLE_SAVE(srv.id+'_'+pseudo));
        modifie=true;
      }
    }
  }
  if(modifie)await enregistrerListe(liste);
  return liberes;
}

/* ---------- observation d'un autre serveur ----------
   On charge la sauvegarde d'un serveur pour la consulter sans rien modifier. */
async function sauvegardesDuServeur(id){
  const liste=await listerServeurs();
  const srv=liste.find(s=>s.id===id);
  const cles=[];
  Object.keys((srv&&srv.membres)||{}).forEach(p=>cles.push(CLE_SAVE(id+'_'+p)));
  cles.push(CLE_SAVE(id));
  for(const c of cles){
    const sv=await Store.get(c);
    if(sv&&sv.monClub)return sv;
  }
  return null;
}
/* Un serveur sans joueur humain n'a aucune sauvegarde : on reconstruit sa
   saison à partir de sa graine, en la faisant avancer d'une journée toutes
   les deux heures depuis son ouverture. Le résultat est déterministe. */
function simulerServeur(srv){
  const memoire=S;
  const club=LEAGUES[0].clubs[0][0];
  nouvellePartie(club,srv.graine,srv);
  const etat=S;
  let cible=0;
  while(cible<etat.dates.length&&Date.now()>=instantParis(etat.dates[cible],HEURE_COUP_ENVOI))cible++;
  for(let i=0;i<cible;i++)jouerJournee();
  etat.spectateur=true;
  etat.observation=true;
  S=memoire;
  return etat;
}
/* `srvConnu` permet d'observer un serveur partagé, absent de la liste locale.
   Faute d'accès aux sauvegardes d'autrui, sa saison est alors reconstruite à
   partir de sa graine : le monde et le calendrier sont les mêmes pour tous. */
async function chargerObservation(id,srvConnu){
  const liste=await listerServeurs();
  const srv=srvConnu||liste.find(s=>s.id===id);
  const sv=await sauvegardesDuServeur(id);
  if(sv){
    const etat=migrer(sv);
    etat.index={};etat.joueurs.forEach(j=>etat.index[j.id]=j);
    etat.observation=true;
    return etat;
  }
  if(srv&&srv.graine)return simulerServeur(srv);
  return null;
}

/* ---------- migration d'une sauvegarde plus ancienne ---------- */
function migrer(s){
  if(!s||!s.monClub)return s;
  const rng=mulberry(hashStr((s.graine||'x')+'-mig'));
  s.saison=s.saison||1;
  s.pseudo=s.pseudo||'MANAGER';
  s.palmares=s.palmares||[];
  s.creneaux=s.creneaux||{soin:null,boost:null,recup:null,entr:null};
  s.bonus=s.bonus||[];
  if(s.journees&&s.journees.some(j=>j.type==='C'||j.type==='N'||!('coupe' in j))){
    const rng2=mulberry(hashStr((s.graine||'x')+'-cal'+(s.saison||1)));
    const joueesL=s.journees.slice(0,s.jour||0).filter(j=>j.type==='L').length;
    s.journees=construireJournees(rng2);
    s.dates=construireDates(s.journees,2026+((s.saison||1)-1));
    s.jour=Math.min(joueesL,s.journees.length);
    s.calRefait=true;
  }
  if(!s.dates||!s.dates.length)s.dates=construireDates(s.journees,2026+((s.saison||1)-1));
  s.marche=s.marche||[];
  s.managers=s.managers||{};
  s.mondial=s.mondial||{};
  s.mondialAutres=s.mondialAutres||[];
  if(s.inter===undefined)s.inter=null;
  if(!s.datesSuivantes&&s.dates&&s.dates.length)
    s.datesSuivantes=[repriseApres(s.dates[s.dates.length-1])];
  delete s.prochaineJournee;          // l'échéance se déduit désormais du calendrier
  s.membres=s.membres||{};
  if(!s.numServeur)s.numServeur=parseInt(String(s.nomServeur||'').replace(/\D/g,''),10)||1;
  if(!s.derniereActivite)s.derniereActivite=Date.now();
  if(!s.consignes)s.consignes={mentalite:'Neutre',pression:'Bloc médian',largeur:'Normale'};
  if(!STYLES[s.style])s.style='Jeu de passes';
  if(!FORMATIONS[s.formation])s.formation='4-3-3';
  Object.keys(s.tactiqueIA||{}).forEach(n=>{
    const t=s.tactiqueIA[n];
    if(!FORMATIONS[t.f])t.f='4-4-2';
    if(!STYLES[t.s])t.s='Équilibré';
  });
  if(!s.finances)s.finances={initial:s.budget||0,achats:0,ventes:0,primes:s.recettes||0};
  s.recettes=s.recettes||0;
  s.journalFinance=s.journalFinance||[];
  if(s.entrainement&&s.entrainement.length&&!s.creneaux.entr){
    const e=s.entrainement[0];
    s.creneaux.entr={joueur:e.joueur,reste:2,attr:e.cle};
  }
  delete s.entrainement;
  s.historique=s.historique||[];
  s.gazette=s.gazette||[];
  s.chat=s.chat||[];
  if(s.chatLu==null)s.chatLu=(s.chat||[]).filter(m=>!m.moi).length;
  s.serveur=s.serveur||'solo';
  s.nomServeur=s.nomServeur||'Serveur #1';
  s.offresRecues=s.offresRecues||[];
  s.offresEnvoyees=s.offresEnvoyees||[];
  if(!s.coupesNat)s.coupesNat=creerCoupesNationales(rng);
  if(s.coupes&&s.coupes.LDC&&s.coupes.LDC.groupes){
    // l'ancienne phase de groupes laisse place à une élimination directe
    const parLigue={};
    LEAGUES.forEach(lg=>{parLigue[lg.id]=lg.clubs.slice().sort((a,b)=>b[5]-a[5]).map(c=>c[0]);});
    const ldc=[],el=[];
    LEAGUES.forEach(lg=>{ldc.push(...parLigue[lg.id].slice(0,4));el.push(...parLigue[lg.id].slice(4,8));});
    s.coupes={LDC:creerCoupe('Ligue des Champions',ldc,rng),EL:creerCoupe('Europa League',el,rng)};
    s.majCoupes=true;
  }
  (s.joueurs||[]).forEach(j=>{
    if(!j.attr)j.attr=calculerAttributs(j.nom,j.poste,j.note);
    if(!j.poste2)j.poste2=postesSecondaires(j.poste);
    if(j.sommeNotes==null)j.sommeNotes=0;
    if(j.nbNotes==null)j.nbNotes=0;
    if(j.motm==null)j.motm=0;
    if(j.cartons==null)j.cartons=0;
    if(j.rouges==null)j.rouges=0;
    if(j.prog==null)j.prog=0;
    if(j.dernierGain==null)j.dernierGain=0;
    if(j.reel==null)j.reel=VEDETTES.some(v=>v[0]===j.club&&v[1]===j.nom);
  });
  s.v=2;
  return s;
}
function coupeNationaleProgrammee(){

}

/* ---------- accès ---------- */
const J=id=>S.index[id];
const effectif=nom=>S.joueurs.filter(j=>j.club===nom);
const CL=nom=>S.clubs[nom];

function meilleurOnze(nom,formation){
  const f=FORMATIONS[formation];
  const dispo=effectif(nom).filter(j=>!j.blesse&&!j.suspendu).sort((a,b)=>b.note-a.note);
  const utilises=new Set(),onze=[];
  f.postes.forEach(poste=>{
    let best=null,bs=-1;
    dispo.forEach(j=>{
      if(utilises.has(j.id))return;
      const s=j.note*fitPoste(j,poste);
      if(s>bs){bs=s;best=j;}
    });
    if(best){utilises.add(best.id);onze.push(best);}else onze.push(null);
  });
  return onze;
}

/* ---------- création de saison ---------- */
/* Une journée = un match de championnat à 18h, précédé au besoin d'une coupe à 12h. */
const HEURE_COUPE='12:00', HEURE_LIGUE='18:00';
/* Le championnat le plus fourni fixe la durée de la saison : 20 clubs = 38 journées. */
function nbJournees(){
  const max=Math.max(...LEAGUES.map(l=>l.clubs.length));
  return (max-1)*2;
}
function construireJournees(rng){
  const total=nbJournees();
  const capsEuro=[4,8,12,16,20,24,28,32,36];      // au moins trois journées entre l'aller et le retour
  const rondesEuro=['T1','T2','H1','H2','Q1','Q2','S1','S2','F'];
  const capsNat={6:'P',10:'H',18:'Q',26:'S',34:'F'};
  const jours=[];
  let c=0;
  for(let i=1;i<=total;i++){
    let coupe=null;
    if(capsNat[i])coupe={t:'N',ronde:capsNat[i]};
    else if(capsEuro.includes(i)&&c<rondesEuro.length)coupe={t:'C',ronde:rondesEuro[c++]};
    jours.push({type:'L',idx:i,coupe});
  }
  return jours;
}

/* ---------- dates réelles de la saison ---------- */
const MOIS_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
/* Une journée par jour de calendrier : la saison tient en un peu plus d'un mois. */
function construireDates(journees,depart){
  const dates=[];
  const d=(typeof depart==='string')
    ? new Date(depart+'T00:00:00Z')                  // reprise le lendemain de la saison passée
    : new Date(Date.UTC(depart,7,8));                // toute première saison : 8 août
  journees.forEach((jr,i)=>{
    if(i>0)d.setUTCDate(d.getUTCDate()+1);
    dates.push(d.toISOString().slice(0,10));
  });
  return dates;
}
/* Deux journées de coupure séparent deux saisons : le temps de la remise
   à zéro des classements, du mercato et des qualifications européennes. */
const JOURS_INTERSAISON=2;
function repriseApres(iso){
  const d=new Date(iso+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+JOURS_INTERSAISON);
  return d.toISOString().slice(0,10);
}
function dateJournee(d){
  if(!S.dates||!S.dates[d])return '';
  const [a,m,j]=S.dates[d].split('-').map(Number);
  return j+' '+MOIS_FR[m-1];
}
function dateCourteJournee(d){
  if(!S.dates||!S.dates[d])return '';
  const [a,m,j]=S.dates[d].split('-').map(Number);
  return j+'/'+String(m).padStart(2,'0');
}
function anneeSaison(){
  return 2026+(S.saison-1);
}

/* ---------- coupes nationales : 18 clubs, 8 au tour préliminaire ---------- */
const NOMS_COUPE={ENG:'Coupe d\'Angleterre',ESP:'Coupe d\'Espagne',ITA:'Coupe d\'Italie',GER:'Coupe d\'Allemagne',FRA:'Coupe de France',POR:'Coupe du Portugal',NED:'Coupe des Pays-Bas',TUR:'Coupe de Turquie'};
function creerCoupesNationales(rng){
  const out={};
  LEAGUES.forEach(lg=>{
    const m=lg.clubs.map(c=>c[0]);
    for(let i=m.length-1;i>0;i--){const k=Math.floor(rng()*(i+1));[m[i],m[k]]=[m[k],m[i]];}
    // il faut 16 qualifiés pour les 8es : le surplus passe par un tour préliminaire
    const surplus=Math.max(0,m.length-16);
    const nbPrelim=surplus*2;
    const exempts=m.slice(0,m.length-nbPrelim);
    const reste=m.slice(m.length-nbPrelim);
    const prelim=[];
    for(let i=0;i<reste.length;i+=2)prelim.push([reste[i],reste[i+1]]);
    out[lg.id]={nom:NOMS_COUPE[lg.id],ligue:lg.id,exempts,tour:{P:prelim},resultats:[]};
  });
  return out;
}
function jouerRondeNationale(c,ronde,rng,monMatch){
  const res=[];
  const nomTour={P:'Tour préliminaire',H:'8es de finale',Q:'Quarts de finale',S:'Demi-finales',F:'Finale'}[ronde];
  const paires=c.tour[ronde]||[];
  const gagnants=[];
  paires.forEach(p=>{
    if(!p[0]||!p[1]){if(p[0]||p[1])gagnants.push(p[0]||p[1]);return;}
    const r=jouerRencontre(p[0],p[1],rng,'N');
    const ga=r.ga,gb=r.gb;
    let tab=null;
    if(ga===gb){
      let ta=ri(rng,3,5),tb=ri(rng,3,5);
      while(ta===tb)tb=ri(rng,3,6);
      tab=[ta,tb];
    }
    comptabiliserMatch(p[0],p[1],tab?tab[0]:ga,tab?tab[1]:gb,'N');
    res.push(detailler({jour:S.jour,comp:'N'+c.ligue,dom:p[0],ext:p[1],ga,gb,tab,jn:nomTour,heure:HEURE_COUPE},r));
    if(p[0]===S.monClub||p[1]===S.monClub)Object.assign(monMatch,{joue:true,dom:p[0],ext:p[1],...r,tab,comp:c.nom,label:nomTour});
    gagnants.push(tab?(tab[0]>tab[1]?p[0]:p[1]):(ga>gb?p[0]:p[1]));
  });
  const suite={P:'H',H:'Q',Q:'S',S:'F'}[ronde];
  if(suite){
    c.tour[suite]=paireDe(ronde==='P'?c.exempts.concat(gagnants):gagnants,rng);
    if(c.ligue===CL(S.monClub).ligue){
      const nomSuite={H:'8es de finale',Q:'quarts de finale',S:'demi-finales',F:'finale'}[suite];
      const mien=c.tour[suite].find(p=>p[0]===S.monClub||p[1]===S.monClub);
      if(mien)posterChat('TIRAGE AU SORT',`${c.nom} — ${nomSuite} : ${mien[0]} contre ${mien[1]}.`,false);
    }
  }else c.vainqueur=gagnants[0];
  return res;
}

const GRAINE_MONDE='MONDE-2026';
function nouvellePartie(monClub,graine,srv){
  const g=graine||String(Date.now()%100000);

    graine:g, monClub, jour:0, saison:1,

    journees:construireJournees(rng), dates:[],
    calendriers:{}, classements:{}, resultats:[], gazette:[],

    onze:[], banc:[],

    pseudo:(srv&&srv.pseudo)||'MANAGER', palmares:[], historique:[], chat:[],
    creneaux:{soin:null,boost:null,recup:null,entr:null}, bonus:[], chatLu:0,
    marche:[], finances:{initial:0,achats:0,ventes:0,primes:0},
    managers:{}, mondial:{}, mondialAutres:[], derniereActivite:Date.now(), inter:null,
    membres:(srv&&srv.membres)||{}, numServeur:(srv&&srv.num)||1
  };
  S.joueurs.forEach(j=>S.index[j.id]=j);
  const F=Object.keys(FORMATIONS),ST=Object.keys(STYLES);
  // les clubs gérés par l'ordinateur restent majoritairement mesurés :
  // les consignes extrêmes doivent rester l'exception
  const MENT_IA=['Neutre','Neutre','Neutre','Défensive','Défensive','Offensive','Offensive',
                 'Très défensive','Très offensive'];
  const PRES_IA=['Bloc médian','Bloc médian','Bloc médian','Bloc bas','Bloc haut'];
  const LARG_IA=['Normale','Normale','Normale','Étroite','Large'];
  Object.keys(S.clubs).forEach(n=>{
    S.tactiqueIA[n]={f:pick(rng,F),s:pick(rng,ST),
      m:pick(rng,MENT_IA),p:pick(rng,PRES_IA),l:pick(rng,LARG_IA)};
  });
  LEAGUES.forEach(lg=>{
    const noms=lg.clubs.map(c=>c[0]);
    S.calendriers[lg.id]=calendrierLigue(noms,rng);
    S.classements[lg.id]={};
    noms.forEach(n=>S.classements[lg.id][n]=nouvelleLigne());
  });
  S.dates=construireDates(S.journees,lendemainParis((srv&&srv.cree)||Date.now()));
  S.datesSuivantes=[repriseApres(S.dates[S.dates.length-1])];
  S.budget=Math.round(CL(monClub).budget*1.35);
  S.finances={initial:S.budget,achats:0,ventes:0,primes:0};
  S.recettes=0;S.journalFinance=[];
  definirObjectif();
  S.coupes=tirageCoupes(rng);
  S.coupesNat=creerCoupesNationales(rng);
  const o=meilleurOnze(monClub,S.formation);
  S.onze=o.map(j=>j?j.id:null);
  S.banc=effectif(monClub).filter(j=>!S.onze.includes(j.id)).sort((a,b)=>b.note-a.note).slice(0,5).map(j=>j.id);
  return S;
}

/* ---------- coupes européennes ---------- */
function tirageCoupes(rng){
  const parLigue={};
  LEAGUES.forEach(lg=>{
    parLigue[lg.id]=lg.clubs.slice().sort((a,b)=>b[5]-a[5]).map(c=>c[0]);
  });
  const ldc=[],el=[];
  LEAGUES.forEach(lg=>{
    const l=parLigue[lg.id];
    ldc.push(...l.slice(0,4));
    el.push(...l.slice(4,8));
  });
  return {LDC:creerCoupe('Ligue des Champions',ldc,rng),EL:creerCoupe('Europa League',el,rng)};
}
const TOURS_EURO=[['T','16es de finale'],['H','8es de finale'],['Q','Quarts de finale'],['S','Demi-finales'],['F','Finale']];
function creerCoupe(nom,equipes,rng){
  const m=equipes.slice();
  for(let i=m.length-1;i>0;i--){const k=Math.floor(rng()*(i+1));[m[i],m[k]]=[m[k],m[i]];}
  return {nom,format:'ko',engages:m.slice(),tour:{T:paireDe(m,rng)},resultats:[]};
}

/* ---------- classement des managers ----------
   Le barème dépend de la compétition : un point pris en Ligue des Champions
   vaut bien plus qu'en championnat. Les titres sont crédités en fin de saison.
   Le classement de la saison repart de zéro ; le classement mondial cumule. */
const POINTS_MANAGER={
  L:  {victoire:5,  nul:3,  defaite:1},    // championnat
  N:  {victoire:5,  nul:3,  defaite:1},    // coupe nationale
  EL: {victoire:25, nul:10, defaite:5},    // Europa League
  LDC:{victoire:50, nul:20, defaite:10},   // Ligue des Champions
  titres:{championnat:500, coupe:250, el:650, ldc:1000}
};

function nomManager(club){
  if(club===S.monClub)return S.pseudo;
  // un autre manager humain du serveur, sinon l'entraîneur du club
  const humains=S.membres||{};
  const pseudo=Object.keys(humains).find(p=>humains[p]===club);
  return pseudo||ENTRAINEURS[club]||'Entraîneur';
}
function estHumain(club){
  if(club===S.monClub)return true;
  const humains=S.membres||{};
  return Object.values(humains).includes(club);
}
/* Un manager s'identifie par son pseudo et le numéro de son serveur. */
function etiquetteManager(club){
  return nomManager(club)+'#'+(S.numServeur||1);
}
function pointsManager(club){
  S.managers=S.managers||{};
  return S.managers[club]||0;
}
function ajouterPointsManager(club,pts){
  S.managers=S.managers||{};
  S.mondial=S.mondial||{};
  S.managers[club]=(S.managers[club]||0)+pts;
  S.mondial[club]=(S.mondial[club]||0)+pts;   // le cumul de toutes les saisons
}
function comptabiliserMatch(dom,ext,ga,gb,competition){
  const b=POINTS_MANAGER[competition]||POINTS_MANAGER.L;
  if(ga>gb){ajouterPointsManager(dom,b.victoire);ajouterPointsManager(ext,b.defaite);}
  else if(gb>ga){ajouterPointsManager(ext,b.victoire);ajouterPointsManager(dom,b.defaite);}
  else{ajouterPointsManager(dom,b.nul);ajouterPointsManager(ext,b.nul);}
}
function comptabiliserTitres(){
  const tt=POINTS_MANAGER.titres;
  LEAGUES.forEach(lg=>{
    const t=trierClassement(S.classements[lg.id]);
    if(t[0])ajouterPointsManager(t[0].club,tt.championnat);
    const cn=S.coupesNat[lg.id];
    if(cn&&cn.vainqueur)ajouterPointsManager(cn.vainqueur,tt.coupe);
  });
  if(S.coupes.LDC.vainqueur)ajouterPointsManager(S.coupes.LDC.vainqueur,tt.ldc);
  if(S.coupes.EL.vainqueur)ajouterPointsManager(S.coupes.EL.vainqueur,tt.el);
}
function classementManagers(){
  S.managers=S.managers||{};
  return Object.keys(S.clubs).map(club=>({
    club,pts:S.managers[club]||0,manager:nomManager(club),
    etiquette:etiquetteManager(club),humain:club===S.monClub,joueur:estHumain(club)
  })).sort((a,b)=>b.pts-a.pts||a.club.localeCompare(b.club));
}

/* Classement mondial : cumul de toutes les saisons, jamais remis à zéro.
   Les managers rencontrés sur d'autres serveurs y figurent également. */
function classementMondial(){
  S.mondial=S.mondial||{};
  const local=Object.keys(S.clubs).map(club=>({
    club,pts:S.mondial[club]||0,manager:nomManager(club),
    etiquette:etiquetteManager(club),humain:club===S.monClub,joueur:estHumain(club),
    serveur:S.numServeur||1
  }));
  const ailleurs=(S.mondialAutres||[]).map(e=>({
    club:e.club,pts:e.pts,manager:e.manager,etiquette:e.manager+'#'+e.serveur,
    humain:false,joueur:true,serveur:e.serveur
  }));
  return local.concat(ailleurs).sort((a,b)=>b.pts-a.pts||a.club.localeCompare(b.club));
}

/* Les meilleurs clubs du serveur, tous gestionnaires confondus, prêts à être
   publiés au classement mondial. */
function sommetDuServeur(n){
  return classementMondial()
    .filter(r=>r.serveur===undefined||r.serveur===(S.numServeur||1))
    .slice(0,n||20)
    .map(r=>({club:r.club,manager:r.manager,humain:!!r.joueur,points:r.pts}));
}

/* À chaque fin de saison, on publie le total du manager humain pour que les
   autres serveurs de l'appareil puissent l'afficher. */
const CLE_MONDIAL='tno_mondial';
async function publierAuMondial(){
  const table=(await Store.get(CLE_MONDIAL))||{};
  const cle=S.pseudo+'#'+(S.numServeur||1);
  table[cle]={manager:S.pseudo,serveur:S.numServeur||1,club:S.monClub,
              pts:(S.mondial&&S.mondial[S.monClub])||0,maj:Date.now()};
  await Store.set(CLE_MONDIAL,table);
}
async function chargerMondialAutres(){
  const table=(await Store.get(CLE_MONDIAL))||{};
  const moi=S.pseudo+'#'+(S.numServeur||1);
  S.mondialAutres=Object.keys(table).filter(k=>k!==moi).map(k=>table[k]);
  return S.mondialAutres;
}

/* ============================================================
   COUPE INTER-SERVEUR
   Les quatre meilleurs managers de chaque serveur se retrouvent la saison
   suivante dans un tournoi à élimination directe, en matchs secs. Les
   rencontres sont placées sur des journées libres de toute autre coupe,
   et n'occasionnent ni blessure ni carton.
   ============================================================ */
const CLE_INTER='tno_inter';
const POINTS_INTER={victoire:100, titre:2000};
const TOURS_INTER=[[64,'64es de finale'],[32,'32es de finale'],[16,'8es de finale'],
                   [8,'Quarts de finale'],[4,'Demi-finales'],[2,'Finale']];

/* Deux serveurs ne se rencontrent que s'ils avancent au même rythme :
   on les range par tranche de dix jours écoulés depuis leur ouverture. */
function trancheTiming(cree){
  return Math.floor((Date.now()-(cree||Date.now()))/(10*24*60*60*1000));
}

/* Les quatre premiers du classement des managers du serveur. */
function qualifiesInterServeur(){
  return classementManagers().slice(0,4).map(r=>({
    club:r.club, manager:r.manager, etiquette:r.etiquette,
    serveur:S.serveur, num:S.numServeur||1, humain:r.joueur
  }));
}

/* On publie ses qualifiés pour que les autres serveurs puissent les affronter. */
async function publierQualifies(){
  const table=(await Store.get(CLE_INTER))||{};
  table[S.serveur]={num:S.numServeur||1, tranche:trancheTiming(S.serveurCree),
                    saison:S.saison, clubs:qualifiesInterServeur(), maj:Date.now()};
  await Store.set(CLE_INTER,table);
  S.interCache={maj:Date.now(),entrees:table};      // copie pour le prochain tirage
  return table;
}

/* Constitue le plateau : nos quatre qualifiés, ceux des serveurs de même
   tranche, puis un complément si le nombre reste sous seize. */
function plateauInterServeur(rng){
  // on s'appuie sur la copie rapportée du stockage à la saison précédente :
  // monter le tableau ne doit pas dépendre d'une lecture asynchrone, sinon
  // les premiers tours passent avant que le tirage existe
  const table=(S.interCache&&S.interCache.entrees)||{};
  const maTranche=trancheTiming(S.serveurCree);
  let equipes=qualifiesInterServeur();
  Object.keys(table).forEach(id=>{
    if(id===S.serveur)return;
    const e=table[id];
    if(e.tranche!==maTranche)return;                 // rythme de saison différent
    (e.clubs||[]).forEach(c=>{
      if(!equipes.some(x=>x.club===c.club&&x.num===c.num))equipes.push(c);
    });
  });
  // complément : des clubs forts d'autres championnats, sous une bannière neutre
  if(equipes.length<16){
    const pris=new Set(equipes.map(e=>e.club));
    const forts=Object.keys(S.clubs)
      .filter(n=>!pris.has(n))
      .map(n=>({n,f:CL(n).force}))
      .sort((a,b)=>b.f-a.f);
    let i=0;
    while(equipes.length<16&&i<forts.length){
      const n=forts[i++].n;
      equipes.push({club:n, manager:ENTRAINEURS[n]||'Entraîneur',
                    etiquette:(ENTRAINEURS[n]||'Entraîneur')+'#'+(S.numServeur||1),
                    serveur:S.serveur, num:S.numServeur||1, humain:false, invite:true});
    }
  }
  // on ramène à une puissance de deux, entre 16 et 64
  let taille=16;
  while(taille*2<=Math.min(64,equipes.length))taille*=2;
  for(let i=equipes.length-1;i>0;i--){const k=Math.floor(rng()*(i+1));[equipes[i],equipes[k]]=[equipes[k],equipes[i]];}
  return equipes.slice(0,taille);
}

/* Réserve une journée libre par tour : jamais le même jour qu'une autre coupe. */
function journeesLibres(nbTours){
  const libres=[];
  for(let d=0;d<S.journees.length;d++)if(!S.journees[d].coupe)libres.push(d);
  if(libres.length<nbTours)return null;
  const pas=Math.floor(libres.length/nbTours);
  const choisies=[];
  for(let i=0;i<nbTours;i++)choisies.push(libres[Math.min(libres.length-1,i*pas+Math.floor(pas/2))]);
  return choisies;
}

function ouvrirInterServeur(rng){
  const equipes=plateauInterServeur(rng);
  const depart=TOURS_INTER.findIndex(t=>t[0]===equipes.length);
  if(depart<0)return null;
  const tours=TOURS_INTER.slice(depart);
  const jours=journeesLibres(tours.length);
  if(!jours)return null;
  const paires=[];
  for(let i=0;i<equipes.length;i+=2)paires.push([equipes[i],equipes[i+1]]);
  S.inter={
    taille:equipes.length, equipes, tours:tours.map(t=>t[1]), jours,
    tour:0, paires, resultats:[], vainqueur:null,
    points:{}                       // points marqués dans le tournoi, par club
  };
  return S.inter;
}

function pointsInter(club){
  return (S.inter&&S.inter.points&&S.inter.points[club])||0;
}
function ajouterPointsInter(club,pts){
  if(!S.inter)return;
  S.inter.points[club]=(S.inter.points[club]||0)+pts;
  // seuls les clubs de ce serveur ont un compte au classement mondial
  if(S.clubs[club])ajouterPointsManager(club,0),S.mondial[club]=(S.mondial[club]||0)+pts;
}

/* Un tour de la coupe : matchs secs, sans blessure ni carton. */
function jouerTourInterServeur(rng,monMatch){
  const it=S.inter;
  if(!it||it.vainqueur)return [];
  const nomTour=it.tours[it.tour];
  const gagnants=[], res=[];
  it.paires.forEach(p=>{
    const [a,b]=p;
    const r=jouerRencontre(a.club,b.club,rng,'I',null,true);   // sans incident
    let ga=r.ga, gb=r.gb, tab=null;
    if(ga===gb){
      let ta=ri(rng,3,5), tb=ri(rng,3,5);
      while(ta===tb)tb=ri(rng,3,6);
      tab=[ta,tb];
    }
    const vainqueur=tab?(tab[0]>tab[1]?a:b):(ga>gb?a:b);
    ajouterPointsInter(vainqueur.club,POINTS_INTER.victoire);
    res.push({jour:S.jour,comp:'INTER',dom:a.club,ext:b.club,ga,gb,tab,jn:nomTour,
              heure:HEURE_COUPE,domNum:a.num,extNum:b.num});
    if(a.club===S.monClub||b.club===S.monClub)
      Object.assign(monMatch,{joue:true,dom:a.club,ext:b.club,...r,ga,gb,tab,
                              comp:'Coupe inter-serveur',label:nomTour,heure:HEURE_COUPE});
    gagnants.push(vainqueur);
  });
  it.resultats.push(...res);
  it.tour++;
  if(gagnants.length===1){
    it.vainqueur=gagnants[0];
    ajouterPointsInter(it.vainqueur.club,POINTS_INTER.titre);
    posterChat('COUPE INTER-SERVEUR',
      `${it.vainqueur.etiquette} remporte la coupe inter-serveur avec ${it.vainqueur.club}.`,false);
  }else{
    it.paires=[];
    for(let i=0;i<gagnants.length;i+=2)it.paires.push([gagnants[i],gagnants[i+1]]);
    const suivant=it.tours[it.tour];
    const mien=it.paires.find(p=>p[0].club===S.monClub||p[1].club===S.monClub);
    if(mien)posterChat('COUPE INTER-SERVEUR',
      `${suivant} : ${mien[0].etiquette} contre ${mien[1].etiquette}.`,false);
  }
  return res;
}

/* ---------- détail conservé pour la consultation ---------- */
function detailler(base,r){
  base.bA=(r.butsA||[]).map(e=>[e.m,e.qui||'']);
  base.bB=(r.butsB||[]).map(e=>[e.m,e.qui||'']);
  if(base.dom===S.monClub||base.ext===S.monClub){
    base.nA=(r.onzeA||[]).map((j,i)=>j?[j.nom,(r.notesA||[])[i]??6,j.id]:null).filter(Boolean);
    base.nB=(r.onzeB||[]).map((j,i)=>j?[j.nom,(r.notesB||[])[i]??6,j.id]:null).filter(Boolean);
    base.hdm=r.hdm||null;
    base.cartons=r.cartons||[];
    base.rouges=r.rouges||[];
    base.blessures=r.blessures||[];
    base.poss=r.possA;
  }
  return base;
}

/* ---------- avancer d'une journée ---------- */
function jouerJournee(){
  const jr=S.journees[S.jour];
  if(!jr)return null;
  const rng=mulberry(hashStr(S.graine+'-'+S.jour));
  const mesMatchs=[];

  // 12h00 : coupe nationale ou coupe européenne
  if(jr.coupe){
    if(jr.coupe.t==='N'){
      LEAGUES.forEach(lg=>{
        const c=S.coupesNat[lg.id];
        const m={joue:false};
        const r=jouerRondeNationale(c,jr.coupe.ronde,rng,m);
        if(r)S.resultats.push(...r);
        if(m.joue)mesMatchs.push({...m,heure:HEURE_COUPE});
      });
    }else{
      ['LDC','EL'].forEach(k=>{
        const c=S.coupes[k];
        const m={joue:false};
        const r=jouerRondeCoupe(c,jr.coupe.ronde,rng,k,m);
        if(r)S.resultats.push(...r);
        if(m.joue)mesMatchs.push({...m,heure:HEURE_COUPE});
      });
    }
  }

  // 12h00 également : coupe inter-serveur, sur une journée sans autre coupe
  if(S.inter&&!S.inter.vainqueur&&(S.inter.jours||[]).includes(S.jour)&&!jr.coupe){
    const m={joue:false};
    const r=jouerTourInterServeur(rng,m);
    if(r&&r.length)S.resultats.push(...r);
    if(m.joue)mesMatchs.push({...m,heure:HEURE_COUPE});
  }

  // 18h00 : championnat
  LEAGUES.forEach(lg=>{
    const matchs=S.calendriers[lg.id][jr.idx-1]||[];
    matchs.forEach(([dom,ext])=>{
      const r=jouerRencontre(dom,ext,rng,'L',lg.id);
      appliquer(S.classements[lg.id],dom,ext,r.ga,r.gb);
      comptabiliserMatch(dom,ext,r.ga,r.gb,'L');
      S.resultats.push(detailler({jour:S.jour,comp:lg.id,dom,ext,ga:r.ga,gb:r.gb,jn:jr.idx,heure:HEURE_LIGUE},r));
      if(dom===S.monClub||ext===S.monClub)
        mesMatchs.push({joue:true,dom,ext,...r,comp:lg.nom,label:'Journée #'+jr.idx,heure:HEURE_LIGUE});
    });
  });

  S.jour++;
  mesMatchs.forEach(m=>encaisser(m,jr));
  finDeJournee(rng);
  if(mesMatchs.length)bavardageIA(rng,mesMatchs[mesMatchs.length-1]);
  sauver();                       // la journée écoulée est immédiatement enregistrée
  return mesMatchs.length?{joue:true,matchs:mesMatchs,...mesMatchs[0]}:{joue:false,matchs:[]};
}

function consignesIA(club){
  const t=(S.tactiqueIA||{})[club]||{};
  return {mentalite:t.m||'Neutre',pression:t.p||'Bloc médian',largeur:t.l||'Normale'};
}
function jouerRencontre(dom,ext,rng,comp,lid,sansIncident){
  const estMoi=d=>d===S.monClub;
  const fa=estMoi(dom)?S.formation:S.tactiqueIA[dom].f;
  const sa=estMoi(dom)?S.style:S.tactiqueIA[dom].s;
  const fb=estMoi(ext)?S.formation:S.tactiqueIA[ext].f;
  const sb=estMoi(ext)?S.style:S.tactiqueIA[ext].s;
  const oa=estMoi(dom)?S.onze.map(id=>id?J(id):null):meilleurOnze(dom,fa);
  const ob=estMoi(ext)?S.onze.map(id=>id?J(id):null):meilleurOnze(ext,fb);
  const ca=estMoi(dom)?S.consignes:consignesIA(dom);
  const cb=estMoi(ext)?S.consignes:consignesIA(ext);
  const A=forceEquipe(oa,fa,sa,ca),B=forceEquipe(ob,fb,sb,cb);
  const r=simulerMatch(A,B,rng);
  const faits=attribuerStats(oa,ob,r,rng,sansIncident);
  const issue=r.ga>r.gb?1:r.ga<r.gb?-1:0;
  const notesA=noterJoueurs(oa,r.ga,r.gb,issue,rng);
  const notesB=noterJoueurs(ob,r.gb,r.ga,-issue,rng);
  oa.forEach((j,i)=>{if(j&&notesA[i]!=null){j.sommeNotes+=notesA[i];j.nbNotes++;}});
  ob.forEach((j,i)=>{if(j&&notesB[i]!=null){j.sommeNotes+=notesB[i];j.nbNotes++;}});
  // homme du match : meilleure note, priorité au camp vainqueur
  let hdm=null,hn=-1;
  const scan=(onze,notes,bonus)=>onze.forEach((j,i)=>{
    if(!j||notes[i]==null)return;
    const v=notes[i]+bonus;
    if(v>hn){hn=v;hdm=j.id;}
  });
  scan(oa,notesA,issue===1?0.4:0);scan(ob,notesB,issue===-1?0.4:0);
  if(hdm&&J(hdm))J(hdm).motm++;
  return {...r,onzeA:oa,onzeB:ob,formA:fa,formB:fb,notesA,notesB,
    cartons:faits.cartons,rouges:faits.rouges,blessures:faits.blessures,hdm,
    butsA:r.evts.filter(e=>e.eq==='A'),butsB:r.evts.filter(e=>e.eq==='B')};
}

function attribuerStats(oa,ob,r,rng,sansIncident){
  const cartons=[],rouges=[],blessures=[];
  const marqueurs=(onze,n,eq)=>{
    const cand=onze.filter(j=>j&&j.poste!=='G');
    for(let i=0;i<n;i++){
      const poids=cand.map(j=>{
        const l=(POSTES.find(p=>p[0]===j.poste)||['','',2])[2];
        const base=l===3?4.0:l===2?2.5:1.0;
        const tir=(j.attr&&j.attr.tir?j.attr.tir:j.note)/72;
        return base*tir;
      });
      const tot=poids.reduce((a,b)=>a+b,0);let x=rng()*tot,k=0;
      while(x>poids[k]&&k<poids.length-1){x-=poids[k];k++;}
      if(cand[k]){
        cand[k].buts++;
        const p=cand[Math.floor(rng()*cand.length)];
        if(p&&p!==cand[k])p.passes++;
        const e=r.evts.find(x=>x.eq===eq&&!x.qui);
        if(e){e.qui=cand[k].nom;e.passeur=(p&&p!==cand[k])?p.nom:null;}
      }
    }
  };
  marqueurs(oa,r.ga,'A');marqueurs(ob,r.gb,'B');
  [...oa,...ob].forEach(j=>{
    if(!j)return;
    j.matchs++;
    j.forme=Math.max(50,Math.min(100,j.forme+ri(rng,-6,5)));
    if(j.club===S.monClub&&typeof progresser==='function')progresser(j,0.02*facteurAge(j),rng);

    // la coupe inter-serveur se joue sans blessure ni carton
    if(sansIncident)return;
    // blessure : plus fréquente quand la forme est basse
    const risque=0.010+Math.max(0,(75-j.forme))*0.00035;
    if(rng()<risque){
      j.blesse=ri(rng,1,9);
      blessures.push(j.id);
      if(j.club===S.monClub)posterChat('INFIRMERIE',`${j.nom} sort blessé — ${j.blesse} journées d'absence.`,false);
    }

    // cartons : le poste et le style défensif pèsent
    const ligne=(POSTES.find(p=>p[0]===j.poste)||['','',2])[2];
    const facteur=ligne===1?1.35:ligne===2?1.15:ligne===0?0.35:0.75;
    if(rng()<0.0035*facteur){                    // carton rouge direct ou deux avertissements
      j.rouges=(j.rouges||0)+1;
      j.suspendu=ri(rng,1,3);
      rouges.push(j.id);
      if(j.club===S.monClub)posterChat('DISCIPLINE',`${j.nom} est expulsé — ${j.suspendu} match(s) de suspension.`,false);
    }else if(rng()<0.12*facteur){
      j.cartons++;cartons.push(j.id);
      if(j.cartons%4===0)j.suspendu=1;
    }
  });
  return {cartons,rouges,blessures};
}

function jouerRondeCoupe(c,ronde,rng,cle,monMatch){
  const res=[];
  {
    const lettre=ronde[0],leg=ronde[1];
    const nomTour=(TOURS_EURO.find(x=>x[0]===lettre)||['','Tour'])[1];
    const paires=c.tour[lettre]||[];
    const gagnants=[];
    paires.forEach(p=>{
      const inv=(leg==='2');
      const dom=inv?p[1]:p[0],ext=inv?p[0]:p[1];
      const r=jouerRencontre(dom,ext,rng,'C');
      comptabiliserMatch(dom,ext,r.ga,r.gb,cle);
      res.push(detailler({jour:S.jour,comp:cle,dom,ext,ga:r.ga,gb:r.gb,heure:HEURE_COUPE,
        jn:nomTour+(lettre!=='F'?' · match '+leg:'')},r));
      if(dom===S.monClub||ext===S.monClub)Object.assign(monMatch,{joue:true,dom,ext,...r,comp:c.nom,
        label:nomTour+(lettre!=='F'?' · match '+leg:'')});
      p.score=p.score||[0,0];
      if(inv){p.score[1]+=r.ga;p.score[0]+=r.gb;}else{p.score[0]+=r.ga;p.score[1]+=r.gb;}
      if(leg==='2'||lettre==='F'){
        let g;
        if(p.score[0]>p.score[1])g=p[0];else if(p.score[1]>p.score[0])g=p[1];else g=rng()<0.5?p[0]:p[1];
        gagnants.push(g);
      }
    });
    if(gagnants.length){
      const suite={T:'H',H:'Q',Q:'S'}[lettre];
      if(suite){
        c.tour[suite]=paireDe(gagnants,rng);
        const nomSuite={H:'8es de finale',Q:'quarts de finale',S:'demi-finales'}[suite];
        const mien=c.tour[suite].find(p=>p[0]===S.monClub||p[1]===S.monClub);
        if(mien)posterChat('TIRAGE AU SORT',
          `${c.nom} — ${nomSuite} : ${mien[0]} contre ${mien[1]}.`,false);
      }else if(lettre==='S'){
        c.tour.F=paireDe(gagnants,rng);
        if(c.tour.F[0].includes(S.monClub))
          posterChat('TIRAGE AU SORT',`${c.nom} — finale : ${c.tour.F[0][0]} contre ${c.tour.F[0][1]}.`,false);
      }else c.vainqueur=gagnants[0];
    }
  }
  return res;
}
function paireDe(l,rng){
  const m=l.slice();
  for(let i=m.length-1;i>0;i--){const k=Math.floor(rng()*(i+1));[m[i],m[k]]=[m[k],m[i]];}
  const out=[];for(let i=0;i<m.length;i+=2)out.push([m[i],m[i+1]]);
  return out;
}

/* ---------- fin de journée : blessures, transferts IA ---------- */
function finDeJournee(rng){
  S.joueurs.forEach(j=>{
    if(j.blesse>0)j.blesse--;
    if(j.suspendu>0)j.suspendu--;
    j.valeur=valeurMarchande(j.note,j.age);
  });
  avancerCreneaux(rng);
  avancerBonus();
  ajusterTactiquesIA(rng);
  animerMarche(rng);
  // l'IA vient chercher tes joueurs
  const mes=effectif(S.monClub).sort((a,b)=>b.note-a.note);
  if(rng()<0.55&&S.offresRecues.length<8){
    const cible=mes[ri(rng,0,Math.min(mes.length-1,17))];
    if(cible){
      const acheteurs=Object.keys(S.clubs).filter(n=>n!==S.monClub&&CL(n).force>=cible.note-9);
      const ach=pick(rng,acheteurs);
      const montant=Math.round(cible.valeur*(0.85+rng()*0.75)/1e5)*1e5;
      S.offresRecues.push({id:'o'+Date.now()+Math.floor(rng()*1000),joueur:cible.id,club:ach,montant,jour:S.jour});
    }
  }
  // réponses aux offres envoyées
  S.offresEnvoyees=S.offresEnvoyees.filter(o=>{
    if(S.jour-o.jour<1)return true;
    const j=J(o.joueur);
    if(!j)return false;
    const seuil=j.valeur*(1.05+(j.note-60)/100);
    // chaque refus doit dire ce qui a bloqué, sinon le manager croit que
    // les clubs adverses refusent tout par principe
    if(tailleEffectif(S.monClub)>=MAX_EFFECTIF){
      S.gazette.unshift({jour:S.jour,txt:
        `Transfert de ${j.nom} impossible : ton effectif est au complet (${MAX_EFFECTIF} joueurs).`});
      posterChat('TRANSFERTS',
        `Effectif au complet : libère une place avant de recruter ${j.nom}.`,false);
      return false;
    }
    if(S.budget<o.montant){
      S.gazette.unshift({jour:S.jour,txt:
        `Transfert de ${j.nom} impossible : budget insuffisant (${fmtM(o.montant)} demandés).`});
      return false;
    }
    if(o.montant>=seuil){
      const vendeur=j.club;
      if(conclureTransfert(j,vendeur,S.monClub,o.montant,'offre')){
        S.banc.length<7&&S.banc.push(j.id);
      }else{
        // le club vendeur ne peut pas se séparer de ce joueur
        S.gazette.unshift({jour:S.jour,txt:`${vendeur} refuse de libérer ${j.nom} : son effectif ne le permet pas.`});
        posterChat('TRANSFERTS',`${vendeur} garde ${j.nom} — effectif trop juste à son poste.`,false);
      }
    }else{
      S.gazette.unshift({jour:S.jour,txt:
        `Offre refusée pour ${j.nom} — ${j.club} en attend au moins ${fmtM(Math.ceil(seuil))}.`});
    }
    return false;
  });
  // nettoyage des offres reçues trop vieilles
  S.offresRecues=S.offresRecues.filter(o=>S.jour-o.jour<6);
}

/* ============================================================
   MARCHÉ DES TRANSFERTS
   Enchères, offres directes et transactions entre clubs gérés par l'ordinateur.
   ============================================================ */
const DUREE_ENCHERE=3;          // journées avant l'adjudication
const MIN_EFFECTIF=18, MAX_EFFECTIF=30;

function tailleEffectif(club){return S.joueurs.filter(j=>j.club===club).length;}
function estEnVente(jid){return (S.marche||[]).some(l=>l.joueur===jid);}
function annonce(jid){return (S.marche||[]).find(l=>l.joueur===jid);}

/* ---- estimation d'un club pour un joueur ---- */
function besoinAuPoste(club,poste){
  const n=S.joueurs.filter(j=>j.club===club&&j.poste===poste).length;
  return n<=1?1.35:n===2?1.10:n===3?0.92:0.75;
}
function estimation(club,j,rng){
  const c=CL(club);
  if(!c)return 0;
  const attrait=1+(j.note-c.force)/45;                 // un club vise un peu au-dessus de son niveau
  const jeunesse=j.age<=23?1.15:j.age<=29?1:0.78;
  const alea=0.88+(rng?rng():0.5)*0.3;
  return Math.round(j.valeur*attrait*jeunesse*besoinAuPoste(club,j.poste)*alea);
}

/* ---- mise en vente ---- */
function mettreAuxEncheres(jid,prix){
  const j=J(jid);
  if(!j||j.club!==S.monClub)return 'Ce joueur n\'est pas dans ton effectif.';
  if(estEnVente(jid))return 'Ce joueur est déjà sur le marché.';
  if(tailleEffectif(S.monClub)<=MIN_EFFECTIF)return 'Effectif trop court pour vendre.';
  if(!prix||prix<1e5)return 'Prix de départ trop bas.';
  S.marche=S.marche||[];
  S.marche.push({id:'m'+Date.now().toString(36)+Math.floor(Math.random()*1e4),
    joueur:jid,vendeur:S.monClub,prix:Math.round(prix),offre:null,cree:S.jour,fin:S.jour+DUREE_ENCHERE});
  posterChat('MARCHÉ',`${j.nom} est mis aux enchères par ${S.monClub} — prix de départ ${fmtM(prix)}.`,false);
  sauver();return null;
}
function retirerDuMarche(lid){
  const l=(S.marche||[]).find(x=>x.id===lid);
  if(!l||l.vendeur!==S.monClub)return 'Annonce introuvable.';
  if(l.offre)return 'Une offre est déjà posée, tu ne peux plus retirer.';
  S.marche=S.marche.filter(x=>x.id!==lid);
  sauver();return null;
}
function encherir(lid,montant){
  const l=(S.marche||[]).find(x=>x.id===lid);
  if(!l)return 'Annonce introuvable.';
  if(l.vendeur===S.monClub)return 'Tu ne peux pas enchérir sur ton propre joueur.';
  const plancher=l.offre?Math.round(l.offre.montant*1.05):l.prix;
  if(montant<plancher)return 'Il faut au moins '+fmtM(plancher)+'.';
  if(montant>S.budget)return 'Budget insuffisant.';
  if(tailleEffectif(S.monClub)>=MAX_EFFECTIF)return 'Effectif complet.';
  l.offre={club:S.monClub,montant:Math.round(montant),jour:S.jour};
  sauver();return null;
}

/* ---- vie du marché, une fois par journée ---- */
function animerMarche(rng){
  S.marche=S.marche||[];
  // 1. les clubs gérés par l'ordinateur étudient les annonces (jamais le jour même)
  S.marche.forEach(l=>{
    if(S.jour<=l.cree)return;
    const j=J(l.joueur);
    if(!j){l.fin=-1;return;}
    const candidats=Object.keys(S.clubs).filter(n=>
      n!==l.vendeur&&n!==S.monClub&&tailleEffectif(n)<MAX_EFFECTIF&&CL(n).force>=j.note-12);
    const nb=ri(rng,0,3);
    for(let i=0;i<nb;i++){
      const club=pick(rng,candidats);
      if(!club)break;
      const plancher=l.offre?Math.round(l.offre.montant*1.05):l.prix;
      const max=Math.min(estimation(club,j,rng),CL(club).budget);
      if(max>=plancher)l.offre={club,montant:Math.round(plancher*(1+rng()*0.06)),jour:S.jour};
    }
  });
  // 2. adjudications
  const restantes=[];
  S.marche.forEach(l=>{
    if(S.jour<l.fin&&l.fin>=0){restantes.push(l);return;}
    const j=J(l.joueur);
    if(!j)return;
    if(l.offre){
      const conclu=conclureTransfert(j,l.vendeur,l.offre.club,l.offre.montant,'enchères');
      if(!conclu&&l.vendeur===S.monClub)
        posterChat('MARCHÉ',`La vente de ${j.nom} n'a pas pu aboutir : effectif trop court.`,false);
    }else if(l.vendeur===S.monClub){
      posterChat('MARCHÉ',`Aucune offre pour ${j.nom}, il reste à ${S.monClub}.`,false);
    }
  });
  S.marche=restantes;

  // 3. transferts directs de gré à gré : un club qui manque à un poste va
  //    chercher un joueur en surnombre ailleurs, sans passer par les enchères
  const nbDirects=ri(rng,1,3);
  for(let k=0;k<nbDirects;k++){
    const acheteurs=Object.keys(S.clubs).filter(n=>
      n!==S.monClub&&tailleEffectif(n)<MAX_EFFECTIF-1&&CL(n).budget>2e6);
    const acheteur=pick(rng,acheteurs);
    if(!acheteur)continue;
    // le poste le plus dégarni de l'effectif
    const manques=POSTES_CLES.concat(['DD','DG','MDC','MOC','AD','AG'])
      .map(p=>({p,n:S.joueurs.filter(x=>x.club===acheteur&&x.poste===p).length}))
      .sort((a,b)=>a.n-b.n);
    const poste=manques[0]&&manques[0].n<=2?manques[0].p:pick(rng,POSTES).at(0);
    const cibles=S.joueurs.filter(x=>
      x.club!==acheteur&&x.club!==S.monClub&&x.poste===poste&&!estEnVente(x.id)
      &&tailleEffectif(x.club)>MIN_EFFECTIF+1
      &&x.note<=CL(acheteur).force+4);
    const cible=pick(rng,cibles);
    if(!cible)continue;
    const montant=estimation(acheteur,cible,rng);
    if(montant<=CL(acheteur).budget&&montant>=cible.valeur*0.9)
      conclureTransfert(cible,cible.club,acheteur,montant,'accord direct');
  }

  // 4. coups d'éclat : un gros club s'offre une vedette d'un club plus modeste
  if(rng()<0.22){
    const riches=Object.keys(S.clubs).filter(n=>
      n!==S.monClub&&CL(n).budget>25e6&&tailleEffectif(n)<MAX_EFFECTIF-1);
    const acheteur=pick(rng,riches);
    if(acheteur){
      const vedettes=S.joueurs.filter(x=>
        x.club!==acheteur&&x.club!==S.monClub&&x.note>=CL(acheteur).force-2
        &&CL(x.club).force<CL(acheteur).force-3
        &&tailleEffectif(x.club)>MIN_EFFECTIF+1&&!estEnVente(x.id));
      const cible=pick(rng,vedettes);
      if(cible){
        const montant=Math.round(cible.valeur*(1.5+rng()*0.6));
        if(montant<=CL(acheteur).budget&&
           conclureTransfert(cible,cible.club,acheteur,montant,'coup d\'éclat'))
          posterChat('MERCATO',
            `${cible.nom} quitte ${cible.club} pour ${acheteur} — ${fmtM(montant)}.`,false);
      }
    }
  }

  // 5. les clubs de l'ordinateur mettent des joueurs en vente
  const nbAnnonces=ri(rng,1,3);
  for(let k=0;k<nbAnnonces;k++){
    const vendeurs=Object.keys(S.clubs).filter(n=>n!==S.monClub&&tailleEffectif(n)>MIN_EFFECTIF+2);
    const club=pick(rng,vendeurs);
    if(!club)continue;
    const dispo=S.joueurs.filter(x=>x.club===club&&!estEnVente(x.id));
    if(!dispo.length)continue;
    // un club vend plutôt ses joueurs de complément, parfois une vedette
    const surplus=rng()<0.82
      ? dispo.slice().sort((a,b)=>a.note-b.note).slice(0,8)
      : dispo.slice().sort((a,b)=>b.note-a.note).slice(0,5);
    const j=pick(rng,surplus);
    if(j)S.marche.push({id:'m'+S.jour+'-'+k+'-'+Math.floor(rng()*1e6),joueur:j.id,vendeur:club,
      prix:Math.round(j.valeur*(0.85+rng()*0.35)),offre:null,cree:S.jour,fin:S.jour+DUREE_ENCHERE});
  }
  // 4. transferts directs entre clubs de l'ordinateur
  const nbEchanges=ri(rng,0,2);
  for(let i=0;i<nbEchanges;i++){
    const acheteurs=Object.keys(S.clubs).filter(n=>n!==S.monClub&&tailleEffectif(n)<MAX_EFFECTIF);
    const acheteur=pick(rng,acheteurs);
    if(!acheteur)continue;
    const cibles=S.joueurs.filter(x=>x.club!==acheteur&&x.club!==S.monClub&&!estEnVente(x.id)
      &&tailleEffectif(x.club)>MIN_EFFECTIF&&x.note>=CL(acheteur).force-8&&x.note<=CL(acheteur).force+6);
    const j=cibles.length?cibles[Math.floor(rng()*cibles.length)]:null;
    if(!j)continue;
    const prix=estimation(acheteur,j,rng);
    if(prix<=CL(acheteur).budget&&prix>=j.valeur*0.95){
      conclureTransfert(j,j.club,acheteur,prix,'direct');
    }
  }
}

/* Un club ne doit jamais se retrouver sans titulaire possible à un poste clé. */
const POSTES_CLES=['G','DC','MC','BU'];
function derniersAuPoste(club,poste){
  return S.joueurs.filter(j=>j.club===club&&j.poste===poste).length;
}
function conclureTransfert(j,vendeur,acheteur,montant,origine){
  montant=Math.round(montant);
  // garde-fou commun à toutes les voies de transfert : un club ne peut pas
  // descendre sous l'effectif minimal, ni dépasser l'effectif maximal
  if(tailleEffectif(vendeur)<=MIN_EFFECTIF)return false;
  if(tailleEffectif(acheteur)>=MAX_EFFECTIF)return false;
  // ni se démunir de son dernier joueur à un poste clé
  if(POSTES_CLES.includes(j.poste)&&derniersAuPoste(vendeur,j.poste)<=1)return false;
  if(acheteur===S.monClub){
    if(S.budget<montant)return false;
    S.budget-=montant;
    S.finances.achats+=montant;
  }else{
    CL(acheteur).budget=Math.max(0,CL(acheteur).budget-montant);
  }
  if(vendeur===S.monClub){
    S.budget+=montant;
    S.finances.ventes+=montant;
    S.onze=S.onze.map(id=>id===j.id?null:id);
    S.banc=S.banc.filter(id=>id!==j.id);
  }else{
    CL(vendeur).budget+=montant;
  }
  j.club=acheteur;
  S.marche=(S.marche||[]).filter(l=>l.joueur!==j.id);
  const concerne=(vendeur===S.monClub||acheteur===S.monClub);
  if(concerne||j.note>=84){
    posterChat('TRANSFERTS',`${j.nom} : ${vendeur} → ${acheteur} pour ${fmtM(montant)}${origine==='enchères'?' (enchères)':''}`,false);
    S.gazette.unshift({jour:S.jour,txt:`${j.nom} passe de ${vendeur} à ${acheteur} pour ${fmtM(montant)}.`});
  }
  if(vendeur===S.monClub)completerOnze();
  return true;
}

/* ---------- actions du joueur ---------- */
function accepterOffre(oid){
  const o=S.offresRecues.find(x=>x.id===oid);if(!o)return 'Offre introuvable.';
  if(tailleEffectif(S.monClub)<=MIN_EFFECTIF)return 'Effectif trop court pour vendre.';
  const j=J(o.joueur);
  conclureTransfert(j,S.monClub,o.club,o.montant,'offre');
  S.offresRecues=S.offresRecues.filter(x=>x.id!==oid);
  return null;
}
function refuserOffre(oid){
  const o=S.offresRecues.find(x=>x.id===oid);if(!o)return;
  S.offresRecues=S.offresRecues.filter(x=>x.id!==oid);
}
function envoyerOffre(jid,montant){
  const j=J(jid);if(!j)return 'Joueur introuvable.';
  if(j.club===S.monClub)return 'Ce joueur est déjà chez toi.';
  if(montant>S.budget)return 'Budget insuffisant.';
  if(S.offresEnvoyees.some(o=>o.joueur===jid))return 'Offre déjà en cours pour ce joueur.';
  S.offresEnvoyees.push({id:'e'+Date.now(),joueur:jid,montant,jour:S.jour});
  return null;
}
function reserve(){
  return effectif(S.monClub).filter(j=>!S.onze.includes(j.id))
    .sort((a,b)=>(a.blesse||a.suspendu?1:0)-(b.blesse||b.suspendu?1:0)||b.note-a.note);
}
function echanger(a,b){
  const idDe=x=>x.type==='onze'?S.onze[x.slot]:x.id;
  const ia=idDe(a), ib=idDe(b);
  if(a.type==='onze'&&b.type==='onze'){
    S.onze[a.slot]=ib;S.onze[b.slot]=ia;
  }else if(a.type==='onze'){
    S.onze[a.slot]=ib;
  }else if(b.type==='onze'){
    S.onze[b.slot]=ia;
  }else return; // deux remplaçants : rien à faire
  S.banc=reserve().slice(0,7).map(j=>j.id);
  sauver();
}
function onzeAutomatique(){
  S.onze=meilleurOnze(S.monClub,S.formation).map(j=>j?j.id:null);
  S.banc=reserve().slice(0,7).map(j=>j.id);
  sel=null;sauver();
}

function completerOnze(){
  const f=FORMATIONS[S.formation];
  const dispo=effectif(S.monClub).filter(j=>!j.blesse&&!j.suspendu);
  const pris=new Set(S.onze.filter(Boolean));
  S.onze=f.postes.map((poste,i)=>{
    const cur=S.onze[i];
    if(cur&&J(cur)&&J(cur).club===S.monClub&&!J(cur).blesse&&!J(cur).suspendu)return cur;
    let best=null,bs=-1;
    dispo.forEach(j=>{if(pris.has(j.id))return;const s=j.note*fitPoste(j,poste);if(s>bs){bs=s;best=j;}});
    if(best){pris.add(best.id);return best.id;}
    return null;
  });
  S.banc=effectif(S.monClub).filter(j=>!S.onze.includes(j.id)&&!j.blesse).sort((a,b)=>b.note-a.note).slice(0,7).map(j=>j.id);
}

/* ---------- photos de joueurs ----------
   Aucune photo n'est embarquée : le jeu accepte un dictionnaire
   { "Nom du joueur": "https://..." } à charger depuis un fichier ou Supabase. */
function chargerPhotos(dico){
  if(!dico||typeof dico!=='object')return 0;
  let n=0;
  S.joueurs.forEach(j=>{
    const url=dico[j.nom]||dico[j.nom.toLowerCase()];
    if(url&&typeof url==='string'){j.photo=url;n++;}
  });
  S.photos=dico;
  sauver();
  return n;
}
function retirerPhotos(){
  S.joueurs.forEach(j=>{delete j.photo;delete j.photoCredit;});
  delete S.photos;
  sauver();
}

/* ============================================================
   IMPORT DE NOTATIONS EXTERNES
   Accepte un dictionnaire { "Nom": 87 } ou
   { "Nom": {note:87, age:26, poste:"BU"} }. Les noms sont comparés
   sans tenir compte des accents ni de la casse, et un nom abrégé
   ("K. Mbappé") est rapproché de sa forme complète.
   ============================================================ */
function normaliserNom(n){
  return String(n||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
}
function clesDeRapprochement(nom){
  const base=normaliserNom(nom);
  const cles=[base];
  const mots=base.split(' ');
  if(mots.length>1){
    // "kylian mbappe" -> "k mbappe" et "mbappe"
    cles.push(mots[0][0]+' '+mots.slice(1).join(' '));
    cles.push(mots[mots.length-1]);
  }
  return cles;
}
function importerNotes(dico){
  if(!dico||typeof dico!=='object')return {appliques:0,inconnus:0};
  // index des entrées fournies, sous toutes leurs formes
  const index={};
  Object.keys(dico).forEach(k=>{
    clesDeRapprochement(k).forEach(c=>{ if(!index[c])index[c]=dico[k]; });
  });
  let appliques=0;
  const vus=new Set();
  S.joueurs.forEach(j=>{
    let val=null;
    for(const c of clesDeRapprochement(j.nom)){
      if(index[c]!==undefined){val=index[c];vus.add(c);break;}
    }
    if(val==null)return;
    const note=(typeof val==='object')?val.note:val;
    if(typeof note==='number'&&note>=40&&note<=99){
      j.note=Math.round(note);
      j.attr=calculerAttributs(j.nom,j.poste,j.note);
      appliques++;
    }
    if(typeof val==='object'){
      if(typeof val.age==='number'&&val.age>=15&&val.age<=45)j.age=Math.round(val.age);
      if(val.poste&&POSTES.some(p=>p[0]===val.poste)){
        j.poste=val.poste;
        j.poste2=postesSecondaires(val.poste);
        j.attr=calculerAttributs(j.nom,j.poste,j.note);
      }
    }
    j.valeur=valeurMarchande(j.note,j.age);
    j.reel=true;
  });
  const inconnus=Object.keys(dico).length-vus.size;
  if(appliques){
    S.notesImportees=(S.notesImportees||0)+appliques;
    completerOnze();
    sauver();
  }
  return {appliques,inconnus:Math.max(0,inconnus)};
}

/* Convertit un CSV « nom;note;age;poste » (ou séparé par virgules/tabulations). */
function csvVersDico(txt){
  const dico={};
  String(txt||'').split(/\r?\n/).forEach((ligne,i)=>{
    if(!ligne.trim())return;
    const sep=ligne.indexOf(';')>=0?';':(ligne.indexOf('\t')>=0?'\t':',');
    const cols=ligne.split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
    if(i===0&&/nom|name|player/i.test(cols[0])&&!/^\d+$/.test(cols[1]||''))return;  // en-tête
    const nom=cols[0];
    const note=parseFloat(cols[1]);
    if(!nom||isNaN(note))return;
    const e={note};
    const age=parseFloat(cols[2]);
    if(!isNaN(age))e.age=age;
    if(cols[3]&&POSTES.some(p=>p[0]===cols[3].toUpperCase()))e.poste=cols[3].toUpperCase();
    dico[nom]=e;
  });
  return dico;
}

/* ---------- illustration automatique depuis Wikipédia ----------
   L'édition francophone de Wikipédia n'accepte pas le « fair use » : les
   illustrations d'articles y sont donc hébergées sur Commons sous licence
   libre. On récupère l'image d'infobox, puis son auteur et sa licence. */
async function photoDepuisWikipedia(nomComplet){
  const url='https://fr.wikipedia.org/w/api.php'
    +'?action=query&generator=search'
    +'&gsrsearch='+encodeURIComponent(nomComplet)
    +'&gsrlimit=1&prop=pageimages&piprop=thumbnail|name'
    +'&pithumbsize=420&format=json&origin=*';
  const res=await fetch(url);
  if(!res.ok)throw new Error('Wikipédia indisponible (code '+res.status+').');
  const data=await res.json();
  const pages=(data.query&&data.query.pages)||{};
  const page=Object.values(pages)[0];
  if(!page||!page.thumbnail||!page.pageimage)return null;

  // attribution : on interroge Commons sur le fichier utilisé
  let auteur='Auteur non renseigné', licence='Licence libre', pageFichier=null;
  try{
    const u2='https://commons.wikimedia.org/w/api.php'
      +'?action=query&titles='+encodeURIComponent('File:'+page.pageimage)
      +'&prop=imageinfo&iiprop=extmetadata|url&format=json&origin=*';
    const r2=await fetch(u2);
    if(r2.ok){
      const d2=await r2.json();
      const p2=Object.values((d2.query&&d2.query.pages)||{})[0];
      const info=p2&&p2.imageinfo&&p2.imageinfo[0];
      if(info){
        const meta=info.extmetadata||{};
        const lic=stripHtml(meta.LicenseShortName&&meta.LicenseShortName.value);
        if(lic&&!/^(cc|public domain|pd|cc0)/i.test(lic))return null;  // on écarte tout ce qui n'est pas libre
        auteur=stripHtml(meta.Artist&&meta.Artist.value)||auteur;
        licence=lic||licence;
        pageFichier=info.descriptionshorturl||info.descriptionurl||null;
      }
    }
  }catch(e){ /* attribution indisponible : on garde les valeurs par défaut */ }

  return {url:page.thumbnail.source,auteur,licence,page:pageFichier,titre:page.title};
}

/* Parcourt tous les joueurs réels sans photo et tente de les illustrer.
   `progres` est appelé après chaque joueur : (faits, total, nom, trouve). */
async function chargerToutesLesPhotos(progres,arret){
  const cibles=S.joueurs.filter(j=>j.reel&&!j.photo&&NOMS_REELS[j.nom]);
  let faits=0,trouves=0;
  for(const j of cibles){
    if(arret&&arret())break;
    let ok=false;
    try{
      const p=await photoDepuisWikipedia(NOMS_REELS[j.nom]);
      if(p&&p.url){
        j.photo=p.url;
        j.photoCredit={auteur:p.auteur,licence:p.licence,page:p.page};
        trouves++;ok=true;
      }
    }catch(e){ /* on continue : un échec ponctuel ne doit pas tout arrêter */ }
    faits++;
    if(progres)progres(faits,cibles.length,j.nom,ok);
  }
  sauver();
  return {faits,trouves,total:cibles.length};
}

/* ---------- recherche sur Wikimedia Commons ----------
   Uniquement pour les joueurs réels (j.reel). Ne retient que les fichiers
   sous licence libre (Creative Commons ou domaine public) : ce sont les
   seules images que Commons héberge, donc réutilisables avec attribution. */
function stripHtml(s){return String(s||'').replace(/<[^>]*>/g,'').trim();}

async function rechercherPhotoCommons(terme){
  terme=(terme||'').trim();
  if(!terme)return [];
  const requete='intitle:"'+terme+'" filetype:bitmap';
  const url='https://commons.wikimedia.org/w/api.php'
    +'?action=query&generator=search'
    +'&gsrsearch='+encodeURIComponent(requete)
    +'&gsrnamespace=6&gsrlimit=12'
    +'&prop=imageinfo&iiprop=url|extmetadata|size&iiurlwidth=260'
    +'&format=json&origin=*';
  const res=await fetch(url);
  if(!res.ok)throw new Error('Wikimedia Commons indisponible (code '+res.status+').');
  const data=await res.json();
  const pages=(data.query&&data.query.pages)||{};
  const out=[];
  Object.values(pages).forEach(p=>{
    const info=p.imageinfo&&p.imageinfo[0];
    if(!info)return;
    const meta=info.extmetadata||{};
    const licence=stripHtml(meta.LicenseShortName&&meta.LicenseShortName.value);
    if(!/^(cc|public domain|pd|cc0)/i.test(licence))return;   // uniquement du contenu libre
    out.push({
      titre:(p.title||'').replace(/^File:/,''),
      vignette:info.thumburl||info.url,
      grande:info.url,
      page:info.descriptionshorturl||info.descriptionurl||info.url,
      auteur:stripHtml(meta.Artist&&meta.Artist.value)||'Auteur non renseigné',
      licence:licence||'Licence libre',
      largeur:info.width,hauteur:info.height
    });
  });
  return out;
}

const PRIMES={L:{v:900000,n:350000},N:{v:600000,n:0},LDC:{v:2600000,n:900000},EL:{v:1300000,n:450000}};
function encaisser(monMatch,jr){
  if(!monMatch||!monMatch.joue)return;
  const domicile=monMatch.dom===S.monClub;
  const mes=domicile?monMatch.ga:monMatch.gb, siens=domicile?monMatch.gb:monMatch.ga;

  const type=monMatch.heure===HEURE_LIGUE?'L'
    :c.indexOf('Champions')>=0?'LDC':c.indexOf('Europa')>=0?'EL':'N';

    const billetterie=Math.round((CL(S.monClub).force-55)*38000+180000);
    total+=billetterie;detail.push('billetterie');
  }

  if(mes>siens){total+=p.v;detail.push('prime de victoire');}

}

/* ---------- progression : chaque séance rapproche du niveau suivant ---------- */
function facteurAge(j){
  return j.age<=19?1.7:j.age<=21?1.4:j.age<=24?1.1:j.age<=27?0.8:j.age<=30?0.45:0.2;
}
function progresser(j,gain,rng){
  if(j.note>=94){j.prog=0;j.dernierGain=0;return 0;}
  gain=Math.round(gain*100)/100;
  j.dernierGain=gain;
  j.prog=(j.prog||0)+gain;
  let niveaux=0;
  while(j.prog>=1&&j.note<94){
    const etAvant=etoiles(j.note);
    j.prog-=1;j.note++;niveaux++;
    j.valeur=valeurMarchande(j.note,j.age);
    if(etoiles(j.note)>etAvant){
      S.gazette.unshift({jour:S.jour,txt:`${j.nom} atteint ${etoiles(j.note)} étoiles.`});
      posterChat('ENTRAÎNEMENT',`⭐ ${j.nom} gagne une étoile — ${etoiles(j.note)} au total !`,false);
    }else{
      S.gazette.unshift({jour:S.jour,txt:`${j.nom} gagne un niveau (${j.note}).`});
      posterChat('ENTRAÎNEMENT',`📈 ${j.nom} progresse (${j.note}).`,false);
    }
  }
  j.prog=Math.round(j.prog*100)/100;
  return niveaux;
}
function creneau(cle){return (S.creneaux||{})[cle]||null;}
function lancerCreneau(cle,jid,attr,intensite){
  const def=CRENEAUX.find(c=>c.cle===cle);if(!def)return 'Créneau inconnu.';
  const j=J(jid);if(!j||j.club!==S.monClub)return 'Ce joueur n\'est pas dans ton effectif.';
  if(!def.filtre(j))return cle==='soin'?'Ce joueur n\'est pas blessé.':'Ce joueur est blessé, soigne-le d\'abord.';
  if(Object.values(S.creneaux||{}).some(c=>c&&c.joueur===jid))return 'Ce joueur occupe déjà un créneau.';
  S.creneaux=S.creneaux||{};
  const it=(cle==='entr'&&INTENSITES[intensite])?intensite:null;
  const duree=it?INTENSITES[it].duree:def.duree;
  S.creneaux[cle]={joueur:jid,reste:duree,attr:attr||null,intensite:it};
  sauver();return null;
}
function annulerCreneau(cle){
  if(S.creneaux)S.creneaux[cle]=null;
  sauver();
}
function avancerCreneaux(rng){
  S.creneaux=S.creneaux||{};
  Object.keys(S.creneaux).forEach(cle=>{
    const c=S.creneaux[cle];if(!c)return;
    const j=J(c.joueur);
    if(!j||j.club!==S.monClub){S.creneaux[cle]=null;return;}
    c.reste--;
    if(c.reste>0)return;
    S.creneaux[cle]=null;
    if(cle==='soin'){
      j.blesse=0;j.forme=Math.max(j.forme,72);
      ajouterBonus(j.id,'serein',2);
      posterChat('INFIRMERIE',`${j.nom} est de nouveau disponible.`,false);
    }else if(cle==='boost'){
      j.forme=Math.min(100,j.forme+18);j.moral=Math.min(100,j.moral+10);
      ajouterBonus(j.id,'feu',3);
      posterChat('PRÉPARATION',`${j.nom} est en feu 🔥`,false);
    }else if(cle==='recup'){
      j.forme=Math.min(100,j.forme+10);
      ajouterBonus(j.id,'serein',2);
    }else if(cle==='entr'&&c.attr){
      const it=INTENSITES[c.intensite]||INTENSITES.normale;
      const bonusAge=j.age<=21?0.20:j.age<=26?0.05:j.age<=30?-0.08:-0.15;
      j.attr[c.attr]=Math.min(99,j.attr[c.attr]+it.gain);
      if(rng()<Math.max(0.03,it.sur+bonusAge))j.attr[c.attr]=Math.min(99,j.attr[c.attr]+1);
      if(it.risque&&rng()<it.risque){
        j.blesse=ri(rng,2,5);
        posterChat('INFIRMERIE',`${j.nom} s'est blessé à l'entraînement.`,false);
      }else{
        ajouterBonus(j.id,it.apres,2);
      }
      progresser(j,it.prog*facteurAge(j),rng);
    }
  });
}

/* ---------- fins de carrière ----------
   Un joueur raccroche vers la trentaine avancée, d'autant plus tôt que son
   niveau a baissé. Chaque départ est aussitôt compensé par un jeune, pour
   que les effectifs restent complets. */
const AGE_RETRAITE_CERTAINE=41;
function probabiliteRetraite(j){
  if(j.age<33)return 0;
  if(j.age>=AGE_RETRAITE_CERTAINE)return 1;
  // à 33 ans c'est rare, à 40 ans c'est presque acquis ; un bon niveau retarde
  const base=(j.age-32)/9;
  const maintien=Math.max(0,(j.note-70))*0.012;
  return Math.max(0,Math.min(0.95,base-maintien));
}
function prendreLesRetraites(rng){
  const partants=S.joueurs.filter(j=>rng()<probabiliteRetraite(j));
  if(!partants.length)return [];
  const parClub={};
  partants.forEach(j=>{(parClub[j.club]=parClub[j.club]||[]).push(j);});
  const idsPartis=new Set(partants.map(j=>j.id));

  S.joueurs=S.joueurs.filter(j=>!idsPartis.has(j.id));
  idsPartis.forEach(id=>{delete S.index[id];});
  S.onze=S.onze.map(id=>idsPartis.has(id)?null:id);
  S.banc=(S.banc||[]).filter(id=>!idsPartis.has(id));
  S.marche=(S.marche||[]).filter(l=>!idsPartis.has(l.joueur));
  S.offresRecues=(S.offresRecues||[]).filter(o=>!idsPartis.has(o.joueur));
  S.offresEnvoyees=(S.offresEnvoyees||[]).filter(o=>!idsPartis.has(o.joueur));
  Object.keys(S.creneaux||{}).forEach(k=>{
    if(S.creneaux[k]&&idsPartis.has(S.creneaux[k].joueur))S.creneaux[k]=null;
  });

  // chaque club remplace ses partants par des jeunes du même poste
  const nomsPris=new Set(S.joueurs.map(x=>x.nom));
  Object.keys(parClub).forEach(club=>{
    parClub[club].forEach((parti,n)=>{
      const lg=LEAGUES.find(l=>l.id===CL(club).ligue);
      const nat=pick(rng,MIX_NAT[lg.nat]);
      const pool=NOMS[nat];
      const nom=nomLibre(rng,pool,nomsPris);
      const note=Math.max(55,Math.min(80,CL(club).force+ri(rng,-16,-6)));
      const age=ri(rng,17,20);
      const jeune={
        id:club+'#r'+S.saison+'_'+n+'_'+Math.floor(rng()*1e6).toString(36),
        nom,club,poste:parti.poste,note,pays:nat,
        poste2:postesSecondaires(parti.poste),attr:calculerAttributs(nom,parti.poste,note),
        age,forme:ri(rng,70,100),moral:ri(rng,60,95),
        buts:0,passes:0,matchs:0,blesse:0,suspendu:0,cartons:0,
        sommeNotes:0,nbNotes:0,motm:0,rouges:0,prog:0,dernierGain:0,
        reel:false,academie:true,valeur:valeurMarchande(note,age)
      };
      S.joueurs.push(jeune);
      S.index[jeune.id]=jeune;
    });
  });

  const miens=partants.filter(j=>j.club===S.monClub);
  if(miens.length)posterChat('FIN DE CARRIÈRE',
    miens.map(j=>`${j.nom} (${j.age} ans) raccroche les crampons.`).join(' '),false);
  return partants;
}

/* ---------- les clubs de l'ordinateur revoient leur tactique ----------
   Un club qui perd change de disposition ; un club en réussite garde la
   sienne. Les consignes suivent la même logique, et le style se choisit
   pour contrarier celui qui domine le championnat. */
function ajusterTactiquesIA(rng){
  const F=Object.keys(FORMATIONS), ST=Object.keys(STYLES);
  const ME=Object.keys(MENTALITES), PR=Object.keys(PRESSIONS), LA=Object.keys(LARGEURS);

  Object.keys(S.clubs).forEach(club=>{
    if(club===S.monClub)return;
    const t=S.tactiqueIA[club];
    if(!t)return;

    // forme récente : les cinq derniers matchs de championnat
    const derniers=S.resultats.filter(r=>
      (r.dom===club||r.ext===club)&&typeof r.jn==='number').slice(-5);
    if(derniers.length<3)return;
    const points=derniers.reduce((a,r)=>{
      const pour=r.dom===club?r.ga:r.gb, contre=r.dom===club?r.gb:r.ga;
      return a+(pour>contre?3:pour===contre?1:0);
    },0);

    // au-dessus de dix points sur quinze, on ne touche à rien
    if(points>=10)return;
    const mauvais=points<=3;

    // une refonte complète après une très mauvaise série, sinon un réglage
    if(mauvais&&rng()<0.5){
      t.f=pick(rng,F);
      t.s=pick(rng,ST);
    }else if(rng()<0.45){
      t.s=pick(rng,ST);
    }

    // on encaisse trop : on recule ; on ne marque pas : on avance
    const encaisses=derniers.reduce((a,r)=>a+(r.dom===club?r.gb:r.ga),0);
    const marques=derniers.reduce((a,r)=>a+(r.dom===club?r.ga:r.gb),0);
    const i=ME.indexOf(t.m||'Neutre');
    if(encaisses>marques+2&&i>0)t.m=ME[i-1];
    else if(marques<derniers.length&&i<ME.length-1)t.m=ME[i+1];

    if(rng()<0.3)t.p=pick(rng,PR);
    if(rng()<0.25)t.l=pick(rng,LA);
  });
}

/* ---------- centre de formation ---------- */
function jeuneDeLAcademie(rng){
  const lg=LEAGUES.find(l=>l.id===CL(S.monClub).ligue);
  const nat=pick(rng,MIX_NAT[lg.nat]);
  const pool=NOMS[nat];
  // le jeune ne doit pas porter le nom d'un joueur déjà présent dans le monde
  const nom=nomLibre(rng,pool,new Set(S.joueurs.map(x=>x.nom)));
  const poste=pick(rng,['DC','DD','DG','MDC','MC','MOC','AD','AG','BU']);
  const note=ri(rng,60,72);
  const j={
    id:S.monClub+'#jeune'+S.saison+'-'+Math.floor(rng()*1e5),
    nom,club:S.monClub,poste,note,pays:nat,
    poste2:postesSecondaires(poste),attr:calculerAttributs(nom,poste,note),
    age:ri(rng,16,18),forme:ri(rng,75,95),moral:90,
    buts:0,passes:0,matchs:0,blesse:0,suspendu:0,cartons:0,
    sommeNotes:0,nbNotes:0,motm:0,prog:0,dernierGain:0,academie:true,
    valeur:valeurMarchande(note,17)
  };
  S.joueurs.push(j);S.index[j.id]=j;
  return j;
}

/* ---------- palmarès ---------- */
function enregistrerTitres(){
  S.onzeType=onzeTypeSaison();
  S.bilanObjectif=evaluerObjectif();
  const lid=CL(S.monClub).ligue;
  const t=trierClassement(S.classements[lid]);
  if(t[0]&&t[0].club===S.monClub)S.palmares.push({saison:S.saison,comp:LEAGUES.find(l=>l.id===lid).nom,type:'championnat'});
  const cn=S.coupesNat[lid];
  if(cn&&cn.vainqueur===S.monClub)S.palmares.push({saison:S.saison,comp:cn.nom,type:'coupe'});
  ['LDC','EL'].forEach(k=>{
    if(S.coupes[k].vainqueur===S.monClub)S.palmares.push({saison:S.saison,comp:S.coupes[k].nom,type:k==='LDC'?'ldc':'el'});
  });
  const rang=t.findIndex(x=>x.club===S.monClub)+1;
  S.historique.push({saison:S.saison,rang,pts:t[rang-1]?t[rang-1].pts:0});
}

/* ---------- enchaîner sur la saison suivante ---------- */
function nouvelleSaison(){
  const rng=mulberry(hashStr(S.graine+'-s'+(S.saison+1)));
  comptabiliserTitres();
  S.classementFinalManagers=classementManagers().slice(0,30);
  enregistrerTitres();
  S.saison++;S.jour=0;S.resultats=[];S.gazette=[];S.offresRecues=[];S.offresEnvoyees=[];
  const derniere=(S.dates&&S.dates.length)?S.dates[S.dates.length-1]:null;
  S.journees=construireJournees(rng);
  S.dates=construireDates(S.journees,derniere?repriseApres(derniere):lendemainParis(Date.now()));
  S.datesSuivantes=[repriseApres(S.dates[S.dates.length-1])];
  // qualifications européennes d'après le classement final
  const parLigue={};
  LEAGUES.forEach(lg=>{parLigue[lg.id]=trierClassement(S.classements[lg.id]).map(r=>r.club);});
  const ldc=[],el=[];
  LEAGUES.forEach(lg=>{const l=parLigue[lg.id];ldc.push(...l.slice(0,4));el.push(...l.slice(4,8));});
  S.coupes={LDC:creerCoupe('Ligue des Champions',ldc,rng),EL:creerCoupe('Europa League',el,rng)};
  S.coupesNat=creerCoupesNationales(rng);
  LEAGUES.forEach(lg=>{
    S.calendriers[lg.id]=calendrierLigue(lg.clubs.map(c=>c[0]),rng);
    S.classements[lg.id]={};
    lg.clubs.forEach(c=>S.classements[lg.id][c[0]]=nouvelleLigne());
  });
  S.joueurs.forEach(j=>{
    j.buts=0;j.passes=0;j.matchs=0;j.cartons=0;j.rouges=0;j.blesse=0;j.suspendu=0;
    j.sommeNotes=0;j.nbNotes=0;j.motm=0;
    j.age++;
    const prog = j.age<=23 ? ri(rng,0,3) : j.age<=28 ? ri(rng,-1,1) : ri(rng,-3,0);
    j.note=Math.max(52,Math.min(94,j.note+prog));
    if(prog!==0&&j.attr)CLES_ATTR.forEach(k=>{j.attr[k]=Math.max(28,Math.min(99,j.attr[k]+prog));});
    j.forme=ri(rng,70,100);
    j.valeur=valeurMarchande(j.note,j.age);
  });
  prendreLesRetraites(rng);
  S.budget+=Math.round(CL(S.monClub).budget*0.55);
  S.recettes=0;S.journalFinance=[];
  S.bonus=[];S.marche=[];
  S.managers={};                       // le classement de la saison repart de zéro
  if(typeof publierAuMondial==='function')publierAuMondial();
  S.finances={initial:S.budget,achats:0,ventes:0,primes:0};
  definirObjectif();
  // coupe inter-serveur : le tableau se monte tout de suite, la publication
  // vers le stockage se fait ensuite pour alimenter la saison suivante
  ouvrirInterServeur(mulberry(hashStr('inter'+S.graine+S.saison)));
  if(typeof publierQualifies==='function')publierQualifies();
  const jeune=(tailleEffectif(S.monClub)<MAX_EFFECTIF)?jeuneDeLAcademie(rng):null;
  if(jeune)posterChat('CENTRE DE FORMATION',`${jeune.nom} (${jeune.poste}, ${jeune.age} ans) intègre le groupe pro.`,false);
  else posterChat('CENTRE DE FORMATION','Aucune promotion cette saison : le groupe professionnel est au complet.',false);
  completerOnze();
  sauver();
}

function fmtM(v){
  if(v>=1e6)return (v/1e6).toFixed(1).replace('.',',')+' M €';
  return Math.round(v/1e3)+' k €';
}

    if(!res.ok){
      const msg=(donnees&&(donnees.msg||donnees.message||donnees.error_description||donnees.error))

  /* Supabase authentifie par courriel : on en fabrique un à partir du

  function courrielDe(pseudo){

      .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')+'@joueurs.thenextone';

                    '« Confirm email » dans Authentication > Sign In / Providers.'};
      session={access_token:r.access_token,refresh_token:r.refresh_token,user:r.user,pseudo};

  function normaliser(ligne){
    const membres={};
    (ligne.membres||[]).forEach(m=>{
      const p=m.profils&&m.profils.pseudo;
      if(p)membres[p]=m.club;
    });

  async function creerServeurNuage(code,graine,auto,motif){
    // le numéro est attribué par la base, le nom en découle
    const r=await appel('/rest/v1/serveurs',{method:'POST',
      entetes:{'Prefer':'return=representation'},
      corps:{nom:'Serveur',code,graine,auto:!!auto,motif:motif||null}});
    const ligne=r&&r[0];
    if(!ligne)return null;
    try{
      await appel('/rest/v1/serveurs?id=eq.'+ligne.id,{method:'PATCH',
        corps:{nom:'Serveur #'+ligne.numero}});

  /* Un serveur ouvert doit toujours exister, sinon personne ne peut jouer :
     la création manuelle demande dix jours d'assiduité. On en ouvre donc un
     automatiquement quand il n'y en a plus, ou toutes les deux heures. */
  const OUVERTURE_LIBRE=3*24*60*60*1000;
  const REPOS_ENTRE_OUVERTURES=2*60*60*1000;

  async function assurerServeurOuvert(liste){
    if(!connecte())return null;
    const serveurs=liste||await listerServeursNuage();
    if(!serveurs)return null;
    const maintenant=Date.now();
    const ouverts=serveurs.filter(s=>maintenant-s.cree<OUVERTURE_LIBRE);
    const dernier=serveurs.reduce((a,s)=>Math.max(a,s.cree||0),0);
    const besoin=ouverts.length===0||(maintenant-dernier)>=REPOS_ENTRE_OUVERTURES;
    if(!besoin)return null;
    return await ouvrirServeurAutomatique(
      ouverts.length===0?'aucun serveur ouvert':'ouverture périodique');

  async function ouvrirServeurAutomatique(motif){

        if(!/duplicate|unique/i.test(e.message))return null;
      }

    return null;

/* Joue les journées dues, signale le résultat, puis rafraîchit l'écran. */
function avancerEtAfficher(silencieux){
  if(!S||S.observation)return [];
  const avantEurope=(()=>{
    const jr=S.journees[S.jour];
    return !!(jr&&jr.coupe&&jr.coupe.t==='C'&&
      ['LDC','EL'].some(k=>(S.coupes[k].tour[jr.coupe.ronde[0]]||[])
        .some(p=>p[0]===S.monClub||p[1]===S.monClub)));
  })();
  const saisonAvant=S.saison;
  const joues=rattraperJournees();
  if(Nuage.connecte()&&S.serveur&&S.saison>saisonAvant){
    // une saison vient de s'achever : les totaux partent au classement mondial
    Nuage.publierClassement(S.serveur,S.numServeur||1,sommetDuServeur(20));
  }
  if(joues.length&&Nuage.connecte()&&S.serveur){
    // la partie remonte dès qu'elle a bougé, pour que les autres la voient
    Nuage.televerser(S.serveur,sansIndex());
    Nuage.signalerPresence(S.serveur);
  }
  if(!joues.length){ if(!silencieux)rendre(); return joues; }
  if(!silencieux){
    if(avantEurope)Audio2.jouerHymne(); else Audio2.jouer('sifflet');
    const dernier=joues[joues.length-1];
    const moi=dernier.dom===S.monClub?dernier.ga:dernier.gb;
    const lui=dernier.dom===S.monClub?dernier.gb:dernier.ga;
    Audio2.jouer(moi>lui?'but':moi<lui?'encaisse':'notification');
    rendre();
    modaleMatch(dernier);
  }else rendre();
  return joues;
}

    <label class="lbl">Pseudo<input id="au_p" maxlength="14" autocomplete="username" placeholder="TIGLOUU"></label>

    // compte en ligne d'abord, repli sur le compte local si le nuage ne répond pas
    let res=null;
    if(await Nuage.tester()){
      res=modeAuth==='inscription'?await Nuage.inscrire(p,mdp):await Nuage.connecter(p,mdp);
      if(!res.err){
        // on tient aussi un compte local, pour pouvoir jouer hors ligne
        const local=await connecter(p,mdp);
        if(local.err)await inscrire(p,mdp);
      }
    }else{
      res=modeAuth==='inscription'?await inscrire(p,mdp):await connecter(p,mdp);
      if(!res.err)zoneErr.textContent='';

    go.disabled=false;go.textContent=libelle;

    sessionPseudo=res.pseudo;
